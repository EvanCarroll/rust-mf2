# CI for rust-mf2.
#
# Job `ci`: the only work step is `cargo xtask ci`: it runs exactly what this
# job checks (cargo fmt --check, clippy -D warnings — natively, and for
# wasm32-unknown-unknown with the `intl` client option, whose code compiles
# only there — cargo test for the workspace and again for `mf2-resource`'s
# optional `serde` feature, which nothing in the workspace turns on, the
# combinations of mf2's features that mf2 refuses, each failing with
# mf2's one sentence — `cargo xtask refusals` — the
# documentation's samples assembled (job `docs` compiles them), the
# conformance report, which runs layers L1-L5
# over the suite, and the published crates' public API held against each
# crate's committed api.txt — `cargo xtask api --check`, which installs the
# pinned nightly whose rustdoc JSON it reads through rustup — and
# each package as crates.io would receive it, audited and held against its
# committed package.txt — `cargo xtask package --check`), so "green
# locally" and "green in CI" mean the same thing. The other steps fetch the
# sources, install the toolchain, fetch the MF2 specification text into its
# cache (it is not vendored — upstream #1112; every job does this first) and
# publish conformance/REPORT.md.
#
# Job `parser-gate`: the D1 gate — mf2-syntax against
# ox_mf2_parser, same process, release build — so a later regression is
# visible. Its cost (a fat-LTO release build plus ≈ 15 s of measurement) is
# why it is a job of its own rather than a step of `cargo xtask ci`; whether it
# runs on every push is the owner's call.
#
# Job `tui-gate`: the terminal UI's gate (`cargo xtask tui-gate --gate`):
# examples/tui's frame, drawn
# with MF2, allocates no more than 1.x's did and no more than the in-house
# re-implementation of trippy's approach, in every language — counts that
# are the same in every run, so they are held on every push — and stripped
# `tui-mf2` is no larger than 1.x's. Its time per frame is the nightly's.
#
# Job `native-canaries`: guard rail 1 of `plan/01` §6.1 (`cargo xtask
# native-canaries`): the smallest native application (`tools/native-canary`)
# is linked once per feature set, unstripped, in the profile releases use,
# and its symbols read — so that a feature set that must not pull a heavy
# crate in cannot start doing so unnoticed. The report says which of jiff,
# unicode-normalization, ryu, sha2 and sys-locale each set links. A job of
# its own, beside `tui-gate`: it is two release builds.
#
# Job `b12`: budget B12 for the catalog reader: bench/b12/check.sh builds no_std wasm
# harnesses (fat LTO, wasm-opt -Oz) and fails if a panic path or core::fmt
# survives in the reader; it also records the reader's size delta (part of
# B1). Every figure is `brotli -q 11 --lgwin=22`, the setting mf2-build
# compresses catalogs with (owner, 2026-10-05: brotli is what ships, so brotli
# is what is measured). It needs binaryen (wasm-opt, wasm-dis), which the image brings, and
# twiggy, which tools/ci/setup.sh installs. The pinned binaryen tarball this
# job used to download is a glibc build and cannot run on the image, so the
# image's own wasm-opt is what takes these figures — its version is printed at
# the head of every report, because the figures belong to it.
#
# Job `catalog-size`: budget B7 on the committed reference corpus and the
# four generated locales (bench/catalog-bench). Deterministic, ≈ 30 s of release
# build and 4 s of
# work. B7 is stated on brotli 11, as every size figure now is; the gzip
# figures are reported, not gated, and on this image come from flate2 and
# zlib-rs — Alpine's `gzip` is busybox, which cannot stand in for GNU's.
#
# Job `build-pipeline`: Phase 5a's two whole-pipeline checks: `cargo xtask
# codegen-matrix` compiles the generated module in the 23
# feature combinations of the facade the feature-set table holds
# (`xtask/src/feature_sets.rs`: 8 server, 5 native, 10 client on
# wasm32-unknown-unknown) and
# greps the client artifact for budget B6; `cargo xtask scenarios` runs the
# incremental-rebuild scenarios of P0.9 on tools/i18n-fixture, where a
# translation-only edit must leave the client wasm byte-identical.
#
# Job `docs`: the mdBook content is assembled and its checked application
# examples are compiled (Phase 7 A13). `cargo xtask docs` assembles the
# `rust`, `toml` and `mf2` blocks of docs/*.md — running the `mf2 init` the
# pages show and checking generated files against their examples — then
# checks each project for its documented targets with warnings denied. This
# includes the three native applications (a CLI, a Ratatui TUI and a
# two-crate workspace). A client-only
# example also publishes catalogs with `mf2 compile --site`. GitHub Actions
# separately builds and deploys the rendered book once the repository is on
# GitHub. `cargo xtask ci` assembles examples without building them.
#
# Job `l4-wasi`: conformance layer L4 on wasm32-wasip1: `cargo xtask l4-wasi` compiles
# every L4 case natively, formats it natively and with the same runner built
# for wasm32-wasip1 under wasmtime, and fails unless every record is
# identical byte for byte — and the same for 20,000 generated cases
# (`--generated`, A10: messages from message.abnf steered towards the
# runtime's functions, with generated arguments). wasmtime is pinned (49.0.0)
# and installed into target/tools with `cargo install --locked`, as locally.
#
# Job `msrv`: the 18 published crates on the Rust they state as
# `rust-version` (docs/versioning.md).
# `cargo xtask msrv` installs that toolchain with rustup and checks the
# library targets natively and for wasm32-unknown-unknown, on both Leptos
# lines; `--below` must see the release before it fail, so a lower MSRV
# that would do is noticed.
#
# Job `docs-rs`: the published crates' documentation built as docs.rs builds
# it. `cargo xtask docs-rs` reads each
# library crate's `[package.metadata.docs.rs]` — its features and targets —
# and runs `cargo rustdoc` on the nightly `cargo xtask api` pins (installed
# with rustup), with `--cfg docsrs`, every rustdoc warning an error (a
# broken intra-doc link among them), and each front page pointing to the
# user guide.
#
# Job `release`: the release's dry run (owner question 4): `cargo xtask release`
# without `--publish` — the tree
# clean, the changelog entry, the metadata, the 18 names on crates.io (its
# API, a second apart), the public API against the published version with
# cargo-semver-checks (pinned, installed into target/tools; nothing to
# compare with on 1.0.0), then `cargo xtask ci`, the packages' own tests,
# the docs.rs build, the MSRV and `cargo publish --workspace --dry-run`. It
# repeats the `ci`, `msrv` and `docs-rs` jobs' work, so that one command is
# what says a commit can be released. It holds no token: the publish is the
# owner's, and `--publish` refuses to run where `CI` is set. Because it repeats
# that much work, it runs on a tag or when asked for by hand, not on every push.
#
# Job `report`: one file for the whole run. It waits for every job, runs
# whatever they did, and `tools/ci/report.sh` folds each job's artifact into
# REPORT.md — headed with the tool versions the figures came from, with a result
# per job, and with the checks this runner cannot do
# (tools/ci/local-only.txt) named so a release is never signed off without
# seeing that they did not run. Uploaded as `mf2-report` and printed into the
# job's log, so a run can be read without downloading anything.
#
# The runner: Forgejo's `docker` label and `evancarroll/mf2-ci`, a public copy
# of the image the other Rust repositories here build with — made by
# `devops/sync-ci-image.sh`, because the original's owner is private and Forgejo
# has no per-package visibility. Public, so no `credentials:` and no secret: an
# empty one is what act_runner reports as "failed to interpolate
# container.credentials.password". It is Alpine, so
# everything native is musl. tools/ci/setup.sh adds what the image lacks and
# names every tool version; every step that calls cargo unsets
# CARGO_BUILD_TARGET first, because the image pins the musl triple and that
# would move artifacts out of target/{debug,release}, where `cargo xtask docs`,
# native-canaries and tui-gate look for them. An empty value is not the same
# thing: cargo refuses it.
#
# Actions: only Forgejo-maintained forks. upload-artifact and download-artifact
# come from https://code.forgejo.org/forgejo/ (tag v5 = upstream v5.0.0 +
# "disable GHES check", checked 2026-09-20); the code.forgejo.org/actions
# mirror says its v4+ does not work on Forgejo. The cache is the exception:
# there is no code.forgejo.org/forgejo/cache fork (checked 2026-10-05), so it
# comes from code.forgejo.org/actions/cache@v4, which is what the other Rust
# repositories here use. Sources are fetched with plain git in a run step.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# One run per ref: a push that supersedes another cancels it, so a queue of
# stale runs cannot hold the runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One red job still costs this run its evidence, and `continue-on-error` does
# not buy it back: this runner (`cow` v12.6.3) does not honour it at job level.
# Run 20 lost `ci`, `docs` and `l4-wasi` part-built and never started `msrv`,
# `docs-rs`, `release` or `report`; run 21, with every gate job marked
# `continue-on-error: true`, died the same way 171 s in when `ci` failed its
# first step. The lines below are kept because they say the intent and will
# work when the runner does, but nothing here relies on them yet — and the
# `report` job's closing step, which fails the run unless every result is
# `success` or `skipped`, only judges a run that reaches it.
#
# What does help today is inside a job: `cargo xtask ci --keep-going` runs
# every step past a failure instead of stopping at the first, so one `ci` job
# lists everything wrong with the tree. Doing the same across jobs needs each
# to record its own verdict into the artifact it already uploads, for `report`
# to collect — not done, and the owner's to want.
jobs:
  ci:
    continue-on-error: true
    # The runner: Forgejo's `docker` label, in the image the other Rust
    # repositories here build with. It is Alpine, so everything native is musl.
    # tools/ci/setup.sh adds what the image lacks — xmllint (which
    # `mf2-cli`'s XLIFF tests fail without, rather than skip), brotli, nm —
    # installs the toolchain rust-toolchain.toml pins, and prints every tool's
    # version so a figure in the report is attributable.
    runs-on: docker
    container:
      image: git.coworkunion.com/evancarroll/mf2-ci:latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          # The image is Alpine and has no bash, but bench/b12/check.sh,
          # tools/checks/*.sh and tools/fmt-check.sh are bash scripts with
          # arrays and [[ ]]. This is every job's first step, so bash is here
          # before anything needs it. tools/ci/setup.sh asks for it too, in case
          # this stops being the first step.
          apk add --no-cache bash >/dev/null
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Cache the cargo registry
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            /root/.cargo/registry/index/
            /root/.cargo/registry/cache/
            /root/.cargo/git/db/
          key: cargo-registry-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            cargo-registry-

      - name: Set the job up (packages, toolchain, tool versions)
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/ci.log) 2>&1
          sh tools/ci/setup.sh

      - name: Start sccache
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/ci.log) 2>&1
          sccache --start-server || true
          sccache --show-stats

      - name: Fetch the MF2 specification text (not vendored, upstream #1112)
        # Into target/xtask-cache, checked against the PIN's digests; --check
        # also holds the vendored suite byte for byte against upstream.
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/ci.log) 2>&1
          unset CARGO_BUILD_TARGET
          cargo xtask spec-sync --check

      - name: cargo xtask ci
        # `--keep-going`: every step even after one fails, `cargo test` with
        # `--no-fail-fast`, and the failed steps listed at the end (still exit
        # 1). Without it this stops at the first, which is how run 21 spent a
        # job to say only that `cargo fmt --all --check` was unhappy and left
        # clippy, the tests and the docs check unknown. A run here costs about
        # a quarter of an hour; it should answer more than one question.
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/ci.log) 2>&1
          unset CARGO_BUILD_TARGET
          cargo xtask ci --keep-going

      - name: Upload the conformance report
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: conformance-report
          path: conformance/REPORT.md
          if-no-files-found: error

      - name: Upload this job's log
        # The only way to read what a step printed: this Forgejo serves no job
        # logs over its API (checked 2026-10-06 — 314 routes, none for logs),
        # but artifacts download fine, anonymously, by run id.
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: log-ci
          path: target/ci-logs/
          if-no-files-found: warn

  parser-gate:
    continue-on-error: true
    # See the `ci` job in ci.yml: the `docker` label, the public `mf2-ci` image,
    # tools/ci/setup.sh.
    runs-on: docker
    container:
      image: git.coworkunion.com/evancarroll/mf2-ci:latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          # The image is Alpine and has no bash, but bench/b12/check.sh,
