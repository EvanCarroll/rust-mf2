      - name: Fetch the MF2 specification text (not vendored, upstream #1112)
        # Into target/xtask-cache, checked against the PIN's digests; --check
        # also holds the vendored suite byte for byte against upstream.
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/docs-rs.log) 2>&1
          unset CARGO_BUILD_TARGET
          cargo xtask spec-sync --check

      - name: The documentation, as docs.rs builds it
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/docs-rs.log) 2>&1
          unset CARGO_BUILD_TARGET
          cargo xtask docs-rs

      - name: Upload this job's log
        # The only way to read what a step printed: this Forgejo serves no job
        # logs over its API (checked 2026-10-06 — 314 routes, none for logs),
        # but artifacts download fine, anonymously, by run id.
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: log-docs-rs
          path: target/ci-logs/
          if-no-files-found: warn

  release:
    continue-on-error: true
    # The dry run repeats the `ci`, `msrv`, `docs-rs` and `package` work, so it
    # is not run on every push: a tag, or asked for by hand. `cargo xtask
    # release --publish` refuses to run where CI is set, by design — publishing
    # stays the owner's, on the owner's machine.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    # See the `ci` job in ci.yml: the `docker` label, the public `mf2-ci` image,
    # tools/ci/setup.sh.
    runs-on: docker
    container:
      image: git.coworkunion.com/evancarroll/mf2-ci:latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          # The image is Alpine and has no bash, but bench/b12/check.sh,
          # tools/checks/*.sh and tools/fmt-check.sh are bash scripts with
          # arrays and [[ ]]. This is every job's first step, so bash is here
          # before anything needs it. tools/ci/setup.sh asks for it too, in case
          # this stops being the first step.
          apk add --no-cache bash >/dev/null
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Cache the cargo registry
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            /root/.cargo/registry/index/
            /root/.cargo/registry/cache/
            /root/.cargo/git/db/
          key: cargo-registry-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            cargo-registry-

      - name: Set the job up (packages, toolchain, tool versions)
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/release.log) 2>&1
          sh tools/ci/setup.sh

      - name: Start sccache
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/release.log) 2>&1
          sccache --start-server || true
          sccache --show-stats

      - name: Fetch the MF2 specification text (not vendored, upstream #1112)
        # Into target/xtask-cache (git-ignored, so the tree stays clean).
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/release.log) 2>&1
          unset CARGO_BUILD_TARGET
          cargo xtask spec-sync --check

      - name: The release, as a dry run (never publishes)
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/release.log) 2>&1
          unset CARGO_BUILD_TARGET
          cargo xtask release

      - name: Upload this job's log
        # The only way to read what a step printed: this Forgejo serves no job
        # logs over its API (checked 2026-10-06 — 314 routes, none for logs),
        # but artifacts download fine, anonymously, by run id.
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: log-release
          path: target/ci-logs/
          if-no-files-found: warn

  report:
    # Everything this run measured, in one file. tools/ci/report.sh folds every
    # job's artifact into REPORT.md, heads it with the tool versions that
    # produced the figures — the image's digest is not visible to a job, so the
    # versions are what attributes a number — and lists the browser checks that
    # did not run here (tools/ci/local-only.txt). It is uploaded as
    # `mf2-report` and printed into this job's log, so the run can be read
    # without downloading anything.
    needs:
      - ci
      - parser-gate
      - tui-gate
      - native-canaries
      - catalog-size
      - b12
      - build-pipeline
      - docs
      - l4-wasi
      - msrv
      - docs-rs
      - release
    if: always()
    # See the `ci` job in ci.yml: the `docker` label, the public `mf2-ci` image,
    # tools/ci/setup.sh.
    runs-on: docker
    container:
      image: git.coworkunion.com/evancarroll/mf2-ci:latest
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          # The image is Alpine and has no bash, but bench/b12/check.sh,
          # tools/checks/*.sh and tools/fmt-check.sh are bash scripts with
          # arrays and [[ ]]. This is every job's first step, so bash is here
          # before anything needs it. tools/ci/setup.sh asks for it too, in case
          # this stops being the first step.
          apk add --no-cache bash >/dev/null
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Download every artifact this run produced
        # A run where every job failed has nothing to download, and the report
        # is wanted most of all then. Never let this step be why there is none.
        continue-on-error: true
        # No `name`: each artifact lands in its own directory under artifacts/.
        uses: https://code.forgejo.org/forgejo/download-artifact@v5
        with:
          path: artifacts

      - name: Set the job up (for the versions the report is headed with)
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/report.log) 2>&1
          sh tools/ci/setup.sh

      - name: Assemble the report
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          WORKFLOW: ${{ github.workflow }}
          GIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
          IMAGE: git.coworkunion.com/evancarroll/mf2-ci:latest
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/report.log) 2>&1
          set -eu
          unset CARGO_BUILD_TARGET
          sh tools/ci/report.sh artifacts > REPORT.md
          echo "================ REPORT.md ================"
          cat REPORT.md

      - name: Upload the report
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: mf2-report
          path: REPORT.md
          if-no-files-found: error

      - name: Upload this job's log
        # The only way to read what a step printed: this Forgejo serves no job
        # logs over its API (checked 2026-10-06 — 314 routes, none for logs),
        # but artifacts download fine, anonymously, by run id.
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: log-report
          path: target/ci-logs/
          if-no-files-found: warn

      - name: The run is red unless every job passed
        # Last, so that REPORT.md is written and uploaded first: the report is
        # wanted most when something failed. `skipped` passes — `release` is
        # skipped on every plain push, by its own `if:`. jq is in the image and
        # tools/ci/setup.sh checks for it, so this cannot fail for want of it.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -eu
          bad=$(printf '%s' "$NEEDS_JSON" | jq -r '
            [ to_entries[]
              | select(.value.result != "success" and .value.result != "skipped")
              | "\(.key)=\(.value.result)" ] | join(" ")')
          if [ -n "$bad" ]; then
            echo "not green: $bad" >&2
            echo "REPORT.md and each job's log artifact say why." >&2
            exit 1
          fi
          echo "every job passed or was skipped"
