  report:
    # Everything this run measured, in one file. tools/ci/report.sh folds every
    # job's artifact into REPORT.md, heads it with the tool versions that
    # produced the figures — the image's digest is not visible to a job, so the
    # versions are what attributes a number — and lists the browser checks that
    # did not run here (tools/ci/local-only.txt). It is uploaded as
    # `mf2-report` and printed into this job's log, so the run can be read
    # without downloading anything.
    needs:
      - ci
      - parser-gate
      - tui-gate
      - native-canaries
      - catalog-size
      - b12
      - build-pipeline
      - docs
      - l4-wasi
      - msrv
      - docs-rs
      - release
    if: always()
    # See the `ci` job: the `docker` label, the leptos-builder image,
    # tools/ci/setup.sh.
    runs-on: docker
    container:
      image: git.coworkunion.com/coworkunion/chattyness/leptos-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          # The image is Alpine and has no bash, but bench/b12/check.sh,
          # tools/checks/*.sh and tools/fmt-check.sh are bash scripts with
          # arrays and [[ ]]. This is every job's first step, so bash is here
          # before anything needs it. tools/ci/setup.sh asks for it too, in case
          # this stops being the first step.
          apk add --no-cache bash >/dev/null
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Download every artifact this run produced
        # A run where every job failed has nothing to download, and the report
        # is wanted most of all then. Never let this step be why there is none.
        continue-on-error: true
        # No `name`: each artifact lands in its own directory under artifacts/.
        uses: https://code.forgejo.org/forgejo/download-artifact@v5
        with:
          path: artifacts

      - name: Set the job up (for the versions the report is headed with)
        run: sh tools/ci/setup.sh

      - name: Assemble the report
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          WORKFLOW: ${{ github.workflow }}
          GIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
          IMAGE: git.coworkunion.com/coworkunion/chattyness/leptos-builder:latest
        run: |
          set -eu
          unset CARGO_BUILD_TARGET
          sh tools/ci/report.sh artifacts > REPORT.md
          echo "================ REPORT.md ================"
          cat REPORT.md

      - name: Upload the report
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: mf2-report
          path: REPORT.md
          if-no-files-found: error
