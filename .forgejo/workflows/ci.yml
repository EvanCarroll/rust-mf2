          exec > >(tee -a target/ci-logs/parser-gate.log) 2>&1
          unset CARGO_BUILD_TARGET
          cargo xtask spec-sync --check

      - name: D1 gate (release build, median of 31, exit 1 on failure)
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/parser-gate.log) 2>&1
          unset CARGO_BUILD_TARGET
          cargo run --release -p parser-gate -- --gate

      - name: Upload the gate report
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: parser-gate-report
          path: |
            target/parser-gate/report.md
            target/parser-gate/report.json
          if-no-files-found: error

      - name: Upload this job's log
        # The only way to read what a step printed: this Forgejo serves no job
        # logs over its API (checked 2026-10-06 — 314 routes, none for logs),
        # but artifacts download fine, anonymously, by run id.
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: log-parser-gate
          path: target/ci-logs/
          if-no-files-found: warn

  tui-gate:
    continue-on-error: true
    # See the `ci` job in ci.yml: the `docker` label, the public `mf2-ci` image,
    # tools/ci/setup.sh.
    runs-on: docker
    container:
      image: git.coworkunion.com/evancarroll/mf2-ci:latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
