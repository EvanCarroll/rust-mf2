# CI for rust-mf2 (plans/07-phase-0-work-order.md, task A6; plans/08, A9).
#
# Job `ci`: the only work step is `cargo xtask ci`: it runs exactly what this
# job checks (cargo fmt --check, clippy -D warnings — natively, and for
# wasm32-unknown-unknown with the `intl` client option, whose code compiles
# only there — cargo test for the workspace and again for `mf2-resource`'s
# optional `serde` feature, which nothing in the workspace turns on, the
# combinations of mf2's features that plans/19 §3 refuses, each failing with
# mf2's one sentence — `cargo xtask refusals` — the
# documentation's samples assembled (job `docs` compiles them), the
# conformance report, which runs layers L1-L5
# over the suite, and the published crates' public API held against each
# crate's committed api.txt — `cargo xtask api --check`, which installs the
# pinned nightly whose rustdoc JSON it reads through rustup, plans/17 A2 — and
# each package as crates.io would receive it, audited and held against its
# committed package.txt — `cargo xtask package --check`, plans/17 A4), so "green
# locally" and "green in CI" mean the same thing. The other steps fetch the
# sources, install the toolchain, fetch the MF2 specification text into its
# cache (it is not vendored — upstream #1112; every job does this first,
# plans/17-phase-9-work-order.md A0) and publish conformance/REPORT.md.
#
# Job `parser-gate`: the D1 gate (plans/05-tooling.md §1) — mf2-syntax against
# ox_mf2_parser, same process, release build — so a later regression is
# visible. Its cost (a fat-LTO release build plus ≈ 15 s of measurement) is
# why it is a job of its own rather than a step of `cargo xtask ci`; whether it
# runs on every push is the owner's call (plans/08, A9).
#
# Job `tui-gate`: the terminal UI's gate (plans/19-native-and-terminal.md
# §8 and §14; `cargo xtask tui-gate --gate`): examples/tui's frame, drawn
# with MF2, allocates no more than 1.x's did and no more than the in-house
# re-implementation of trippy's approach, in every language — counts that
# are the same in every run, so they are held on every push — and stripped
# `tui-mf2` is no larger than 1.x's. Its time per frame is the nightly's.
#
# Job `native-canaries`: guard rail 1 of `plan/01` §6.1 (`cargo xtask
# native-canaries`): the smallest native application (`tools/native-canary`)
# is linked once per feature set, unstripped, in the profile releases use,
# and its symbols read — so that a feature set that must not pull a heavy
# crate in cannot start doing so unnoticed. The report says which of jiff,
# unicode-normalization, ryu, sha2 and sys-locale each set links. A job of
# its own, beside `tui-gate`: it is two release builds.
#
# Job `b12`: budget B12 for the catalog reader (plans/09-phase-2-work-order.md,
# A9; plans/06-size-and-perf.md §3): bench/b12/check.sh builds no_std wasm
# harnesses (fat LTO, wasm-opt -Oz) and fails if a panic path or core::fmt
# survives in the reader; it also records the reader's size delta (part of
# B1). It needs binaryen (wasm-opt, wasm-dis) and twiggy, installed at pinned
# versions: binaryen from its release tarball (checked against the published
# sha256), twiggy with `cargo install --locked`.
#
# Job `catalog-size`: budget B7 on the committed reference corpus and the
# four generated locales (plans/09-phase-2-work-order.md, A8;
# bench/catalog-bench). Deterministic, ≈ 30 s of release build and 4 s of
# work. B7 is stated on brotli 11 (plans/06 §3); the gzip figures are
# reported, not gated, with GNU gzip when the runner has it (else flate2).
#
# Job `build-pipeline`: Phase 5a's two whole-pipeline checks (plans/12, A5 and
# A9): `cargo xtask codegen-matrix` compiles the generated module in the 23
# feature combinations of the facade the feature-set table holds
# (`xtask/src/feature_sets.rs`: 8 server, 5 native, 10 client on
# wasm32-unknown-unknown) and
# greps the client artifact for budget B6; `cargo xtask scenarios` runs the
# incremental-rebuild scenarios of P0.9 on tools/i18n-fixture, where a
# translation-only edit must leave the client wasm byte-identical.
#
# Job `docs`: the mdBook content is assembled and its checked application
# examples are compiled (Phase 7 A13). `cargo xtask docs` assembles the
# `rust`, `toml` and `mf2` blocks of docs/*.md — running the `mf2 init` the
# pages show and checking generated files against their examples — then
# checks each project for its documented targets with warnings denied. This
# includes the three native applications (a CLI, a Ratatui TUI and a
# two-crate workspace). A client-only
# example also publishes catalogs with `mf2 compile --site`. GitHub Actions
# separately builds and deploys the rendered book once the repository is on
# GitHub. `cargo xtask ci` assembles examples without building them.
#
# Job `l4-wasi`: conformance layer L4 on wasm32-wasip1 (plans/01-conformance.md
# §3; plans/10-phase-3-work-order.md, A9): `cargo xtask l4-wasi` compiles
# every L4 case natively, formats it natively and with the same runner built
# for wasm32-wasip1 under wasmtime, and fails unless every record is
# identical byte for byte — and the same for 20,000 generated cases
# (`--generated`, A10: messages from message.abnf steered towards the
# runtime's functions, with generated arguments). wasmtime is pinned (49.0.0)
# and installed into target/tools with `cargo install --locked`, as locally.
#
# Job `msrv`: the 18 published crates on the Rust they state as
# `rust-version` (plans/17-phase-9-work-order.md, A3; docs/versioning.md).
# `cargo xtask msrv` installs that toolchain with rustup and checks the
# library targets natively and for wasm32-unknown-unknown, on both Leptos
# lines; `--below` must see the release before it fail, so a lower MSRV
# that would do is noticed.
#
# Job `docs-rs`: the published crates' documentation built as docs.rs builds
# it (plans/17-phase-9-work-order.md, A5). `cargo xtask docs-rs` reads each
# library crate's `[package.metadata.docs.rs]` — its features and targets —
# and runs `cargo rustdoc` on the nightly `cargo xtask api` pins (installed
# with rustup), with `--cfg docsrs`, every rustdoc warning an error (a
# broken intra-doc link among them), and each front page pointing to the
# user guide.
#
# Job `release`: the release's dry run (plans/17-phase-9-work-order.md, A7;
# owner question 4): `cargo xtask release` without `--publish` — the tree
# clean, the changelog entry, the metadata, the 18 names on crates.io (its
# API, a second apart), the public API against the published version with
# cargo-semver-checks (pinned, installed into target/tools; nothing to
# compare with on 1.0.0), then `cargo xtask ci`, the packages' own tests,
# the docs.rs build, the MSRV and `cargo publish --workspace --dry-run`. It
# repeats the `ci`, `msrv` and `docs-rs` jobs' work, so that one command is
# what says a commit can be released. It holds no token: the publish is the
# owner's, and `--publish` refuses to run where `CI` is set. Its runner needs
# what the `ci` job's does.
#
# Actions: only Forgejo-maintained forks. upload-artifact comes from
# https://code.forgejo.org/forgejo/upload-artifact (tag v5 = upstream v5.0.0 +
# "disable GHES check", checked 2026-09-20); the code.forgejo.org/actions
# mirror says its v4+ does not work on Forgejo. Sources are fetched with plain
# git in a run step.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    # PLACEHOLDER: the remote host is not decided yet (plans/07, "The owner's
    # part"). Replace this label with one the chosen host's runner offers. The
    # runner needs git, curl, a C linker (cc), node (for upload-artifact) and
    # xmllint (libxml2; `mf2-cli`'s tests validate every XLIFF export against
    # the vendored schema, plans/05-tooling.md §6.3, and fail without it).
    runs-on: PLACEHOLDER-runner-label
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Install the Rust toolchain (rustup; rust-toolchain.toml pins it)
        run: |
          set -eu
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          # No argument: installs the channel, components and targets named in
          # rust-toolchain.toml.
          rustup toolchain install
          rustup show active-toolchain

      - name: Fetch the MF2 specification text (not vendored, upstream #1112)
        # Into target/xtask-cache, checked against the PIN's digests; --check
        # also holds the vendored suite byte for byte against upstream.
        run: cargo xtask spec-sync --check

      - name: cargo xtask ci
        run: cargo xtask ci

      - name: Upload the conformance report
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: conformance-report
          path: conformance/REPORT.md
          if-no-files-found: error

  parser-gate:
    # PLACEHOLDER: see the `ci` job.
    runs-on: PLACEHOLDER-runner-label
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Install the Rust toolchain (rustup; rust-toolchain.toml pins it)
        run: |
          set -eu
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install
          rustup show active-toolchain

      - name: Fetch the MF2 specification text (not vendored, upstream #1112)
        # Into target/xtask-cache, checked against the PIN's digests; --check
        # also holds the vendored suite byte for byte against upstream.
        run: cargo xtask spec-sync --check

      - name: D1 gate (release build, median of 31, exit 1 on failure)
        run: cargo run --release -p parser-gate -- --gate

      - name: Upload the gate report
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: parser-gate-report
          path: |
            target/parser-gate/report.md
            target/parser-gate/report.json
          if-no-files-found: error

  tui-gate:
    # PLACEHOLDER: see the `ci` job.
    runs-on: PLACEHOLDER-runner-label
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Install the Rust toolchain (rustup; rust-toolchain.toml pins it)
        run: |
          set -eu
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install
          rustup show active-toolchain

      - name: Fetch the MF2 specification text (not vendored, upstream #1112)
        # Into target/xtask-cache, checked against the PIN's digests; --check
        # also holds the vendored suite byte for byte against upstream.
        run: cargo xtask spec-sync --check

      - name: The terminal UI's gate (allocations per frame and stripped size)
        # Three runs: the counts must agree between them. Time is nightly's.
        run: cargo xtask tui-gate --gate --runs 3

      - name: Upload the gate report
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: tui-gate-report
          path: |
            target/tui-gate/report.md
            target/tui-gate/report.json
          if-no-files-found: error

  native-canaries:
    # PLACEHOLDER: see the `ci` job.
    runs-on: PLACEHOLDER-runner-label
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Install the Rust toolchain (rustup; rust-toolchain.toml pins it)
        run: |
          set -eu
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install
          rustup show active-toolchain

      - name: Fetch the MF2 specification text (not vendored, upstream #1112)
        # Into target/xtask-cache, checked against the PIN's digests; --check
        # also holds the vendored suite byte for byte against upstream.
        run: cargo xtask spec-sync --check

      - name: What each feature set links into a native binary
        run: cargo xtask native-canaries

      - name: Upload the canaries' report
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: native-canaries-report
          path: target/native-canaries/report.md
          if-no-files-found: error

  catalog-size:
    # PLACEHOLDER: see the `ci` job.
    runs-on: PLACEHOLDER-runner-label
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Install the Rust toolchain (rustup; rust-toolchain.toml pins it)
        run: |
          set -eu
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install
          rustup show active-toolchain

      - name: Fetch the MF2 specification text (not vendored, upstream #1112)
        # Into target/xtask-cache, checked against the PIN's digests; --check
        # also holds the vendored suite byte for byte against upstream.
        run: cargo xtask spec-sync --check

      - name: B7 on the committed corpus (brotli 11; exit 1 on a failed threshold)
        run: |
          cargo xtask catalog-size --md target/catalog-bench/SIZE.md \
            --json target/catalog-bench/size.json

      - name: Upload the size report
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: catalog-size-report
          path: |
            target/catalog-bench/SIZE.md
            target/catalog-bench/size.json
          if-no-files-found: error

  b12:
    # PLACEHOLDER: see the `ci` job. The runner needs git, curl, tar, gzip,
    # sha256sum, a C linker (cc) and node (for upload-artifact); x86_64 Linux
    # (the binaryen tarball below).
    runs-on: PLACEHOLDER-runner-label
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # The versions bench/b12/README.md's figures were measured with.
      BINARYEN_VERSION: "120"
      TWIGGY_VERSION: "0.8.0"
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Install the Rust toolchain (rustup; rust-toolchain.toml pins it)
        run: |
          set -eu
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          # Installs the channel, components and targets (wasm32-unknown-unknown
          # among them) named in rust-toolchain.toml.
          rustup toolchain install
          rustup show active-toolchain

      - name: Fetch the MF2 specification text (not vendored, upstream #1112)
        # Into target/xtask-cache, checked against the PIN's digests; --check
        # also holds the vendored suite byte for byte against upstream.
        run: cargo xtask spec-sync --check

      - name: Install binaryen and twiggy (pinned)
        run: |
          set -eu
          tools="${RUNNER_TEMP:-/tmp}/b12-tools"
          mkdir -p "$tools"
          name="binaryen-version_$BINARYEN_VERSION"
          tarball="$name-x86_64-linux.tar.gz"
          url="https://github.com/WebAssembly/binaryen/releases/download/version_$BINARYEN_VERSION/$tarball"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$tools/$tarball" "$url"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$tools/$tarball.sha256" "$url.sha256"
          expected="$(cut -d ' ' -f 1 < "$tools/$tarball.sha256")"
          echo "$expected  $tools/$tarball" | sha256sum -c -
          tar -xzf "$tools/$tarball" -C "$tools"
          echo "$tools/$name/bin" >> "$GITHUB_PATH"
          "$tools/$name/bin/wasm-opt" --version
          cargo install --locked twiggy --version "$TWIGGY_VERSION"
          twiggy --version

      - name: B12 check (exit 1 on a panic path or core::fmt in the reader or the runtime)
        run: bash bench/b12/check.sh

      - name: B1′ and B13 on the generated module (Phase 5b, A10)
        run: cargo xtask b12-generated

      - name: The browser host builds for wasm32-unknown-unknown
        run: cargo build --release -p mf2-host-web --target wasm32-unknown-unknown

      - name: Upload the B12 report
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: b12-report
          path: |
            bench/b12/target/b12/b12.txt
            bench/b12/target/b12/size.tsv
          if-no-files-found: error

  build-pipeline:
    # PLACEHOLDER: see the `ci` job.
    #
    # Phase 5a (plans/12-phase-5a-work-order.md): the module `mf2-build`
    # generates, compiled in every feature combination of the facade — for the
    # server and for wasm32-unknown-unknown — with budget B6 grepped for in the
    # client artifact; then the incremental-rebuild scenarios of P0.9 on the
    # real pipeline, which is where "a translation-only edit leaves the client
    # wasm byte-identical" is checked.
    runs-on: PLACEHOLDER-runner-label
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Install the Rust toolchain (rustup; rust-toolchain.toml pins it)
        run: |
          set -eu
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install
          rustup show active-toolchain

      - name: Fetch the MF2 specification text (not vendored, upstream #1112)
        # Into target/xtask-cache, checked against the PIN's digests; --check
        # also holds the vendored suite byte for byte against upstream.
        run: cargo xtask spec-sync --check

      - name: The generated module in every feature combination, and B6
        run: cargo xtask codegen-matrix

      - name: The incremental-rebuild scenarios
        run: cargo xtask scenarios

  docs:
    # PLACEHOLDER: see the `ci` job.
    runs-on: PLACEHOLDER-runner-label
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Install the Rust toolchain (rustup; rust-toolchain.toml pins it)
        run: |
          set -eu
          if ! command -v rustup >/dev/null 2>&1; then
