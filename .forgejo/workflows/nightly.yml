# Nightly long runs (plans/08-phase-1-work-order.md, A8): what `cargo test`
# runs in bounded form, run long.
#
# * `generated`: 1,000,000 messages generated from the vendored message.abnf —
#   well-formed, lossless CST, parse(serialize(m)) == m, deterministic
#   validation (≈ 1 minute in a release build).
# * `generated_l3` (plans/09-phase-2-work-order.md, A6): the same 1,000,000
#   messages through a one-message catalog — the unstripped catalog decodes to
#   the model, the stripped one to its formatting-relevant model (≈ 45 s).
# * `generated_l4` (plans/10-phase-3-work-order.md, A10): the same 1,000,000
#   messages steered towards the runtime's functions, compiled for a random
#   locale with generated arguments, formatted from the catalog — no panic,
#   deterministic, named = positional, parts = string, stripped = unstripped
#   (≈ 1 minute); and a sample of 200,000 of them (every fifth) on
#   wasm32-wasip1 under the pinned wasmtime, byte-identical to native
#   (`cargo xtask l4-wasi --generated`, ≈ 80 s; the bundle is held in memory,
#   so not all million).
# * `differential`: mf2-syntax vs ox_mf2_parser on 90,000 generated and mutated
#   messages. ox hangs on some inputs and then allocates without bound, so it
#   runs in a child process with a timeout, under a memory limit.
# * `fuzz`: 30 minutes each of the `parse`, `catalog` and `format` fuzz
#   targets (cargo-fuzz, nightly toolchain; see fuzz/README.md).
# * `reader bench` (plans/09-phase-2-work-order.md, A9): the catalog reader's
#   load and lookup against P0.8's figures, 0 allocations and 0 copies at load
#   (bench/catalog-bench). Here rather than on every push because its timing
#   rules are load-sensitive.
# * `l4-web` (a job of its own; owner decision 4): the `intl` client option's
#   L4 run in Chromium, Firefox and WebKit, every engine difference the
#   ledger's (`cargo xtask l4-web`; plans/01-conformance.md §3).
# * `B10` (plans/10-phase-3-work-order.md, A11): formatting speed on the four
#   production catalogs — simple ≤ 100 ns / 0 allocations, 1-argument pattern
#   ≤ 500 ns / ≤ 1 allocation on `en`, P0.8's figures within 1.5×
#   (bench/runtime-bench); load-sensitive too.
#
# Actions: only Forgejo-maintained forks (see ci.yml). Sources are fetched
# with plain git.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  long-runs:
    # PLACEHOLDER: the remote host is not decided yet; see ci.yml.
    runs-on: PLACEHOLDER-runner-label
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Install the Rust toolchains (pinned stable; nightly for cargo-fuzz)
        run: |
          set -eu
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install
          rustup toolchain install nightly --profile minimal
          cargo install --locked cargo-fuzz

      - name: Generated input, 1,000,000 messages
        run: MF2_GEN_CASES=1000000 cargo test --release -p mf2-conformance --test generated

      - name: Generated input through the catalog (L3), 1,000,000 messages
        run: MF2_GEN_CASES=1000000 cargo test --release -p mf2-conformance --test generated_l3

      - name: Generated input formatted from the catalog (L4), 1,000,000 messages
        run: MF2_GEN_CASES=1000000 cargo test --release -p mf2-conformance --test generated_l4

      - name: Generated input on wasm32-wasip1 (L4), 200,000 of the million
        run: |
          set -eu
          cargo install --root target/tools --locked wasmtime-cli --version 49.0.0
          cargo xtask l4-wasi --generated 200000

      - name: Differential against ox (90,000 messages)
        run: |
          set -eu
          cargo build --release -p mf2-conformance --example differential
          (ulimit -v 4000000; ./target/release/examples/differential 30000) | tee differential.txt
          # Anything but agreement and ox's known behaviours fails the run.
          if grep -Eq '^  (SYNTAX DISAGREEMENT|DATA-MODEL DISAGREEMENT):' differential.txt; then
            exit 1
          fi

      - name: Fuzz the parser (30 minutes)
        run: |
          set -eu
          cargo xtask fuzz-seed
          cd fuzz
          cargo +nightly fuzz run parse -- -dict=mf2.dict -max_len=16384 -timeout=10 \
            -rss_limit_mb=2048 -max_total_time=1800

      - name: Fuzz the catalog reader and decoder (30 minutes)
        run: |
          set -eu
          cd fuzz
          cargo +nightly fuzz run catalog -- -dict=mf2.dict -max_len=131072 -timeout=10 \
            -rss_limit_mb=2048 -max_total_time=1800

      - name: Fuzz the formatter (30 minutes)
        run: |
          set -eu
          cd fuzz
          cargo +nightly fuzz run format -- -dict=mf2.dict -max_len=131072 -timeout=10 \
            -rss_limit_mb=2048 -max_total_time=1800

      - name: Reader bench (median of 31, exit 1 on failure)
        run: |
          cargo run --release -p catalog-bench -- bench --gate \
            --md target/catalog-bench/READER.md --json target/catalog-bench/reader.json

      - name: B10 formatting bench (median of 31, exit 1 on failure)
        run: |
          mkdir -p target/runtime-bench
          cargo run --release -p runtime-bench -- b10 --gate \
            --md target/runtime-bench/B10.md --json target/runtime-bench/b10.json

      - name: Upload fuzz artifacts and the differential summary
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: nightly
          path: |
            differential.txt
            fuzz/artifacts/
            target/catalog-bench/
            target/runtime-bench/
          if-no-files-found: ignore

  l4-web:
    # The `intl` client option's L4 run in Chromium, Firefox and WebKit
    # (plans/01-conformance.md §3, "The intl build"; owner decision 4):
    # `cargo xtask l4-web` builds conformance/l4-web for wasm32-unknown-unknown,
    # runs tools/e2e's `l4-intl` check in the three engines and fails unless
    # every suite test passes there or the ledger says otherwise, and every
    # difference from the Rust path is the ledger's. Nightly rather than on
    # every push: it needs the three browsers (Playwright's builds, WebKit's
    # system libraries through `install-deps`, which needs root).
    # PLACEHOLDER: see ci.yml. The runner needs git, curl, a C linker, node
    # (≥ 20) and npm.
    runs-on: PLACEHOLDER-runner-label
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # Equal to the wasm-bindgen library conformance/l4-web pins.
      WASM_BINDGEN_VERSION: "0.2.128"
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Install the Rust toolchain and wasm-bindgen's CLI (pinned)
        run: |
          set -eu
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install
          cargo install --locked wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"

      - name: Install the browser harness and the three engines
        run: |
          set -eu
          cd tools/e2e
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: L4 in the three engines, the intl build (exit 1 on an unrecorded difference)
        run: cargo xtask l4-web

      - name: Upload the report
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: l4-web
          path: |
            target/l4-web/report.md
            target/l4-web/*.json
          if-no-files-found: ignore
