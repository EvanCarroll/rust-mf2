# Nightly long runs (plans/08-phase-1-work-order.md, A8): what `cargo test`
# runs in bounded form, run long.
#
# * `generated`: 1,000,000 messages generated from the vendored message.abnf —
#   well-formed, lossless CST, parse(serialize(m)) == m, deterministic
#   validation (≈ 1 minute in a release build).
# * `generated_l3` (plans/09-phase-2-work-order.md, A6): the same 1,000,000
#   messages through a one-message catalog — the unstripped catalog decodes to
#   the model, the stripped one to its formatting-relevant model (≈ 45 s).
# * `generated_l4` (plans/10-phase-3-work-order.md, A10): the same 1,000,000
#   messages steered towards the runtime's functions, compiled for a random
#   locale with generated arguments, formatted from the catalog — no panic,
#   deterministic, named = positional, parts = string, stripped = unstripped
#   (≈ 1 minute); and a sample of 200,000 of them (every fifth) on
#   wasm32-wasip1 under the pinned wasmtime, byte-identical to native
#   (`cargo xtask l4-wasi --generated`, ≈ 80 s; the bundle is held in memory,
#   so not all million).
# * `l5-generated` (plans/13-phase-5b-work-order.md, A8): 50,000 generated
#   messages as a corpus `mf2-build` compiles and `tr!` calls, each held to
#   what L4's runner makes of the same message. `cargo test` runs 200 of them.
# * `differential`: mf2-syntax vs ox_mf2_parser on 90,000 generated and mutated
#   messages. ox hangs on some inputs and then allocates without bound, so it
#   runs in a child process with a timeout, under a memory limit.
# * `fuzz`: 30 minutes each of the `parse`, `catalog`, `format` and `nfc`
#   fuzz targets (cargo-fuzz, nightly toolchain; see fuzz/README.md).
# * `reader bench` (plans/09-phase-2-work-order.md, A9): the catalog reader's
#   load and lookup against P0.8's figures, 0 allocations and 0 copies at load
#   (bench/catalog-bench). Here rather than on every push because its timing
#   rules are load-sensitive.
# * `l4-web` (a job of its own; owner decision 4): the `intl` client option's
#   L4 run in Chromium, Firefox and WebKit, every engine difference the
#   ledger's (`cargo xtask l4-web`; plans/01-conformance.md §3).
# * `b5` (a job of its own; plans/06-size-and-perf.md §3, plans/14 A9): the
#   **size gate** — two scales of the reference workload, three generated
#   Leptos applications each, built for the client and measured after
#   `wasm-opt -Oz`, then read three ways: B1 (fixed), B5 (per call site) and
#   the whole app at the reference scale (`cargo xtask size`). Nightly
#   because it is six fat-LTO wasm builds. Then `cargo xtask islands-zero`:
#   the islands example's client with and without one more server-only
#   component, whose code must be identical (plans/15 A1). Then
#   `cargo xtask fluent-migrate` (plans/16 A4): the reference application
#   on leptos-fluent, converted by `mf2 convert --from leptos-fluent`, its
#   call sites compared byte for byte with `fluent-converted`, finished as
#   the migration guide says, and built for the client and the server.
# * `l6-web` (a job of its own; plans/14 A6b): conformance layer L6 in the
#   browser — every runtime-valid suite message server-rendered, hydrated in
#   Chromium and Firefox, switched to the twin locale and back
#   (`cargo xtask l6-web`). The server half of L6 runs in `cargo test`.
# * `l7-web` (a job of its own; plans/15 A4): conformance layer L7 — the
#   same, as islands and client-only, in both configurations, judging the
#   ledger's L7 columns (`cargo xtask l7-web`). Then, in the same job,
#   `cargo xtask churn` (plans/15 A5): no row shape of a churning list may
#   grow the heap.
# * `leptos-0-8` (a job of its own; plans/16 A0, plans/04 §10): the Leptos
#   0.8 opt-in — both lines at once refused with the fix named; then, on
#   0.8, mf2's Leptos layer linted for ssr, hydrate and csr, its render,
#   churn and fallback_lang tests and conformance layer L6
#   (`cargo xtask leptos-0-8`). Not allowed to fail: 0.8 is supported.
# * `fmt-check` (a job of its own; plans/19 §6, plans/04 §12.6): the demos
#   are what readers copy, so no `Display` or `Debug` impl of ours may reach
#   their clients. A debug-profile client build of each demo (a release
#   build, even with names kept, misses the wrapper traps), then
#   `tools/fmt-check.sh` over the three wasm files, through twiggy.
# * `B10` (plans/10-phase-3-work-order.md, A11): formatting speed on the four
#   production catalogs — simple ≤ 100 ns / 0 allocations, 1-argument pattern
#   ≤ 500 ns / ≤ 1 allocation on `en`, P0.8's figures within 1.5×
#   (bench/runtime-bench); load-sensitive too.
# * `feature-sets` (a job of its own; plan/01 §6.3): every feature of `mf2`
#   compiled alone — with the Leptos line or the browser target it needs,
#   which `xtask/src/feature_sets.rs` states — the way a dependent that turns
#   on one thing compiles it (`cargo xtask feature-sets`). One `cargo check`
#   per feature, which is why it is nightly and not in `ci`.
# * `tui-gate` (a job of its own; plans/19 §8 and §14): examples/tui's
#   frame on 2.0 against 1.x's binaries, built from commit 3a296a9 in a
#   worktree and run alternately — allocations, stripped size, and the
#   median time per frame, which may not exceed 1.x's
#   (`cargo xtask tui-gate --gate --baseline-rev`). Load-sensitive.
#
# Actions: only Forgejo-maintained forks (see ci.yml). Sources are fetched
# with plain git.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  long-runs:
    # PLACEHOLDER: the remote host is not decided yet; see ci.yml.
    runs-on: PLACEHOLDER-runner-label
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Install the Rust toolchains (pinned stable; nightly for cargo-fuzz)
        run: |
          set -eu
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install
          rustup toolchain install nightly --profile minimal
          cargo install --locked cargo-fuzz

      - name: Fetch the MF2 specification text (not vendored, upstream #1112)
        # Into target/xtask-cache, checked against the PIN's digests; --check
        # also holds the vendored suite byte for byte against upstream.
        run: cargo xtask spec-sync --check

      - name: Generated input, 1,000,000 messages
        run: MF2_GEN_CASES=1000000 cargo test --release -p mf2-conformance --test generated

      - name: Generated input through the catalog (L3), 1,000,000 messages
        run: MF2_GEN_CASES=1000000 cargo test --release -p mf2-conformance --test generated_l3

      - name: Generated input formatted from the catalog (L4), 1,000,000 messages
        run: MF2_GEN_CASES=1000000 cargo test --release -p mf2-conformance --test generated_l4

      - name: Generated input on wasm32-wasip1 (L4), 200,000 of the million
        run: |
          set -eu
          cargo install --root target/tools --locked wasmtime-cli --version 49.0.0
          cargo xtask l4-wasi --generated 200000

      - name: Layer L5 on generated input (50,000 messages)
        run: |
          set -eu
          MF2_L5_GENERATED=50000 cargo test -p mf2-l5-generated --release --test generated

      - name: Differential against ox (90,000 messages)
        run: |
          set -eu
          cargo build --release -p mf2-conformance --example differential
          (ulimit -v 4000000; ./target/release/examples/differential 30000) | tee differential.txt
          # Anything but agreement and ox's known behaviours fails the run.
          if grep -Eq '^  (SYNTAX DISAGREEMENT|DATA-MODEL DISAGREEMENT):' differential.txt; then
            exit 1
          fi

      - name: Fuzz the parser (30 minutes)
        run: |
          set -eu
          cargo xtask fuzz-seed
          cd fuzz
          cargo +nightly fuzz run parse -- -dict=mf2.dict -max_len=16384 -timeout=10 \
            -rss_limit_mb=2048 -max_total_time=1800

      - name: Fuzz the catalog reader and decoder (30 minutes)
        run: |
          set -eu
          cd fuzz
          cargo +nightly fuzz run catalog -- -dict=mf2.dict -max_len=131072 -timeout=10 \
            -rss_limit_mb=2048 -max_total_time=1800

      - name: Fuzz the formatter (30 minutes)
        run: |
          set -eu
          cd fuzz
          cargo +nightly fuzz run format -- -dict=mf2.dict -max_len=131072 -timeout=10 \
            -rss_limit_mb=2048 -max_total_time=1800

      - name: Fuzz the canonical-equivalence check (30 minutes)
        run: |
          set -eu
          cd fuzz
          cargo +nightly fuzz run nfc -- -max_len=4096 -timeout=10 \
            -rss_limit_mb=2048 -max_total_time=1800

      - name: Reader bench (median of 31, exit 1 on failure)
        run: |
          cargo run --release -p catalog-bench -- bench --gate \
            --md target/catalog-bench/READER.md --json target/catalog-bench/reader.json

      - name: B10 formatting bench (median of 31, exit 1 on failure)
        run: |
          mkdir -p target/runtime-bench
          cargo run --release -p runtime-bench -- b10 --gate \
            --md target/runtime-bench/B10.md --json target/runtime-bench/b10.json

      - name: Upload fuzz artifacts and the differential summary
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: nightly
          path: |
            differential.txt
            fuzz/artifacts/
            target/catalog-bench/
            target/runtime-bench/
          if-no-files-found: ignore

  l4-web:
    # The `intl` client option's L4 run in Chromium, Firefox and WebKit
    # (plans/01-conformance.md §3, "The intl build"; owner decision 4):
    # `cargo xtask l4-web` builds conformance/l4-web for wasm32-unknown-unknown,
    # runs tools/e2e's `l4-intl` check in the three engines and fails unless
    # every suite test passes there or the ledger says otherwise, and every
    # difference from the Rust path is the ledger's. Nightly rather than on
    # every push: it needs the three browsers (Playwright's builds, WebKit's
    # system libraries through `install-deps`, which needs root).
    # PLACEHOLDER: see ci.yml. The runner needs git, curl, a C linker, node
    # (≥ 20) and npm.
    runs-on: PLACEHOLDER-runner-label
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # Equal to the wasm-bindgen library conformance/l4-web pins.
      WASM_BINDGEN_VERSION: "0.2.128"
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Install the Rust toolchain and wasm-bindgen's CLI (pinned)
        run: |
          set -eu
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install
          cargo install --locked wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"

      - name: Fetch the MF2 specification text (not vendored, upstream #1112)
        # Into target/xtask-cache, checked against the PIN's digests; --check
        # also holds the vendored suite byte for byte against upstream.
        run: cargo xtask spec-sync --check

      - name: Install the browser harness and the three engines
        run: |
          set -eu
          cd tools/e2e
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: L4 in the three engines, the intl build (exit 1 on an unrecorded difference)
        run: cargo xtask l4-web

      - name: Upload the report
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: l4-web
          path: |
            target/l4-web/report.md
            target/l4-web/*.json
          if-no-files-found: ignore

  b5:
    # Budget B5 (plans/06-size-and-perf.md §3; plans/13 A6): the marginal wasm
    # per call site, by P0.1's method — two scales of the reference workload,
    # three generated Leptos applications each, built for the client and
    # measured after `wasm-opt -Oz`. Nightly rather than on every push: six
    # fat-LTO wasm builds.
    # PLACEHOLDER: see ci.yml. The runner needs git, curl and a C linker;
    # x86_64 Linux (the binaryen tarball).
    runs-on: PLACEHOLDER-runner-label
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
      # The versions the figures in plans/phase-5b-results.md were measured with.
      WASM_BINDGEN_VERSION: "0.2.128"
      BINARYEN_VERSION: "120"
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Install the Rust toolchain, wasm-bindgen's CLI and binaryen (pinned)
        run: |
          set -eu
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install
          cargo install --locked wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"
          tools=$(pwd)/target/tools
          mkdir -p "$tools"
          name="binaryen-version_${BINARYEN_VERSION}"
          curl -sSfL -o "$tools/binaryen.tar.gz" \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/${name}-x86_64-linux.tar.gz"
          tar -xzf "$tools/binaryen.tar.gz" -C "$tools"
          echo "$tools/$name/bin" >> "$GITHUB_PATH"

      - name: Fetch the MF2 specification text (not vendored, upstream #1112)
        # Into target/xtask-cache, checked against the PIN's digests; --check
        # also holds the vendored suite byte for byte against upstream.
        run: cargo xtask spec-sync --check

      - name: The size gate — B1 fixed, B5 per site, and the whole app
        run: cargo xtask size | tee size.md

      # plans/15-phase-7-work-order.md A1: a server-only component in an
      # islands application adds no code to the client.
      - name: A server-only component costs the client nothing
        run: cargo xtask islands-zero | tee -a size.md

      # plans/16-phase-8-work-order.md A4: the migration of the reference
      # application from leptos-fluent, converted and built.
      - name: The reference application migrated from leptos-fluent
        run: cargo xtask fluent-migrate

      - name: Upload the size report
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: size
          path: |
            size.md
            target/size/report.md
          if-no-files-found: ignore

  l6-web:
    # Conformance layer L6 in the browser (plans/01-conformance.md §3;
    # plans/14-phase-6-work-order.md A6b): every runtime-valid suite message
    # server-rendered by conformance/l6-web, hydrated in Chromium and Firefox,
    # switched to the twin locale and back. Two engines are what the master
    # plan requires of P6; WebKit joins wherever a build of it is installed.
    # The server half of L6 is a Rust harness and runs in `cargo test`, on
    # every push.
    # PLACEHOLDER: see ci.yml. The runner needs git, curl, a C linker, node
    # (≥ 20) and npm.
    runs-on: PLACEHOLDER-runner-label
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
      WASM_BINDGEN_VERSION: "0.2.128"
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Install the Rust toolchain and wasm-bindgen's CLI (pinned)
        run: |
          set -eu
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          cargo install --locked wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"

      - name: Fetch the MF2 specification text (not vendored, upstream #1112)
        # Into target/xtask-cache, checked against the PIN's digests; --check
        # also holds the vendored suite byte for byte against upstream.
        run: cargo xtask spec-sync --check

      - name: Install the browser harness and two engines
        run: |
          set -eu
          cd tools/e2e
          npm ci
          npx playwright install --with-deps chromium firefox

      - name: L6 in the browser (exit 1 on a hydration warning or a text change)
        run: cargo xtask l6-web --browser chromium,firefox

      - name: Upload the L6 report
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: l6-web
          path: |
            target/l6-web/report.json
            target/l6-web/page.json
          if-no-files-found: ignore

  l7-web:
    # Conformance layer L7 (plans/01-conformance.md §3;
    # plans/15-phase-7-work-order.md A4): L6's page and twin switch as an
    # islands page and as a client-only page, in both configurations, one
    # page per locale the suite uses, in Chromium and Firefox. Only an engine
    # can run it, so `cargo xtask l7-web` is the harness of the ledger's L7,
    # L7c, L7d and L7cd columns: it judges every cell and fails on one the
    # ledger does not match. Six release builds (a server and two clients per
    # configuration).
    # PLACEHOLDER: see ci.yml. The runner needs git, curl, a C linker, node
    # (≥ 20) and npm.
    runs-on: PLACEHOLDER-runner-label
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
      WASM_BINDGEN_VERSION: "0.2.128"
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Install the Rust toolchain and wasm-bindgen's CLI (pinned)
        run: |
          set -eu
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          cargo install --locked wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"

      - name: Fetch the MF2 specification text (not vendored, upstream #1112)
        # Into target/xtask-cache, checked against the PIN's digests; --check
        # also holds the vendored suite byte for byte against upstream.
        run: cargo xtask spec-sync --check

      - name: Install the browser harness and two engines
        run: |
          set -eu
          cd tools/e2e
          npm ci
          npx playwright install --with-deps chromium firefox

      - name: L7 in the browser (exit 1 on a cell the ledger does not match)
        run: cargo xtask l7-web --browser chromium,firefox

      - name: Upload the L7 report
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: l7-web
          path: |
            target/l7-web/report.json
            target/l7-web/*/*.json
          if-no-files-found: ignore

      # plans/15-phase-7-work-order.md A5: P0.11's churning list on
      # mf2's Leptos layer, one row shape per variant (text, attribute,
      # argument, TextProp, Signal<String>, to_string(), Oco); the heap must
      # stay flat over 100,000 churned rows. Here because this job has the
      # engines.
      - name: The conversions under churn (exit 1 on a row shape that leaks)
        run: cargo xtask churn --browser chromium,firefox

      - name: Upload the churn report
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: churn
          path: target/churn/report.json
          if-no-files-found: ignore

  leptos-0-8:
    # plans/16-phase-8-work-order.md A0: Leptos 0.9 is the default line and
    # every other job builds on it; this one builds and tests the 0.8
    # opt-in (`default-features = false, features = ["leptos-0-8"]`). Both
    # lines are in the one lock file, so it runs in the checkout.
    # PLACEHOLDER: see ci.yml. The runner needs git, curl and a C linker.
    runs-on: PLACEHOLDER-runner-label
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Install the Rust toolchain (pinned) and the wasm32 target
        run: |
          set -eu
