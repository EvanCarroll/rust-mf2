            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: Fetch the MF2 specification text (not vendored, upstream #1112)
        # Into target/xtask-cache, checked against the PIN's digests; --check
        # also holds the vendored suite byte for byte against upstream.
        run: cargo xtask spec-sync --check

      - name: mf2's Leptos layer and layer L6 on Leptos 0.8
        run: cargo xtask leptos-0-8

  feature-sets:
    # plan/01 §6.3: `ci` builds the feature sets applications really use,
    # which is not the same as each feature being valid by itself. This job
    # compiles each of `mf2`'s features alone, on the target the table says
    # it needs. PLACEHOLDER: see ci.yml. The runner needs git, curl and a C
    # linker.
    runs-on: PLACEHOLDER-runner-label
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Install the Rust toolchain (pinned) and the wasm32 target
        run: |
          set -eu
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: Fetch the MF2 specification text (not vendored, upstream #1112)
        # Into target/xtask-cache, checked against the PIN's digests; --check
        # also holds the vendored suite byte for byte against upstream.
        run: cargo xtask spec-sync --check

      - name: Every feature of mf2, alone
        run: cargo xtask feature-sets

  fmt-check:
    # See the header. PLACEHOLDER: see ci.yml. The runner needs git, curl and
    # a C linker.
    runs-on: PLACEHOLDER-runner-label
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
      TWIGGY_VERSION: "0.8.0"
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Install the Rust toolchain (pinned), the wasm32 target and twiggy
        run: |
          set -eu
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          cargo install --locked twiggy --version "$TWIGGY_VERSION"

      - name: The demos' clients, debug profile (names kept)
        run: |
          set -eu
          for demo in demo-ssr demo-islands; do
            (cd "examples/$demo" && cargo build --lib --target wasm32-unknown-unknown \
              --no-default-features --features hydrate)
          done
          (cd examples/demo-csr && cargo build --target wasm32-unknown-unknown)

      - name: No Display / Debug of ours in a client
        run: |
          bash tools/fmt-check.sh \
            examples/demo-ssr/target/wasm32-unknown-unknown/debug/demo_ssr.wasm \
            examples/demo-islands/target/wasm32-unknown-unknown/debug/demo_islands.wasm \
            examples/demo-csr/target/wasm32-unknown-unknown/debug/demo-csr.wasm

  tui-gate:
    # PLACEHOLDER: see ci.yml. The runner needs git, curl and a C linker.
    runs-on: PLACEHOLDER-runner-label
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          # examples/tui in its 1.x form (Phase 10 A1), built for the comparison.
          BASE: 3a296a920952239a8c62399f2e8d51aad46f84ec
        run: |
          set -eu
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$BASE"
          else
            git fetch --quiet --depth=1 origin "$SHA"
            git fetch --quiet --depth=1 origin "$BASE"
          fi
          git checkout --quiet --detach "$SHA"

      - name: Install the Rust toolchain (rustup; rust-toolchain.toml pins it)
        run: |
          set -eu
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install
          rustup show active-toolchain

      - name: Fetch the MF2 specification text (not vendored, upstream #1112)
        # Into target/xtask-cache, checked against the PIN's digests; --check
        # also holds the vendored suite byte for byte against upstream.
        run: cargo xtask spec-sync --check

      - name: The terminal UI's gate, with time against the 1.x binary
        # Builds 1.x's binaries in a worktree and alternates them with this
        # build's, 31 runs each: a time is only comparable within one run.
        run: cargo xtask tui-gate --gate --baseline-rev "3a296a920952239a8c62399f2e8d51aad46f84ec"

      - name: Upload the gate report
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: tui-gate-nightly-report
          path: |
            target/tui-gate/report.md
            target/tui-gate/report.json
          if-no-files-found: error
