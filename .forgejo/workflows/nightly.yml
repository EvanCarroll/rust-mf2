# Nightly long runs: what `cargo test`
# runs in bounded form, run long.
#
# * `generated`: 1,000,000 messages generated from the vendored message.abnf —
#   well-formed, lossless CST, parse(serialize(m)) == m, deterministic
#   validation (≈ 1 minute in a release build).
# * `generated_l3`: the same 1,000,000
#   messages through a one-message catalog — the unstripped catalog decodes to
#   the model, the stripped one to its formatting-relevant model (≈ 45 s).
# * `generated_l4`: the same 1,000,000
#   messages steered towards the runtime's functions, compiled for a random
#   locale with generated arguments, formatted from the catalog — no panic,
#   deterministic, named = positional, parts = string, stripped = unstripped
#   (≈ 1 minute); and a sample of 200,000 of them (every fifth) on
#   wasm32-wasip1 under the pinned wasmtime, byte-identical to native
#   (`cargo xtask wasi-matches-native --generated`, ≈ 80 s; the bundle is held in memory,
#   so not all million).
# * `l5-generated`: 50,000 generated
#   messages as a corpus `mf2-build` compiles and `tr!` calls, each held to
#   what L4's runner makes of the same message. `cargo test` runs 200 of them.
# * `differential`: mf2-syntax vs ox_mf2_parser on 90,000 generated and mutated
#   messages. ox hangs on some inputs and then allocates without bound, so it
#   runs in a child process with a timeout, under a memory limit.
# * `fuzz`: 30 minutes each of the `parse`, `catalog`, `format` and `nfc`
#   fuzz targets (cargo-fuzz, nightly toolchain; see fuzz/README.md).
#   libFuzzer needs `-Zsanitizer=address`, and whether rustc offers that on an
#   Alpine host has not been seen yet. If the first nightly says it does not,
#   these four steps are the owner's to run and leave here as a record.
# * `reader bench`: the catalog reader's
#   load and lookup against P0.8's figures, 0 allocations and 0 copies at load
#   (bench/catalog-bench). Here rather than on every push because its timing
#   rules are load-sensitive.
# * `b5` (a job of its own): the
#   **size gate** — two scales of the reference workload, three generated
#   Leptos applications each, built for the client and measured after
#   `wasm-opt -Oz`, then read three ways: B1 (fixed), B5 (per call site) and
#   the whole app at the reference scale (`cargo xtask size`). Nightly
#   because it is six fat-LTO wasm builds. Then `cargo xtask islands-zero`:
#   the islands example's client with and without one more server-only
#   component, whose code must be identical. Then
#   `cargo xtask fluent-migrate`: the reference application
#   on leptos-fluent, converted by `mf2 convert --from leptos-fluent`, its
#   call sites compared byte for byte with `fluent-converted`, finished as
#   the migration guide says, and built for the client and the server.
#   Then `cargo xtask feature-costs --check` (plan/01 §6.4): each function
#   and data feature built with and without, client and native, held to
#   the figures the guide publishes (docs/feature-costs.md).
# * `leptos-0-8` (a job of its own): the Leptos
#   0.8 opt-in — both lines at once refused with the fix named; then, on
#   0.8, mf2's Leptos layer linted for ssr, hydrate and csr, its render,
#   churn and fallback_lang tests and conformance layer L6
#   (`cargo xtask leptos-0-8`). Not allowed to fail: 0.8 is supported.
# * `no-fmt-in-demos` (a job of its own): the demos
#   are what readers copy, so no `Display` or `Debug` impl of ours may reach
#   their clients. A debug-profile client build of each demo (a release
#   build, even with names kept, misses the wrapper traps), then
#   `tools/no-fmt-in-demos.sh` over the three wasm files, through twiggy.
# * `B10`: formatting speed on the four
#   production catalogs — simple ≤ 100 ns / 0 allocations, 1-argument pattern
#   ≤ 500 ns / ≤ 1 allocation on `en`, P0.8's figures within 1.5×
#   (bench/runtime-bench); load-sensitive too.
# * `each-feature-alone` (a job of its own; plan/01 §6.3): every feature of `mf2`
#   compiled alone — with the Leptos line or the browser target it needs,
#   which `xtask/src/feature_sets.rs` states — the way a dependent that turns
#   on one thing compiles it (`cargo xtask each-feature-alone`). One `cargo check`
#   per feature, which is why it is nightly and not in `ci`.
# * `tui-allocs-vs-pseudotrippy` (a job of its own): examples/tui's
#   frame on 2.0 against 1.x's binaries, built from commit 3a296a9 in a
#   worktree and run alternately — allocations, stripped size, and the
#   median time per frame, which may not exceed 1.x's
#   (`cargo xtask tui-allocs-vs-pseudotrippy --gate --baseline-rev`). Load-sensitive.
#
# * `report` (a job of its own): one file for the whole night, as in ci.yml.
#
# Not here, and not anywhere on this runner: the browser work. The image has no
# engines (owner, 2026-10-05), so `l4-web`, `l6-web`, `l7-web` and `churn` —
# which were jobs of this workflow — are the owner's to run. They are listed in
# tools/ci/local-only.txt with their commands, and every report names them, so a
# release cannot be signed off without seeing that they did not run.
#
# The whole check suite in one run, with `summary.tsv` and the comparison
# against the previous one, is verify.yml: the release verification run, asked
# for by hand or by a tag.
#
# Actions: only Forgejo-maintained forks (see ci.yml). Sources are fetched
# with plain git.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# One run per ref: a push that supersedes another cancels it, so a queue of
# stale runs cannot hold the runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-and-million-messages:
    # See the `ci` job in ci.yml: the `docker` label, the public `mf2-ci` image,
    # tools/ci/setup.sh.
    runs-on: docker
    container:
      image: git.coworkunion.com/evancarroll/mf2-ci:latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          # The image is Alpine and has no bash, but bench/browser-no-fmt/check.sh,
          # tools/checks/*.sh and tools/no-fmt-in-demos.sh are bash scripts with
          # arrays and [[ ]]. This is every job's first step, so bash is here
          # before anything needs it. tools/ci/setup.sh asks for it too, in case
          # this stops being the first step.
          apk add --no-cache bash >/dev/null
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Cache the cargo registry
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            /root/.cargo/registry/index/
            /root/.cargo/registry/cache/
            /root/.cargo/git/db/
          key: cargo-registry-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            cargo-registry-

      - name: Set the job up (packages, toolchain, tool versions)
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/fuzz-and-million-messages.log) 2>&1
          sh tools/ci/setup.sh wasmtime fuzz

      - name: Start sccache
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/fuzz-and-million-messages.log) 2>&1
          sccache --start-server || true
          sccache --show-stats

      - name: Fetch the MF2 specification text (not vendored, upstream #1112)
        # Into target/xtask-cache, checked against the PIN's digests; --check
        # also holds the vendored suite byte for byte against upstream.
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/fuzz-and-million-messages.log) 2>&1
          unset CARGO_BUILD_TARGET
          cargo xtask spec-sync --check

      - name: Generated input, 1,000,000 messages
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/fuzz-and-million-messages.log) 2>&1
          unset CARGO_BUILD_TARGET
          MF2_GEN_CASES=1000000 cargo test --release -p mf2-conformance --test generated

      - name: Generated input through the catalog (L3), 1,000,000 messages
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/fuzz-and-million-messages.log) 2>&1
          unset CARGO_BUILD_TARGET
          MF2_GEN_CASES=1000000 cargo test --release -p mf2-conformance --test generated_l3

      - name: Generated input formatted from the catalog (L4), 1,000,000 messages
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/fuzz-and-million-messages.log) 2>&1
          unset CARGO_BUILD_TARGET
          MF2_GEN_CASES=1000000 cargo test --release -p mf2-conformance --test generated_l4

      - name: Generated input on wasm32-wasip1 (L4), 200,000 of the million
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/fuzz-and-million-messages.log) 2>&1
          set -eu
          unset CARGO_BUILD_TARGET
          # wasmtime is already on PATH: tools/ci/setup.sh installed it.
          cargo xtask wasi-matches-native --generated 200000

      - name: Layer L5 on generated input (50,000 messages)
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/fuzz-and-million-messages.log) 2>&1
          set -eu
          unset CARGO_BUILD_TARGET
          MF2_L5_GENERATED=50000 cargo test -p mf2-l5-generated --release --test generated

      - name: Differential against ox (90,000 messages)
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/fuzz-and-million-messages.log) 2>&1
          set -eu
          unset CARGO_BUILD_TARGET
          cargo build --release -p mf2-conformance --example differential
          rc=0
          (ulimit -v 4000000; ./target/release/examples/differential 30000) \
            > differential.txt 2>&1 || rc=$?
          cat differential.txt
          # A non-zero status here is the run being killed by the memory limit,
          # which is not agreement either.
          [ "$rc" -eq 0 ] || exit "$rc"
          # Anything but agreement and ox's known behaviours fails the run.
          if grep -Eq '^  (SYNTAX DISAGREEMENT|DATA-MODEL DISAGREEMENT):' differential.txt; then
            exit 1
          fi

      - name: Fuzz the parser (30 minutes)
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/fuzz-and-million-messages.log) 2>&1
          set -eu
          unset CARGO_BUILD_TARGET
          cargo xtask fuzz-seed
          cd fuzz
          cargo +nightly fuzz run parse -- -dict=mf2.dict -max_len=16384 -timeout=10 \
            -rss_limit_mb=2048 -max_total_time=1800

      - name: Fuzz the catalog reader and decoder (30 minutes)
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/fuzz-and-million-messages.log) 2>&1
          set -eu
          unset CARGO_BUILD_TARGET
          cd fuzz
          cargo +nightly fuzz run catalog -- -dict=mf2.dict -max_len=131072 -timeout=10 \
            -rss_limit_mb=2048 -max_total_time=1800

      - name: Fuzz the formatter (30 minutes)
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/fuzz-and-million-messages.log) 2>&1
          set -eu
          unset CARGO_BUILD_TARGET
          cd fuzz
          cargo +nightly fuzz run format -- -dict=mf2.dict -max_len=131072 -timeout=10 \
            -rss_limit_mb=2048 -max_total_time=1800

      - name: Fuzz the canonical-equivalence check (30 minutes)
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/fuzz-and-million-messages.log) 2>&1
          set -eu
          unset CARGO_BUILD_TARGET
          cd fuzz
          cargo +nightly fuzz run nfc -- -max_len=4096 -timeout=10 \
            -rss_limit_mb=2048 -max_total_time=1800

      - name: Reader bench (median of 31, exit 1 on failure)
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/fuzz-and-million-messages.log) 2>&1
          unset CARGO_BUILD_TARGET
          cargo run --release -p catalog-bench -- bench --gate \
            --md target/catalog-bench/READER.md --json target/catalog-bench/reader.json

      - name: B10 formatting bench (median of 31, exit 1 on failure)
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/fuzz-and-million-messages.log) 2>&1
          unset CARGO_BUILD_TARGET
          mkdir -p target/runtime-bench
          cargo run --release -p runtime-bench -- b10 --gate \
            --md target/runtime-bench/B10.md --json target/runtime-bench/b10.json

      - name: Upload fuzz artifacts and the differential summary
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: nightly
          path: |
            differential.txt
            fuzz/artifacts/
            target/catalog-bench/
            target/runtime-bench/
          if-no-files-found: ignore

      - name: Upload this job's log
        # The only way to read what a step printed: this Forgejo serves no job
        # logs over its API (checked 2026-10-06 — 314 routes, none for logs),
        # but artifacts download fine, anonymously, by run id.
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: log-fuzz-and-million-messages
          path: target/ci-logs/
          if-no-files-found: warn

  browser-app-size:
    # Budget B5: the marginal wasm
    # per call site, by P0.1's method — two scales of the reference workload,
    # three generated Leptos applications each, built for the client and
    # measured after `wasm-opt -Oz`. Nightly rather than on every push: six
    # fat-LTO wasm builds.
    # See the `ci` job in ci.yml: the `docker` label, the public `mf2-ci` image,
    # tools/ci/setup.sh.
    runs-on: docker
    container:
      image: git.coworkunion.com/evancarroll/mf2-ci:latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          # The image is Alpine and has no bash, but bench/browser-no-fmt/check.sh,
          # tools/checks/*.sh and tools/no-fmt-in-demos.sh are bash scripts with
          # arrays and [[ ]]. This is every job's first step, so bash is here
          # before anything needs it. tools/ci/setup.sh asks for it too, in case
          # this stops being the first step.
          apk add --no-cache bash >/dev/null
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Cache the cargo registry
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            /root/.cargo/registry/index/
            /root/.cargo/registry/cache/
            /root/.cargo/git/db/
          key: cargo-registry-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            cargo-registry-

      - name: Set the job up (packages, toolchain, tool versions)
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/browser-app-size.log) 2>&1
          sh tools/ci/setup.sh wasm-bindgen

      - name: Start sccache
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/browser-app-size.log) 2>&1
          sccache --start-server || true
          sccache --show-stats

      - name: Fetch the MF2 specification text (not vendored, upstream #1112)
        # Into target/xtask-cache, checked against the PIN's digests; --check
        # also holds the vendored suite byte for byte against upstream.
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/browser-app-size.log) 2>&1
          unset CARGO_BUILD_TARGET
          cargo xtask spec-sync --check

      - name: The size gate — B1 fixed, B5 per site, and the whole app
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/browser-app-size.log) 2>&1
          unset CARGO_BUILD_TARGET
          mkdir -p target/browser-app-size-steps
          # `cmd | tee f` exits with tee's status, not the command's, so a
          # breached budget would have read as a pass. Keep the output and the
          # status both: the figures go in the artifact either way, and a
          # breach fails the job.
          rc=0
          cargo xtask size > target/browser-app-size-steps/size.md 2>&1 || rc=$?
          tee size.md < target/browser-app-size-steps/size.md
          [ "$rc" -eq 0 ] || exit "$rc"

      # A server-only component in an
      # islands application adds no code to the client.
      - name: A server-only component costs the client nothing
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/browser-app-size.log) 2>&1
          unset CARGO_BUILD_TARGET
          mkdir -p target/browser-app-size-steps
          # `cmd | tee f` exits with tee's status, not the command's, so a
          # breached budget would have read as a pass. Keep the output and the
          # status both: the figures go in the artifact either way, and a
          # breach fails the job.
          rc=0
          cargo xtask islands-zero > target/browser-app-size-steps/islands-zero.md 2>&1 || rc=$?
          tee -a size.md < target/browser-app-size-steps/islands-zero.md
          [ "$rc" -eq 0 ] || exit "$rc"

      # The migration of the reference
      # application from leptos-fluent, converted and built.
      - name: The reference application migrated from leptos-fluent
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/browser-app-size.log) 2>&1
          unset CARGO_BUILD_TARGET
          cargo xtask fluent-migrate

      # plan/01 §6.4: what each function and data feature adds, in the client
      # and in a native binary, held to the table the guide includes
      # (docs/feature-costs.md). Many builds, one at a time.
      - name: Each feature's measured cost holds
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/browser-app-size.log) 2>&1
          unset CARGO_BUILD_TARGET
          mkdir -p target/browser-app-size-steps
          # `cmd | tee f` exits with tee's status, not the command's, so a
          # breached budget would have read as a pass. Keep the output and the
          # status both: the figures go in the artifact either way, and a
          # breach fails the job.
          rc=0
          cargo xtask feature-costs --check > target/browser-app-size-steps/feature-costs.md 2>&1 || rc=$?
          tee -a size.md < target/browser-app-size-steps/feature-costs.md
          [ "$rc" -eq 0 ] || exit "$rc"

      - name: Upload the size report
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: size
          path: |
            size.md
            target/size/report.md
            target/feature-costs/feature-costs.md
          if-no-files-found: ignore

      - name: Upload this job's log
        # The only way to read what a step printed: this Forgejo serves no job
        # logs over its API (checked 2026-10-06 — 314 routes, none for logs),
        # but artifacts download fine, anonymously, by run id.
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: log-browser-app-size
          path: target/ci-logs/
          if-no-files-found: warn

  leptos-0-8:
    # Leptos 0.9 is the default line and
    # every other job builds on it; this one builds and tests the 0.8
    # opt-in (`default-features = false, features = ["leptos-0-8"]`). Both
    # lines are in the one lock file, so it runs in the checkout.
    # See the `ci` job in ci.yml: the `docker` label, the public `mf2-ci` image,
    # tools/ci/setup.sh.
    runs-on: docker
    container:
      image: git.coworkunion.com/evancarroll/mf2-ci:latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          # The image is Alpine and has no bash, but bench/browser-no-fmt/check.sh,
          # tools/checks/*.sh and tools/no-fmt-in-demos.sh are bash scripts with
          # arrays and [[ ]]. This is every job's first step, so bash is here
          # before anything needs it. tools/ci/setup.sh asks for it too, in case
          # this stops being the first step.
          apk add --no-cache bash >/dev/null
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Cache the cargo registry
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            /root/.cargo/registry/index/
            /root/.cargo/registry/cache/
            /root/.cargo/git/db/
          key: cargo-registry-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            cargo-registry-

      - name: Set the job up (packages, toolchain, tool versions)
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/leptos-0-8.log) 2>&1
          sh tools/ci/setup.sh

      - name: Start sccache
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/leptos-0-8.log) 2>&1
          sccache --start-server || true
          sccache --show-stats

      - name: Fetch the MF2 specification text (not vendored, upstream #1112)
        # Into target/xtask-cache, checked against the PIN's digests; --check
        # also holds the vendored suite byte for byte against upstream.
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/leptos-0-8.log) 2>&1
          unset CARGO_BUILD_TARGET
          cargo xtask spec-sync --check

      - name: mf2's Leptos layer and layer L6 on Leptos 0.8
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/leptos-0-8.log) 2>&1
          unset CARGO_BUILD_TARGET
          cargo xtask leptos-0-8

      - name: Upload this job's log
        # The only way to read what a step printed: this Forgejo serves no job
        # logs over its API (checked 2026-10-06 — 314 routes, none for logs),
        # but artifacts download fine, anonymously, by run id.
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: log-leptos-0-8
          path: target/ci-logs/
          if-no-files-found: warn

  each-feature-alone:
    # plan/01 §6.3: `ci` builds the feature sets applications really use,
    # which is not the same as each feature being valid by itself. This job
    # compiles each of `mf2`'s features alone, on the target the table says
    # it needs.
    # See the `ci` job in ci.yml: the `docker` label, the public `mf2-ci` image,
    # tools/ci/setup.sh.
    runs-on: docker
    container:
      image: git.coworkunion.com/evancarroll/mf2-ci:latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Fetch sources (plain git)
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          # The image is Alpine and has no bash, but bench/browser-no-fmt/check.sh,
          # tools/checks/*.sh and tools/no-fmt-in-demos.sh are bash scripts with
          # arrays and [[ ]]. This is every job's first step, so bash is here
          # before anything needs it. tools/ci/setup.sh asks for it too, in case
          # this stops being the first step.
          apk add --no-cache bash >/dev/null
          git init --quiet .
          git remote add origin "$SERVER/$REPOSITORY.git"
          if [ -n "$TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraHeader=Authorization: Basic $auth" \
              fetch --quiet --depth=1 origin "$SHA"
          else
            git fetch --quiet --depth=1 origin "$SHA"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Cache the cargo registry
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            /root/.cargo/registry/index/
            /root/.cargo/registry/cache/
            /root/.cargo/git/db/
          key: cargo-registry-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            cargo-registry-

      - name: Set the job up (packages, toolchain, tool versions)
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/each-feature-alone.log) 2>&1
          sh tools/ci/setup.sh

      - name: Start sccache
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/each-feature-alone.log) 2>&1
          sccache --start-server || true
          sccache --show-stats

      - name: Fetch the MF2 specification text (not vendored, upstream #1112)
        # Into target/xtask-cache, checked against the PIN's digests; --check
        # also holds the vendored suite byte for byte against upstream.
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/each-feature-alone.log) 2>&1
          unset CARGO_BUILD_TARGET
          cargo xtask spec-sync --check

      - name: Every feature of mf2, alone
        run: |
          mkdir -p target/ci-logs
          exec > >(tee -a target/ci-logs/each-feature-alone.log) 2>&1
          unset CARGO_BUILD_TARGET
          cargo xtask each-feature-alone

      - name: Upload this job's log
        # The only way to read what a step printed: this Forgejo serves no job
        # logs over its API (checked 2026-10-06 — 314 routes, none for logs),
        # but artifacts download fine, anonymously, by run id.
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: log-each-feature-alone
          path: target/ci-logs/
          if-no-files-found: warn

