[package]
name = "xtask"
description = "Repository automation: spec/CLDR sync, conformance report, CI, workload generation."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `gzip -9` for the B5 sizes (plans/06 §3), in-process.
flate2.workspace = true
clap.workspace = true
mf2-catalog = { workspace = true, features = ["writer"] }
mf2-conformance.workspace = true
mf2-l4-runner.workspace = true
mf2-runtime.workspace = true
mf2-locale-data = { workspace = true, features = ["extract"] }
mf2-resource.workspace = true
mf2-syntax.workspace = true
serde_json.workspace = true
# `cargo xtask docs` points a documented manifest at the working tree.
toml.workspace = true
thiserror = { workspace = true, features = ["std"] }

[lints]
workspace = true
