# The workload of `cargo xtask native-canaries` (`plan/01` §6.1): the
# smallest native application that uses MF2 — a typed language, a plain
# message, a number and, with a date formatter, a date — so that what a feature
# set *links* can be read out of the binary's symbols.
#
# A workspace of its own, like the examples: the feature sets it is built
# with must not unify into the root workspace's builds, and the canaries
# build it one set at a time.
[workspace]
members = ["."]
resolver = "3"

# What releases use, so the symbols read are the ones a release links. Not
# stripped: the canaries need the symbol table.
[profile.release]
lto = "fat"

[package]
name = "native-canary"
description = "The smallest native MF2 application, linked once per feature set so its symbols can be read."
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = ["native", "native-number-plain"]
# What a native application turns on: the embedded catalogs, the typed
# languages and the store.
native = ["mf2/native"]
# The number formatters of a native application.
native-number-plain = ["mf2/native-number-plain"]
native-number-builtin = ["mf2/native-number-builtin"]
# The date formatters of a native application; `icu` cuts the catalogs'
# date slice, which needs `mf2-build`'s `icu-blob`.
native-datetime-iso = ["mf2/native-datetime-iso"]
native-datetime-icu = ["mf2/native-datetime-icu", "mf2-build/icu-blob"]
# Keeps the base corpus, which has no date, with a date formatter on: what
# a date feature costs an application whose messages show no date and have
# a plain placeholder (`cargo xtask feature-costs`). Nothing on its own.
no-date-message = []
compile = ["mf2/compile"]
# A terminal UI and an Axum server: the two other native shapes `mf2` has a
# module for. Each embeds the catalogs the same way, so each turns `native`
# on beside its own layer. `ratatui` draws a message as a Ratatui `Line`
# through `mf2::ratatui`; `tui` is the same application without it, which
# formats to a `String` and makes the `Line` itself — what
# `cargo xtask feature-costs` sets `ratatui` against.
tui = ["dep:ratatui-core"]
ratatui = ["native", "tui", "mf2/ratatui"]
axum = ["native", "mf2/axum"]
# The bundled IANA database rather than the machine's, which a server turns
# on. Nothing without a date formatter.
tzdb-bundled = ["mf2/tzdb-bundled"]
# A command line that takes `--lang`: `cli` parses it as text and looks the
# language up itself, `clap` lets clap parse it through `mf2`'s value parser.
# `cargo xtask feature-costs` sets the second against the first.
cli = ["dep:clap"]
clap = ["cli", "mf2/clap"]

[dependencies]
mf2 = { path = "../../crates/mf2" }
# The versions the root workspace declares.
clap = { version = "4.6.7", optional = true }
ratatui-core = { version = "0.1.2", optional = true, default-features = false }

[build-dependencies]
mf2-build = { path = "../../crates/mf2-build" }
