# The `intl` date formatter's browser comparison (plans/11 A6; tools/e2e/checks/
# datetime.mjs): a standalone workspace (the root excludes it), so the
# browser module's features (`host-web-datetime-intl`, `host-web`) never unify with
# the native side's (`host-std-datetime-icu`, `host-std`).
#
#   tools/e2e/datetime/build.sh     # cases + expected ICU4X text, and the module
#   cd tools/e2e && node run.mjs datetime --browser all
[workspace]
resolver = "3"
members = ["cases", "wasm"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
mf2 = { path = "../../../crates/mf2" }
mf2-fn-datetime = { path = "../../../crates/mf2-fn-datetime" }
serde_json = "1.0.151"
thiserror = "2.0.20"
# Exact: the wasm-bindgen CLI that post-processes the module is 0.2.128.
wasm-bindgen = { version = "=0.2.128" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# The browser module (size is not what this measures; small and quick).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
