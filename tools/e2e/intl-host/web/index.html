<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rust-mf2: a browser's number formatter</title>
</head>
<body>
<main>
<h1>A browser's number formatter</h1>
<p id="status">loading…</p>
</main>
<script type="module">
// `?build=intl|builtin|plain`: which of the three modules to load.
const build = new URLSearchParams(location.search).get('build') ?? 'intl';
const { default: init, by_host, entries, format, host_type } =
  await import(`/target/e2e-intl-host/pkg-${build}/e2e_intl_host.js`);

await init();
window.mf2ih = {
  build,
  hostType: host_type,
  byHost: by_host,
  entries() {
    const found = entries();
    return found === '' ? [] : found.split(',');
  },
  format(id, n, when) {
    const [text, errors] = format(id, n, when).split('\t');
    return { text, errors: errors ? errors.split(',') : [] };
  },
};
document.getElementById('status').textContent = `ready (${build}: ${host_type()})`;
</script>
</body>
</html>
