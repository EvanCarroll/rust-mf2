# An i18n crate exactly as an application would write one, so that the module
# `mf2-build` generates is compiled — for the server
# and for the client, in every feature combination of the facade — by an
# ordinary `cargo check` of the workspace. `cargo xtask codegen-matrix` runs
# the combinations, including `wasm32-unknown-unknown`.
[package]
name = "mf2-i18n-fixture"
description = "A fixture i18n crate: the generated module, compiled for every feature combination of the facade."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

# The client artifact the edit scenarios hash (`cargo xtask scenarios`).
[[bin]]
name = "mf2-i18n-client"
path = "src/main.rs"

[features]
# `ssr` by default so that a plain workspace build compiles the server side,
# with numbers in plain digits: the corpus counts things, and a message that
# does builds only where its side has named a number formatter. The browser's
# is named too, as an application names both on its one `mf2` line: the
# plural rules then stay in the catalog, where this crate's tests read them,
# and do not move to the server-only table.
default = ["ssr", "host-std-number-plain", "host-web-number-plain"]
# What an application forwards from its own `ssr` / `hydrate` builds.
ssr = ["mf2/host-std"]
hydrate = ["mf2/host-web"]
# The number formatters, framework-free: each build formats with its own
# side's, and the other side's only tell the build script what that side
# reads.
host-std-number-plain = ["mf2/host-std-number-plain"]
host-std-number-builtin = ["mf2/host-std-number-builtin"]
host-web-number-plain = ["mf2/host-web-number-plain"]
host-web-number-intl = ["mf2/host-web-number-intl"]
host-web-number-builtin = ["mf2/host-web-number-builtin"]
# The date formatters, framework-free (plan/08 §3.1). An `icu` one cuts the
# catalogs' date slice, which needs `mf2-build`'s `icu-blob`.
host-std-datetime-iso = ["mf2/host-std-datetime-iso"]
host-std-datetime-icu = ["mf2/host-std-datetime-icu", "mf2-build/icu-blob"]
host-web-datetime-iso = ["mf2/host-web-datetime-iso"]
host-web-datetime-intl = ["mf2/host-web-datetime-intl"]
# The same under the framework's name, which `cargo xtask codegen-matrix`
# builds: the build script reads it as this crate's own feature.
leptos-client-datetime-intl = ["mf2/leptos-client-datetime-intl"]
host-web-datetime-icu = ["mf2/host-web-datetime-icu", "mf2-build/icu-blob"]
host-web-datetime-icu-cached = ["mf2/host-web-datetime-icu-cached", "mf2-build/icu-blob"]
# A native application's module (`Emit::Native`): `CORPUS`, the typed
# locale functions, and — beside `mf2/ssr` — the catalogs the Leptos
# layer's server installs, from the same embedded bytes.
native = ["mf2/native"]
# A plain Axum server's module, with no Leptos: `Locale` as an extractor,
# `Locale::format`, and `install()` giving `mf2::axum` the catalogs.
axum = ["mf2/axum"]
# The B1′ and B13 corpora (`cargo xtask b12-generated`): a
# corpus with nothing a function crate could serve, and this crate's corpus
# plus the three measure functions. Exactly one corpus feature at a time.
corpus-plain = []
corpus-measures = []
# A corpus with a `:datetime` message, for `cargo xtask codegen-matrix`'s
# check that a client formatting dates through `Intl` links no ICU4X: the
# fixture's own corpus has no date, so any date formatter is linked out.
corpus-dates = []
# An owner decision of Phase 5a: the catalogs emitted apart, so that the i18n
# crate's generated module carries no catalog name and a translation edit
# leaves it — and everything that depends on it — untouched.
split-catalogs = []

[dependencies]
mf2.workspace = true

[dev-dependencies]
trybuild.workspace = true
# The generated `Locale`'s value parser, parsed through as clap would.
clap.workspace = true
mf2 = { workspace = true, features = ["clap"] }
# `tests/axum.rs`: a plain Axum application, its requests sent through the
# router.
axum.workspace = true
tower.workspace = true

[[test]]
name = "axum"
required-features = ["axum"]

[build-dependencies]
mf2-build.workspace = true

# This fixture is linted as a strict application lints its own crate (23.0).
# The generated module is `include!`d here, so these levels apply to it too:
# `pedantic` and `nursery` at warn under `-D warnings`, and — unlike the
# workspace's table — `must_use_candidate` is not allowed. `cargo xtask
# codegen-matrix` runs clippy over the sets, so the generator cannot regress.
[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
