[package]
name = "b12-runtime-fn-number-intl"
description = "B12 for the intl client option with mf2-fn-number: b12-runtime-fn-number-measure's registry (the whole localized numeric family) with the `intl` features, over a stub formatter."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
b12-runtime-walk.workspace = true
mf2-fn-number = { workspace = true, features = ["intl"] }
mf2-runtime = { workspace = true, features = ["intl"] }

[lints]
workspace = true
