[package]
name = "b12-dates-icu-any-nozones"
description = "B4 (icu): the date functions over ICU4X from the catalog icu.blob — any calendar, no zone styles. Reported for B12 (ICU4X keeps its own core::fmt and panic paths: the feature documented cost)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
b12-dates-walk.workspace = true
mf2-fn-datetime = { workspace = true, features = ["std-icu", "web-icu"] }
mf2-runtime = { workspace = true }

[lints]
workspace = true
