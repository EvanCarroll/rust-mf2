[package]
name = "b12-runtime-intl"
description = "B12, B13 for the intl client option: the core numeric functions with mf2-runtime's `intl` (the host's number formatter), over a stub formatter — no Rust rounding or plural evaluator may be linked."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
b12-runtime-walk.workspace = true
mf2-runtime = { workspace = true, features = ["intl"] }

[lints]
workspace = true
