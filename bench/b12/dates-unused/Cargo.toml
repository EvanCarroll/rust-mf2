[package]
name = "b12-dates-unused"
description = "B1', B13: fn-datetime linked with both backend features on, unused — b12-runtime's registry and walk, so the module must equal b12-runtime's (+0 B) and hold no date code."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
b12-runtime-walk.workspace = true
mf2-fn-datetime = { workspace = true, features = ["datetime-icu", "datetime-intl"] }
mf2-runtime = { workspace = true }

[lints]
workspace = true
