# The harness's i18n crate, shaped like `examples/demo-csr`'s: the corpus
# under `locales/`, a build script, and a one-line `src/lib.rs`.
[package]
name = "churn-i18n"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[features]
# `row-n` formats a number. `mf2 compile --site` (`cargo xtask churn`) reads
# these from cargo.
default = ["host-web-number-builtin"]
# The generated module names these whether or not the corpus uses them.
host-web-number-builtin = ["mf2/host-web-number-builtin"]
host-web-datetime-iso = ["mf2/host-web-datetime-iso"]
host-web-datetime-intl = ["mf2/host-web-datetime-intl"]
host-web-datetime-icu = ["mf2/host-web-datetime-icu", "mf2-build/icu-blob"]

[dependencies]
mf2 = { path = "../../../crates/mf2", features = ["csr", "host-web"] }

[build-dependencies]
mf2-build = { path = "../../../crates/mf2-build" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("ssr"))'] }
