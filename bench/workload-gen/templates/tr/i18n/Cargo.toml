# The i18n crate of the `tr` template's generated app: an application's own
# i18n crate, pointed at whichever generated workload is being measured
# (`MF2_WORKLOAD_LOCALES`). It carries its own `[workspace]` so that a
# generated app outside this repository can depend on it by path.
[package]
name = "workload-i18n"
description = "The i18n crate of the workload app: the reference workload's corpus, compiled by mf2-build."
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[features]
default = ["ssr"]
# The workload counts things, so each side names a number formatter: plain
# digits, the smallest build there is. A stronger formatter turned on beside
# it is the one that formats.
ssr = ["mf2/host-std", "leptos-server-number-plain"]
hydrate = ["mf2/host-web", "leptos-client-number-plain"]
# The number formatters, under the family names a Leptos application
# writes (`cargo xtask feature-costs` builds each).
leptos-client-number-plain = ["mf2/leptos-client-number-plain"]
leptos-client-number-intl = ["mf2/leptos-client-number-intl"]
leptos-client-number-builtin = ["mf2/leptos-client-number-builtin"]
leptos-server-number-plain = ["mf2/leptos-server-number-plain"]
leptos-server-number-builtin = ["mf2/leptos-server-number-builtin"]
# The browser's date formatters, under the family name a Leptos client
# turns on (`cargo xtask feature-costs` builds each). `icu` reads the date
# slice the build cuts into each catalog, which needs `mf2-build`'s
# `icu-blob`.
leptos-client-datetime-iso = ["mf2/leptos-client-datetime-iso"]
leptos-client-datetime-intl = ["mf2/leptos-client-datetime-intl"]
leptos-client-datetime-icu = ["mf2/leptos-client-datetime-icu", "mf2-build/icu-blob"]
leptos-client-datetime-icu-cached = ["mf2/leptos-client-datetime-icu-cached", "mf2-build/icu-blob"]

[dependencies]
mf2 = { path = "../../../../../crates/mf2" }

[build-dependencies]
mf2-build = { path = "../../../../../crates/mf2-build" }
