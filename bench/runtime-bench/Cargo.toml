[package]
name = "runtime-bench"
description = "Phase 3 A5/A5b/A11: the numeric A/B (own digit buffer vs fixed_decimal), the ECMA-402 differential corpus, and the native runtime bench (B10)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The A/B baseline: the numeric code over `fixed_decimal`.
fixed-decimal = ["mf2-runtime/fixed-decimal"]
# `date_cost` without the formatter cache: ICU4X's provider and formatter
# built for each placeholder, as before plan/11 18.2 (to alternate with the
# default binary).
uncached-dates = []

[dependencies]
catalog-bench.workspace = true
clap.workspace = true
# `native-datetime-icu`: the date example (`examples/date_cost.rs`). `native`: B10's
# rows through a native application's forms (Phase 10 C2).
mf2 = { workspace = true, features = ["compile", "host-std", "fn-number", "native-datetime-icu", "native"] }
mf2-catalog.workspace = true
mf2-fn-datetime = { workspace = true, features = ["std-icu", "std-cache"] }
mf2-model = { workspace = true, features = ["suite-names"] }
mf2-runtime.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
thiserror = { workspace = true, features = ["std"] }

[lints]
workspace = true
