[package]
name = "b12-dates-web-base"
description = "B4 (intl) base: the date walk over the core registry on mf2-host-web's HOST (with the date features on: HOST must link none of their glue), through wasm-bindgen."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
b12-dates-walk.workspace = true
mf2-host-web = { workspace = true, features = ["datetime-intl"] }
mf2-runtime = { workspace = true }

[lints]
workspace = true
