# B12 check for the catalog reader.
#
# A standalone workspace (the root workspace excludes `bench/browser-no-fmt`): the
# harnesses are `no_std` cdylibs for wasm32-unknown-unknown with their own
# `#[panic_handler]` and `#[global_allocator]`, which the root workspace's
# host builds must never see. `check.sh` builds them and runs the check.
[workspace]
resolver = "3"
members = [
    "harness",
    "base",
    "reader",
    "control",
    "runtime-walk",
    "runtime",
    "runtime-nonum",
    "runtime-fixed",
    "runtime-fn-number",
    "runtime-fn-number-unused",
    "runtime-fn-number-measure",
    "runtime-intl",
    "runtime-fn-number-intl",
    "runtime-intl-unused",
    "dates-walk",
    "dates-base",
    "dates-semantics",
    "dates-neutral",
    "dates-icu-greg-nozones",
    "dates-icu-greg-zones",
    "dates-icu-any-nozones",
    "dates-icu-any-zones",
    "dates-unused",
    "dates-web-base",
    "dates-web-plain",
    "dates-intl",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
b12-harness = { path = "harness" }
# The client path: no features (the writer, decoder and manifest are build side).
mf2-catalog = { path = "../../crates/mf2-catalog", default-features = false }
b12-runtime-walk = { path = "runtime-walk" }
mf2-runtime = { path = "../../crates/mf2-runtime", default-features = false }
mf2-fn-number = { path = "../../crates/mf2-fn-number", default-features = false }
# The date harnesses (B4, B12, B13, B1′ for dates); the
# backends are features of each harness.
b12-dates-walk = { path = "dates-walk" }
mf2-fn-datetime = { path = "../../crates/mf2-fn-datetime", default-features = false }
mf2-host-web = { path = "../../crates/mf2-host-web", default-features = false }

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_safety_doc = "allow"
must_use_candidate = "allow"

# The 06 §3 size method, identical to the root workspace's `wasm-release`:
# opt-level z, fat LTO, one CGU, abort, strip; then `wasm-opt -Oz`, gzip -9.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

# The same build keeping the symbol names (the wasm `name` section), for the
# twiggy symbol check.
[profile.wasm-syms]
inherits = "wasm-release"
strip = false
