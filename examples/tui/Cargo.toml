# A trippy-shaped terminal UI, drawn into a Ratatui buffer: the Phase 10
# sample and the `cargo xtask tui-allocs-vs-pseudotrippy` workload. It is written against 2.0 as
# the user guide's native page
# writes an application — `mf2` with `ratatui`, `mf2-build` in the build
# script, the messages in `locales/` — and it carries `upstream.rs`, an
# in-house re-implementation of trippy's own translation approach, as the
# baseline.
#
# A workspace of its own, like the other examples: nothing here should unify
# into the root workspace's builds.
[workspace]
members = ["."]
resolver = "3"

[package]
name = "demo-tui"
description = "A trippy-shaped terminal UI in four languages, and the baseline it is measured against."
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
mf2 = { path = "../../crates/mf2", features = ["ratatui", "native-number-builtin"] }
# No terminal backend: every frame is drawn into a `Buffer`. The layout
# cache is one of Ratatui's defaults; without it every frame re-solves every
# layout, which costs thousands of allocations and hides everything else.
ratatui = { version = "0.30", default-features = false, features = ["std", "layout-cache", "underline-color"] }
# The baseline's catalog: one TOML table per message, one value per locale.
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

[build-dependencies]
mf2-build = { path = "../../crates/mf2-build" }
