# The example's i18n crate, shaped like the other examples': the corpus under
# `locales/`, a build script, and a one-line `src/lib.rs`.
[package]
name = "demo-csr-i18n"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Numbers in each locale's own symbols (the counter), and dates through the
# browser's own `Intl.DateTimeFormat` (`datetime-intl`): a client-only
# application has a browser to ask, so it ships no date data. The published
# line is shown in the reader's time zone, read at mount. The build reads
# `mf2`'s features from `mf2` itself, and `mf2 compile --site`
# (`../Trunk.toml`) from cargo, to build the catalogs the browser fetches.
mf2 = { path = "../../../crates/mf2", features = ["csr", "host-web", "fn-number", "datetime-intl"] }

[build-dependencies]
mf2-build = { path = "../../../crates/mf2-build" }
