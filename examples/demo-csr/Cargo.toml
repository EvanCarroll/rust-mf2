# A workspace of its own, like the other examples: an application turns on
# exactly one of `ssr`, `hydrate` and `csr`, and cargo unifies features across
# a workspace.
[workspace]
members = [".", "i18n"]
resolver = "3"

[package]
name = "demo-csr"
description = "The Phase 7 client-only example: built by trunk, served as static files, the locale chosen in the browser and remembered there."
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
console_error_panic_hook = "0.1.7"
demo-csr-i18n = { path = "i18n" }
leptos = { version = "0.8.20", features = ["csr"] }
leptos-mf2 = { path = "../../crates/leptos-mf2", features = ["csr"] }
leptos_meta = "0.8.6"
mf2 = { path = "../../crates/mf2", features = ["csr"] }
wasm-bindgen = "0.2.128"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
