# The example's i18n crate, shaped exactly like `examples/demo-ssr`'s: the
# corpus under `locales/`, a build script, and a one-line `src/lib.rs`.
[package]
name = "demo-islands-i18n"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Numbers in each locale's own symbols (the counter). No dates: this example
# is about where the wasm goes, and needs nothing more. `static-locale`
# belongs to the application and applies to its server and client alike
# (master plan §5): on an islands page a switch is a cookie and a reload, so
# nothing on the client follows the locale. The build reads `mf2`'s features
# from `mf2` itself.
mf2 = { path = "../../../crates/mf2", features = ["fn-number", "static-locale"] }

[build-dependencies]
mf2-build = { path = "../../../crates/mf2-build" }
