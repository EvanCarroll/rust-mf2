# The application's i18n crate, exactly as `plans/05-tooling.md` §4 describes
# one: `locales/`, an `mf2.toml`, a build script, and a `src/lib.rs` that is
# one line. Everything else — the manifest, the catalogs, the closed-world
# registry, `tr!` — is generated into `OUT_DIR`.
[package]
name = "demo-i18n"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The functions a message may use: `mf2`'s features, which the build reads
# from `mf2` itself, as the application's server and client builds unify
# them. A message can never add formatting code to the wasm by itself.
mf2 = { path = "../../../crates/mf2", features = ["fn-number", "leptos-client-datetime-icu", "leptos-server-datetime-icu"] }

[build-dependencies]
# ICU4X dates: the build compiles each locale's date data.
mf2-build = { path = "../../../crates/mf2-build", features = ["icu-blob"] }
