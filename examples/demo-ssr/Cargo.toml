# A workspace of its own: an application turns on exactly one of `ssr` and
# `hydrate`, and cargo unifies features across a workspace, so an app crate
# cannot share one with libraries that are built both ways.
[workspace]
members = [".", "i18n"]
resolver = "3"

[package]
name = "demo-ssr"
description = "The Phase 6 example: SSR, hydration, a locale switch, markup as elements, a date and a plural — the whole integration in one page."
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
demo-i18n = { path = "i18n" }
leptos = { version = "0.9.0-beta", default-features = false }
leptos_meta = "0.9.0-beta"
leptos_router = "0.9.0-beta"
# `mark-fallback-lang`: borrowed text is marked with its language (the note
# on the home page, untranslated in Arabic on purpose).
mf2 = { path = "../../crates/mf2", features = ["leptos", "fn-number", "leptos-client-datetime-icu", "leptos-server-datetime-icu", "mark-fallback-lang"] }

axum = { version = "0.8.9", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
leptos_axum = { version = "0.9.0-beta", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
wasm-bindgen = { version = "0.2.128", optional = true }

[features]
default = []
hydrate = [
    "leptos/hydrate",
    # Leptos 0.9 hydrates the `#[lazy_route]` only with this; without it
    # tachys panics at hydration.
    "leptos/lazy",
    "mf2/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "mf2/ssr",
    "mf2/axum",
    "dep:axum",
    "dep:leptos_axum",
    "dep:tokio",
    "dep:tower-http",
]

[package.metadata.leptos]
output-name = "demo_ssr"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3702"
reload-port = 3703
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
# `cargo leptos watch` watches the crate's own sources only; without this a
# translation edit is not seen until something else changes. The i18n
# crate's build script reruns on it and the server restarts with the edit.
watch-additional-files = ["i18n/locales"]

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
