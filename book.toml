[book]
title = "Rust MF2"
language = "en"
src = "docs"

[build]
# Local builds land where CI builds, under target/ (not committed); the
# Book workflow deploys that directory to GitHub Pages.
build-dir = "target/mdbook"
create-missing = false

[output.html]
# The book is served from https://evancarroll.github.io/rust-mf2/; the 404
# page needs the path prefix to find its stylesheets and scripts.
site-url = "/rust-mf2/"
git-repository-url = "https://github.com/EvanCarroll/rust-mf2"

# The book's code blocks are parts of small applications that `cargo xtask
# docs` compiles; none runs alone on the Rust playground.
[output.html.playground]
runnable = false
