# The `tr!` proc-macro (plans/05-tooling.md §4, plans/04-leptos-integration.md
# §2). Never named by an application: the generated i18n module's exported
# `tr!` wrapper forwards to it through the facade's `__mf2` re-export, with the
# manifest's absolute path and hash baked in.
[package]
name = "mf2-macros"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The tr! proc-macro: a call site checked against the manifest at compile time and lowered to a positional description of the message."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/mf2-macros"
keywords = ["messageformat", "mf2", "i18n", "macro", "leptos"]
categories = ["internationalization", "localization", "development-tools::procedural-macro-helpers"]
# The package\'s file list (`cargo xtask package`) is not part of it.
exclude = ["package.txt"]

[lib]
proc-macro = true

[dependencies]
mf2-catalog = { workspace = true, features = ["manifest"] }
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
thiserror = { workspace = true, features = ["std"] }
# Argument names are matched against the manifest's, which are NFC (05 §3).
unicode-normalization = { workspace = true, features = ["std"] }

# docs.rs, as `cargo xtask docs-rs` builds it; also the feature set and
# target `cargo xtask api` lists the public API with (api.txt).
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
