[package]
name = "mf2-runtime"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The MessageFormat 2 evaluator of Rust MF2: formats from a .mf2b catalog (no_std, fmt-free, panic-free): resolution, selection, fallback, bidi, parts, markup, the registry and the core functions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/mf2-runtime"
keywords = ["messageformat", "mf2", "i18n", "l10n", "formatting"]
categories = ["internationalization", "localization", "value-formatting", "no-std", "wasm"]
# The package\'s file list (`cargo xtask package`) is not part of it.
exclude = ["package.txt"]

[features]
# The A/B of owner decision 1: the numeric code over
# `fixed_decimal` instead of the crate's own panic-free digit buffer. Bench and
# test only; never enabled by a client.
fixed-decimal = ["dep:fixed_decimal"]
# A browser's numbers through `Intl` (owner decision 4):
# on wasm32-unknown-unknown only, the numeric functions take their display,
# `:integer`'s rounding and the plural category from the host's number
# formatter (`Host::numbers`: mf2-host-web's
# `Intl`), and the Rust digit plan, rounding and plural evaluator are not
# linked. Everywhere else (servers, wasm32-wasip1, native tests) nothing
# changes.
web-number-intl = []
# A browser's numbers by this crate's own code, said out loud: it is what a
# build has without `web-number-intl`, and with both on it wins. Cargo adds
# every feature a build's crates ask for, so without this name a second
# crate asking for `Intl` would take the first's own number code away.
web-number-builtin = []

[dependencies]
fixed_decimal = { workspace = true, optional = true }
mf2-catalog.workspace = true
mf2-model.workspace = true
thiserror.workspace = true

[dev-dependencies]
mf2-catalog = { workspace = true, features = ["writer", "decode"] }
mf2-syntax.workspace = true
ryu.workspace = true
unicode-normalization = { workspace = true, features = ["std"] }

# docs.rs, as `cargo xtask docs-rs` builds it; also the feature set and
# target `cargo xtask api` lists the public API with (api.txt).
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
