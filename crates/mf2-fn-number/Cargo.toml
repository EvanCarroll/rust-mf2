[package]
name = "mf2-fn-number"
description = "The localized numeric functions of mf2-two (feature fn-number): locale symbols, grouping and numbering systems over the runtime's numeric core, and :percent, :currency, :unit (no_std, fmt-free, panic-free)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The `intl` client option (plans/03-runtime.md §2.7, §5.3): on
# wasm32-unknown-unknown the localized numbers come from the host's
# `Intl.NumberFormat` (mf2-host-web's `NUMBERS_HOST`), not from the catalog's
# number data. The switch is the runtime's (`mf2_runtime::INTL_NUMBERS`), so
# this crate and the runtime can never disagree; the feature turns it on.
intl = ["mf2-runtime/intl"]

[dependencies]
mf2-catalog.workspace = true
mf2-runtime.workspace = true

[dev-dependencies]
mf2 = { workspace = true, features = ["compile", "host-std"] }
mf2-catalog = { workspace = true, features = ["writer"] }
mf2-locale-data.workspace = true
mf2-syntax.workspace = true

[lints]
workspace = true
