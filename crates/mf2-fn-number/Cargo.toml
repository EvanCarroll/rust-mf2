[package]
name = "mf2-fn-number"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The localized numeric functions of Rust MF2 (feature fn-number): locale symbols, grouping and numbering systems over the runtime's numeric core, and :percent, :currency, :unit (no_std, fmt-free, panic-free)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/mf2-fn-number"
keywords = ["messageformat", "mf2", "i18n", "number", "currency"]
categories = ["internationalization", "localization", "value-formatting", "no-std"]
# Every integration test uses `mf2`, which the package does not carry (the
# path-only dev-dependency below): they run in the workspace.
exclude = [
    "tests/",
    # Its own file list (`cargo xtask package`).
    "package.txt",
]

[features]
# The number split (plan/08 §6): on wasm32-unknown-unknown only, `:currency`
# and `:unit` take their currency symbols and names, unit names and layout
# from the host's number formatter (`Host::numbers`: mf2-host-web's `Intl`,
# its feature `intl-names`), and the currency's own fraction digits too;
# the digits, rounding and plural selection stay in Rust, written with the
# catalog's number symbols. Such a client reads no `currency.data` or
# `unit.data`. Everywhere else nothing changes. `mf2-runtime`'s `intl`
# (the whole option) takes precedence.
intl-names = []

[dependencies]
mf2-catalog.workspace = true
mf2-runtime.workspace = true

[dev-dependencies]
# Path-only, not the workspace's `=3.0.0`: `mf2` depends on this crate, so
# a versioned dev-dependency on it is a cycle `cargo package` cannot
# resolve. Cargo strips a path-only dev-dependency from the package, and
# the tests that use `mf2` stay in the workspace (`exclude` above;
# plans/17-phase-9-work-order.md A4).
mf2 = { path = "../mf2", features = ["compile", "host-std"] }
mf2-catalog = { workspace = true, features = ["writer"] }
mf2-locale-data.workspace = true
mf2-syntax.workspace = true

# docs.rs, as `cargo xtask docs-rs` builds it; also the feature set and
# target `cargo xtask api` lists the public API with (api.txt).
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
