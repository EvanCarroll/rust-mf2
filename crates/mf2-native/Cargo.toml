[package]
name = "mf2-native"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "1.x's native application support of Rust MF2, kept as a shim: it re-exports `mf2::native`, where the code now lives, under 1.x's names, and turns on mf2's `native` feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/mf2-native"
keywords = ["messageformat", "mf2", "i18n", "cli"]
categories = ["internationalization", "localization"]
exclude = ["package.txt"]

[dependencies]
mf2 = { workspace = true, features = ["native"] }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
