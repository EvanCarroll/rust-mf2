[package]
name = "mf2-cli"
description = "The `mf2` command: check, compile, fmt, stats, dump, pseudo, export/import and watch a MessageFormat 2 corpus."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mf2"
path = "src/main.rs"

[features]
# The per-locale `icu.blob` of the `datetime-icu` backend.
icu-blob = ["mf2-build/icu-blob"]

[dependencies]
clap.workspace = true
fluent-syntax.workspace = true
icu_locale_core = { workspace = true, features = ["alloc"] }
mf2-build.workspace = true
mf2-catalog = { workspace = true, features = ["decode", "manifest"] }
mf2-locale-data.workspace = true
mf2-model = { workspace = true, features = ["serde"] }
mf2-resource.workspace = true
mf2-runtime.workspace = true
mf2-syntax.workspace = true
# `convert --from leptos-fluent` (plans/05 §6.2): the call sites, located by
# span, parsed by syn, and the diff before `--write`.
proc-macro2 = { workspace = true, features = ["span-locations"] }
quote.workspace = true
# `export --format xliff` / `import` of XLIFF 2 (plans/05 §6.3).
quick-xml.workspace = true
serde_json.workspace = true
similar.workspace = true
syn = { workspace = true, features = ["full"] }
toml.workspace = true
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
fluent-bundle.workspace = true
mf2 = { workspace = true, features = ["compile", "fn-number", "host-std"] }
unic-langid.workspace = true
workload-gen.workspace = true

[lints]
workspace = true
