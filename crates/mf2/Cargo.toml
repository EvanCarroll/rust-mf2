[package]
name = "mf2"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Unicode MessageFormat 2 for Rust, for Leptos web applications and native CLI and terminal applications: the one crate an application names — the call-site types, the Leptos layer, the native application support and its Ratatui text behind features, the formatter, and compile_str for ad-hoc messages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# `src/matching/cldr.rs`, CLDR's language-matching table, is derived from
# the Unicode CLDR (`LICENSE-UNICODE`), as `mf2-locale-data`'s tables are.
license = "MIT AND Unicode-3.0"
publish = true
readme = "README.md"
documentation = "https://docs.rs/mf2"
keywords = ["messageformat", "mf2", "i18n", "l10n", "leptos"]
categories = ["internationalization", "localization", "wasm", "web-programming"]
# The package\'s file list (`cargo xtask package`) is not part of it.
exclude = ["package.txt"]
# Its features reach the build script of the crate that includes the
# generated module as `DEP_MF2_V3_FEATURES` (`mf2_build::run()`, plans/19 §11).
# The major version is in the name, so that a 4.x resolves beside it.
links = "mf2-v3"
build = "build.rs"

[features]
# None is on by default, so `default-features = false` is never needed. A
# feature exists only where the linker cannot decide: it changes the
# dependency graph, the behaviour, or who supplies locale data. Everything
# else is linked because the generated module names it. The features answer
# four questions: where does it run (the Leptos line and mode, `axum`,
# `native`, `ratatui`, `clap`, `host-std`, `host-web`); what can messages do
# (`fn-number`, `fn-datetime`); who supplies locale data (`number-intl`,
# `datetime-icu`, `datetime-intl`, `tzdb-bundled`); behaviour and tools
# (`static-locale`, `mark-fallback-lang`, `compile`).
default = []
# `compile_str`: parse, validate, analyze and write a one-message catalog
# (std, server and tests; never in a client).
compile = ["dep:mf2-syntax", "dep:mf2-locale-data", "mf2-catalog/writer"]
# Locale-aware numbers: symbols, grouping, numbering systems, :percent (and
# :currency, :unit) — mf2-fn-number.
fn-number = ["dep:mf2-fn-number"]
# Dates and times: :datetime, :date, :time and unannotated date/time values
# — mf2-fn-datetime — and, natively, named time zones (the machine's IANA
# database unless `tzdb-bundled`). With a Leptos mode, also dates in the reader's time
# zone: the client reads the browser's zone, corrects a page rendered in
# another after hydrating, and writes the `mf2_tz` cookie the server renders
# the next page in; off, no byte of it is in the client.
fn-datetime = ["dep:mf2-fn-datetime", "mf2-host-std?/time-zones"]
# The date backends, each implying `fn-datetime`: `datetime-icu` — ICU4X on
# client and server, data from the catalog's `icu.blob` (which `compile_str`
# then emits); `datetime-intl` — the browser's `Intl.DateTimeFormat` on
# wasm32-unknown-unknown, ICU4X with compiled data elsewhere.
# With `host-web`, each also gives the browser host its date methods: named
# zones from the browser's data (both), `Intl.DateTimeFormat` (`datetime-intl`).
datetime-icu = [
    "fn-datetime",
    "mf2-fn-datetime/datetime-icu",
    "mf2-host-web?/time-zones",
    "mf2-locale-data?/icu-blob",
]
datetime-intl = ["fn-datetime", "mf2-fn-datetime/datetime-intl", "mf2-host-web?/datetime-intl"]
# Time zones from the IANA database bundled into this binary rather than the
# machine's. A native application follows the system it runs
# on, so that a zone added or amended since this binary was built is right; a
# server, where every reply must say the same thing whatever the host holds,
# turns this on — `ssr` and `axum` do it for you. Nothing without
# `fn-datetime`, which is what links a zone database at all.
tzdb-bundled = ["mf2-host-std?/tzdb-bundled"]
# A Host: native (servers, tests, wasm32-wasip1) or the browser. A mode
# implies its host; with no framework, naming one is how `mf2` is used.
host-std = ["dep:mf2-host-std"]
host-web = ["dep:mf2-host-web"]
# A native application, a command-line tool or a terminal UI (`mf2::native`):
# one generated corpus's catalogs, embedded in the executable (read in place,
# `static-bytes`) or shipped beside it (checked against the content hash in
# their names, `content-hash`); the system's preferred languages
# (`sys-locale`) and time zone (the native host's, with `fn-datetime`).
# std, and never in a browser build: with `hydrate` or `csr` it is a compile
# error when compiling for `wasm32`; on the host the two compile together,
# as a workspace's check unifies them. Implies the native host.
native = [
    "host-std",
    "dep:sys-locale",
    "mf2-catalog/static-bytes",
    "mf2-catalog/content-hash",
]
# A terminal UI's text (`mf2::ratatui`): a message as owned Ratatui `Text`
# or `Line`, its markup (`{#name}…{/name}`) as the styles the application
# maps by name. Implies `native`, and adds `ratatui-core` alone, whose
# types `ratatui` re-exports. Never in a browser build: with `hydrate` or
# `csr` it is a compile error of its own when compiling for `wasm32`; on
# the host the two compile together, as `native` does.
ratatui = ["native", "dep:ratatui-core"]
# An Axum server (`mf2::axum`), with or without Leptos: locale negotiation,
# the catalogs served from the server binary (`/i18n/*`, precompressed), and
# the generated `Locale` as an extractor, with `Locale::format`. Never in a
# browser build: with `hydrate` or `csr` it is a compile error when compiling
# for `wasm32`; on the host the two compile together, as `native` does.
axum = [
    "host-std",
    "tzdb-bundled",
    "dep:axum",
    "dep:http",
    "dep:tower-layer",
    "dep:tower-service",
    "dep:brotli",
    "dep:flate2",
]
# `clap`: a generated `Locale` gets a value parser, so that `--lang` parses
# through the one matcher (`fr_CA.UTF-8` is French) and `--help` lists the
# tags. std; for a native application's command line.
clap = ["dep:clap"]
# `number-intl` (2.0's `intl`): on wasm32-unknown-unknown the numeric functions
# format and select through the browser's Intl.NumberFormat and
# Intl.PluralRules (mf2-host-web's NUMBERS_HOST), requiring
# Intl.NumberFormat v3; every other build (servers, wasm32-wasip1, tests)
# keeps the Rust path.
number-intl = ["mf2-runtime/intl", "mf2-host-web?/intl"]
# The Leptos line the layer renders with. `leptos` is Leptos 0.9, the
# default line; `leptos-0-8` is Leptos 0.8. Neither is a default feature: an
# application writes one on its `mf2` dependency, and a mode needs one. Both
# at once, or a mode with neither, is a compile error that says what to
# write. Each line is a dependency under a name of its own, with its helper
# crate of components (`mf2-leptos-ui-0-9`, `mf2-leptos-ui-0-8`).
leptos = ["dep:leptos_0_9", "dep:tachys_0_3", "dep:reactive_graph_0_3", "dep:mf2-leptos-ui-0-9"]
leptos-0-8 = [
    "dep:leptos_0_8",
    "dep:tachys_0_2",
    "dep:reactive_graph_0_2",
    "dep:mf2-leptos-ui-0-8",
]
# The three Leptos modes: the Leptos layer (`mf2::leptos`), rendered on the
# server (`ssr`), hydrated in the browser (`hydrate`) or built there
# (`csr`). An application turns exactly one on, in its own feature of the
# same name, beside Leptos's. Each implies its host.
ssr = [
    "host-std",
    "tzdb-bundled",
    "dep:oco_ref",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "leptos_0_9?/ssr",
    "tachys_0_3?/ssr",
    "mf2-leptos-ui-0-9?/ssr",
    "leptos_0_8?/ssr",
    "tachys_0_2?/ssr",
    "mf2-leptos-ui-0-8?/ssr",
]
hydrate = [
    "host-web",
    "dep:oco_ref",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "dep:any_spawner",
    "dep:wasm-bindgen-futures",
    "leptos_0_9?/hydrate",
    "tachys_0_3?/hydrate",
    "mf2-leptos-ui-0-9?/hydrate",
    "leptos_0_8?/hydrate",
    "tachys_0_2?/hydrate",
    "mf2-leptos-ui-0-8?/hydrate",
]
csr = [
    "host-web",
    "dep:oco_ref",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "dep:wasm-bindgen-futures",
    "leptos_0_9?/csr",
    "mf2-leptos-ui-0-9?/csr",
    "leptos_0_8?/csr",
    "mf2-leptos-ui-0-8?/csr",
]
# No live update: a locale switch is a cookie and a navigation. Rendered
# nodes then register nothing, which is the natural fit for islands.
static-locale = []
# WCAG 3.1.2, Language of Parts: text the catalog borrowed from a fallback
# locale renders inside a `<span lang>`, identically on server and client.
# Only a borrowed message in a view position (a text child, a rich
# fragment) is wrapped, so a page with no missing translation is unchanged;
# `dir` is added when the lender's direction differs from the page's.
# Attributes and strings cannot carry a `lang` of their own and stay
# unmarked. Off, nothing of it is compiled.
mark-fallback-lang = []

[dependencies]
mf2-catalog.workspace = true
mf2-fn-number = { workspace = true, optional = true }
mf2-fn-datetime = { workspace = true, optional = true }
mf2-host-std = { workspace = true, optional = true }
mf2-host-web = { workspace = true, optional = true }
mf2-locale-data = { workspace = true, optional = true }
mf2-macros.workspace = true
mf2-model.workspace = true
mf2-runtime.workspace = true
mf2-syntax = { workspace = true, optional = true }
thiserror.workspace = true

# The native module (`native`): the system's preferred languages. The
# machine's time zone and the zone database are the native host's
# (`mf2-host-std`, feature `time-zones`), whose date library this crate
# reaches through its re-export — for the `IntoArg` impls and for their test
# — so that nothing here depends on it directly.
sys-locale = { workspace = true, optional = true }

# The Ratatui module (`ratatui`): the text and style types, which `ratatui`
# re-exports.
ratatui-core = { workspace = true, optional = true }

# The Axum module (`axum`): the router, the request's parts, the
# negotiation's tower layer, and the catalogs' precompressed variants.
# `original-uri`: the mark of a request the router served, which the
# start-up route list's made-up request lacks (E4).
axum = { workspace = true, optional = true, features = ["original-uri"] }
http = { workspace = true, optional = true }
tower-layer = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }
brotli = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }

# `clap`: the generated `Locale`'s value parser.
clap = { workspace = true, optional = true }

# The Leptos layer: each line under names of its own, and its helper.
leptos_0_9 = { workspace = true, optional = true }
tachys_0_3 = { workspace = true, optional = true }
reactive_graph_0_3 = { workspace = true, optional = true }
mf2-leptos-ui-0-9 = { workspace = true, optional = true }
leptos_0_8 = { workspace = true, optional = true }
tachys_0_2 = { workspace = true, optional = true }
reactive_graph_0_2 = { workspace = true, optional = true }
mf2-leptos-ui-0-8 = { workspace = true, optional = true }
oco_ref = { workspace = true, optional = true }
# The client half: the hydration cursor's nodes, the catalog fetch, one
# console diagnostic. No `#[wasm_bindgen]` item of ours, so
# `forbid(unsafe_code)` holds.
any_spawner = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }

[dev-dependencies]
# `tests/churn.rs` runs the client's effects natively.
any_spawner = { workspace = true, features = ["futures-executor"] }
# `tests/fallback_lang.rs` writes catalogs that borrow a message from another
# locale, which `compile_str` (one locale, nothing missing) never does.
mf2-catalog = { workspace = true, features = ["writer"] }
# `tests/matching.rs` cuts CLDR's language-matching table to a corpus, as
# `mf2-build` does, and checks the cut against the whole.
mf2-locale-data.workspace = true
mf2-syntax.workspace = true
# The E4 warning's unit test builds the server as the web starter does:
# the route list at start-up, then requests through the router.
leptos_axum.workspace = true
tower.workspace = true
tokio = { workspace = true, features = ["rt"] }

# The call-site core formats against a catalog the caller supplies: the test
# builds one with `compile_str` and formats it through the native host.
[[test]]
name = "call_site"
required-features = ["compile", "host-std", "fn-datetime"]

# What a `tr!` argument may be: each `IntoArg` conversion through a catalog
# `compile_str` writes, and the dispatch the macro expands an argument to.
[[test]]
name = "arguments"
required-features = ["compile", "host-std", "fn-datetime"]

# Rendering a description through the view types, on the server. Each of
# these also needs a Leptos line, which a mode requires anyway.
[[test]]
name = "render"
required-features = ["ssr", "compile"]

[[test]]
name = "time_zone"
required-features = ["ssr", "compile", "fn-datetime"]

# The client half, natively.
[[test]]
name = "churn"
required-features = ["csr", "compile", "host-std"]

[[test]]
name = "fallback_lang"
required-features = ["ssr", "mark-fallback-lang"]

# A native application's catalogs, embedded or read from files, and its
# locale: `compile_str` writes the catalogs.
# Which IANA database a lookup reads: the bundle with `tzdb-bundled`, the
# system's without it — against one the test writes itself.
[[test]]
name = "zone_db"
required-features = ["host-std", "fn-datetime"]

[[test]]
name = "native"
required-features = ["native", "compile"]

# The native store: `install`, the app-wide language and a thread's own, the
# settings, and the ambient forms (`Display`, `to_string`, `to_cow`) read
# through it; `Catalogs`, the explicit form. Each of the next three is a
# binary of its own, since the store is process-wide: before `install`;
# `install_from_directory`; the system's zone, in a child process whose
# `TZ` is a POSIX rule.
[[test]]
name = "ambient"
required-features = ["native", "compile"]

[[test]]
name = "uninstalled"
required-features = ["native", "compile"]

[[test]]
name = "from_directory"
required-features = ["native", "compile"]

[[test]]
name = "system_zone"
required-features = ["native", "compile", "fn-datetime"]

# Phase 10 C3: choosing a language reads the tag where it lies; a binary of
# its own, whose allocator counts.
[[test]]
name = "locale_allocations"
required-features = ["native", "compile"]

# The one lookup with a Leptos mode beside `native`, on the host: the
# request's or the page's catalog first, then the store's. It needs a mode
# (and its line) too; with none it is empty.
[[test]]
name = "lookup"
required-features = ["native", "compile"]

# A message as Ratatui text, its markup as styles, formatted through a
# native application's catalogs.
[[test]]
name = "ratatui"
required-features = ["ratatui", "compile"]

# The one locale matcher over CLDR's whole table, which a server and a
# native application carry (`host-std`).
[[test]]
name = "matching"
required-features = ["host-std"]

# docs.rs, as `cargo xtask docs-rs` builds it. `cargo xtask api` lists this
# crate's public API per mode instead ([package.metadata.api], below).
[package.metadata.docs.rs]
# The server on Leptos 0.9, and the native, Ratatui and Axum modules, which
# compile beside it: the modes exclude each other, and `mf2::leptos` names what the
# client modes add.
features = [
    "compile",
    "fn-number",
    "datetime-icu",
    "host-std",
    "leptos",
    "ssr",
    "static-locale",
    "mark-fallback-lang",
    "native",
    "ratatui",
    "axum",
]
targets = ["x86_64-unknown-linux-gnu"]

# The public API per mode: `cargo xtask api` lists each as `api/<mode>.txt`,
# and `cargo xtask release` compares each with the last release
# (cargo-semver-checks). No one feature set shows it all: the Leptos modes
# exclude each other. `core` is a build with no mode; each other mode adds
# its own features to `core`'s, which are the options docs.rs shows.
[package.metadata.api.modes]
core = ["compile", "fn-number", "datetime-icu", "host-std"]
ssr = [
    "compile",
    "fn-number",
    "datetime-icu",
    "host-std",
    "leptos",
    "ssr",
    "static-locale",
    "mark-fallback-lang",
]
hydrate = [
    "compile",
    "fn-number",
    "datetime-icu",
    "host-std",
    "leptos",
    "hydrate",
    "static-locale",
    "mark-fallback-lang",
]
csr = [
    "compile",
    "fn-number",
    "datetime-icu",
    "host-std",
    "leptos",
    "csr",
    "static-locale",
    "mark-fallback-lang",
]
native = ["compile", "fn-number", "datetime-icu", "host-std", "native"]
ratatui = ["compile", "fn-number", "datetime-icu", "host-std", "ratatui"]
axum = ["compile", "fn-number", "datetime-icu", "host-std", "axum"]

# How 2.0.0, the published release this one is compared with, spelled each of
# its modes, for `cargo xtask release`: a later rename of a feature must not
# change how the baseline is built. 2.0.0 had all seven modes.
[package.metadata.api.baseline."2.0.0"]
core = ["compile", "fn-number", "datetime-icu", "host-std"]
ssr = [
    "compile",
    "fn-number",
    "datetime-icu",
    "host-std",
    "leptos",
    "ssr",
    "static-locale",
    "mark-fallback-lang",
]
hydrate = [
    "compile",
    "fn-number",
    "datetime-icu",
    "host-std",
    "leptos",
    "hydrate",
    "static-locale",
    "mark-fallback-lang",
]
csr = [
    "compile",
    "fn-number",
    "datetime-icu",
    "host-std",
    "leptos",
    "csr",
    "static-locale",
    "mark-fallback-lang",
]
native = ["compile", "fn-number", "datetime-icu", "host-std", "native"]
ratatui = ["compile", "fn-number", "datetime-icu", "host-std", "ratatui"]
axum = ["compile", "fn-number", "datetime-icu", "host-std", "axum"]

[lints]
workspace = true
