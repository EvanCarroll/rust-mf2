[package]
name = "mf2"
description = "Unicode MessageFormat 2 for Leptos: the one crate an application names — re-exports of the mf2-two crates and their feature flags, and compile_str for ad-hoc messages."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# `compile_str`: parse, validate, analyze and write a one-message catalog
# (std, server and tests; never in a client).
compile = ["dep:mf2-syntax", "dep:mf2-locale-data", "mf2-catalog/writer"]
# Locale-aware numbers (plans/00-master-plan.md §5): symbols, grouping,
# numbering systems, :percent (and :currency, :unit) — mf2-fn-number.
fn-number = ["dep:mf2-fn-number"]
# Dates and times (plans/03-runtime.md §5.1): :datetime, :date, :time and
# unannotated date/time values — mf2-fn-datetime.
fn-datetime = ["dep:mf2-fn-datetime"]
# The date backends (plans/03-runtime.md §5.1–§5.2), each implying
# `fn-datetime`: `datetime-icu` — ICU4X on client and server, data from the
# catalog's `icu.blob` (which `compile_str` then emits); `datetime-intl` — the
# browser's `Intl.DateTimeFormat` on wasm32-unknown-unknown, ICU4X with
# compiled data elsewhere.
# With `host-web`, each also gives the browser host its date methods: named
# zones from the browser's data (both), `Intl.DateTimeFormat` (`datetime-intl`).
datetime-icu = [
    "fn-datetime",
    "mf2-fn-datetime/datetime-icu",
    "mf2-host-web?/time-zones",
    "mf2-locale-data?/icu-blob",
]
datetime-intl = ["fn-datetime", "mf2-fn-datetime/datetime-intl", "mf2-host-web?/datetime-intl"]
# A Host: native (servers, tests, wasm32-wasip1) or the browser.
host-std = ["dep:mf2-host-std"]
host-web = ["dep:mf2-host-web"]
# The `intl` client option (plans/00-master-plan.md §5, owner decision 4;
# plans/03-runtime.md §5.3): on wasm32-unknown-unknown the numeric functions
# format and select through the browser's Intl.NumberFormat and
# Intl.PluralRules (mf2-host-web's NUMBERS_HOST), requiring
# Intl.NumberFormat v3; every other build (servers, wasm32-wasip1, tests)
# keeps the Rust path.
intl = ["mf2-runtime/intl", "mf2-fn-number?/intl", "mf2-host-web?/intl"]
# The Leptos layer (`plans/04-leptos-integration.md` §§3–7): the tachys view
# impls for the description types, the catalog context, the node registry and
# the locale switch. Off, the call-site core compiles with no Leptos crate,
# no tachys and no reactive_graph in the tree.
leptos = ["leptos-mf2/leptos"]
# The three Leptos targets; an application turns exactly one on and forwards
# it to every leptos-aware dependency, as cargo-leptos does.
ssr = ["leptos", "leptos-mf2/ssr"]
hydrate = ["leptos", "leptos-mf2/hydrate"]
csr = ["leptos", "leptos-mf2/csr"]
# A locale switch is a cookie and a navigation (D7 strategy C).
static-locale = ["leptos-mf2/static-locale"]
# WCAG 3.1.2: text borrowed from a fallback locale renders inside
# `<span lang [dir]>` in a view position — see `leptos-mf2`'s manifest.
mark-fallback-lang = ["leptos-mf2/mark-fallback-lang"]

[dependencies]
leptos-mf2.workspace = true
mf2-catalog.workspace = true
mf2-fn-number = { workspace = true, optional = true }
mf2-fn-datetime = { workspace = true, optional = true }
mf2-host-std = { workspace = true, optional = true }
mf2-host-web = { workspace = true, optional = true }
mf2-locale-data = { workspace = true, optional = true }
mf2-macros.workspace = true
mf2-model.workspace = true
mf2-runtime.workspace = true
mf2-syntax = { workspace = true, optional = true }
thiserror.workspace = true

# The call-site core formats against a catalog the caller supplies: the test
# builds one with `compile_str` and formats it through the native host.
[[test]]
name = "call_site"
required-features = ["compile", "host-std", "fn-datetime"]

[package.metadata.docs.rs]
features = ["compile", "host-std"]

[lints]
workspace = true
