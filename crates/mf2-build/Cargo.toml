[package]
name = "mf2-build"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The MessageFormat 2 build pipeline: loaders, mf2.toml, the manifest, lints, per-locale catalogs and the generated Rust module."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/mf2-build"
keywords = ["messageformat", "mf2", "i18n", "build", "codegen"]
categories = ["internationalization", "localization", "development-tools::build-utils"]
# Left out of the package, run in the workspace (plans/17-phase-9-work-order.md
# A4): these tests build their corpora with `workload-gen`, which is not
# published (a path-only dev-dependency, stripped from the package).
exclude = [
    "tests/common/",
    "tests/build.rs",
    "tests/drift.rs",
    "tests/loaders.rs",
    # Reads the user guide's pages, which are not in the package.
    "tests/reference.rs",
    "tests/sizes.rs",
    "tests/slicing.rs",
    # Its own file list (`cargo xtask package`).
    "package.txt",
]

[features]
# The per-locale `icu.blob` of the `icu` date formatters; pulls ICU4X's baked
# data crates into the build (plans/12 "What Phase 4 changes here").
icu-blob = ["mf2-locale-data/icu-blob"]
# The `icu.blob` entry keys live in the catalog format module.

[dependencies]
brotli.workspace = true
flate2.workspace = true
mf2-catalog = { workspace = true, features = ["content-hash", "decode", "manifest", "writer"] }
mf2-locale-data.workspace = true
# `suite-names`: a diagnostic carries the WG suite's name for the MF2 error
# kind it reports, so the build's verdict is machine-checkable (L5).
mf2-model = { workspace = true, features = ["suite-names"] }
mf2-resource.workspace = true
mf2-syntax.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
unicode-ident.workspace = true
unicode-normalization = { workspace = true, features = ["std"] }
unicode-security.workspace = true
thiserror = { workspace = true, features = ["std"] }
toml.workspace = true

[dev-dependencies]
# `server-data`: the slicing tests read a catalog through its server-only
# table, as a server does.
mf2-catalog = { workspace = true, features = ["server-data"] }
mf2-resource.workspace = true
mf2-syntax.workspace = true
workload-gen.workspace = true

# docs.rs, as `cargo xtask docs-rs` builds it; also the feature set and
# target `cargo xtask api` lists the public API with (api.txt).
[package.metadata.docs.rs]
features = ["icu-blob"]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
