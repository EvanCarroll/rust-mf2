[package]
name = "leptos-mf2"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "1.x's Leptos layer of Rust MF2, kept as a shim: it re-exports `mf2::leptos` and the call-site types from `mf2`, where they now live, and forwards its features to mf2's."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/leptos-mf2"
keywords = ["leptos", "messageformat", "mf2", "i18n", "wasm"]
categories = ["internationalization", "localization", "web-programming", "wasm", "gui"]
# Its own file list (`cargo xtask package`).
exclude = ["package.txt"]

# Every feature forwards to `mf2`'s, where the Leptos layer now is.
[features]
# Leptos 0.9, the default line: `mf2`'s `leptos`.
default = ["leptos-0-9"]
# 1.x's name for "the Leptos layer", which a mode turns on; the layer is
# `mf2`'s now, and a mode is what compiles it.
leptos = []
leptos-0-9 = ["mf2/leptos"]
# Leptos 0.8, an opt-in: with `default-features = false`, in place of
# `leptos-0-9`.
leptos-0-8 = ["mf2/leptos-0-8"]
# The three Leptos modes: exactly one.
ssr = ["leptos", "mf2/ssr"]
hydrate = ["leptos", "mf2/hydrate"]
csr = ["leptos", "mf2/csr"]
static-locale = ["mf2/static-locale"]
mark-fallback-lang = ["mf2/mark-fallback-lang"]
# Dates in the reader's time zone, which `mf2`'s `fn-datetime` compiles
# along with the date functions.
fn-datetime = ["mf2/fn-datetime"]

[dependencies]
mf2.workspace = true

# The layer's 1.x paths when only `mf2` is in a mode (`cargo xtask ci`).
[[test]]
name = "layer"
required-features = ["mf2/ssr"]

# docs.rs, as `cargo xtask docs-rs` builds it; also the feature set and
# target `cargo xtask api` lists the public API with (api.txt).
[package.metadata.docs.rs]
# The modes (`ssr`, `hydrate`, `csr`) exclude each other: the docs show
# the server on the default line.
features = ["ssr", "fn-datetime", "static-locale", "mark-fallback-lang"]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
