[package]
name = "mf2-catalog"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The .mf2b binary catalog: a no_std client reader and (features) the writer, the model-rebuilding decoder and the manifest file."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/mf2-catalog"
keywords = ["messageformat", "mf2", "i18n", "catalog", "binary"]
categories = ["internationalization", "localization", "encoding", "no-std", "wasm"]
# Left out of the package, run in the workspace (plans/17-phase-9-work-order.md
# A4): these tests read the committed corpora in `bench/corpora/`.
exclude = [
    "tests/manifest.rs",
    "tests/roundtrip.rs",
    "tests/skew.rs",
    # Its own file list (`cargo xtask package`).
    "package.txt",
]

[features]
# The manifest file (`manifest.mf2m`) and `manifest_hash` (build side).
manifest = []
# The encoder: `writer::catalog` and `writer::single` (build side).
writer = ["manifest", "dep:unicode-normalization"]
# The model-rebuilding decoder (build side; conformance layer L3).
decode = []
# `Catalog::from_static`: a catalog over embedded bytes, not copied (native
# applications, through mf2-native). Off for the client, which fetches its
# catalog: the extra buffer kind would cost it a branch on every read.
static-bytes = []

[dependencies]
mf2-model.workspace = true
thiserror.workspace = true
unicode-normalization = { workspace = true, optional = true }

[dev-dependencies]
mf2-model = { workspace = true, features = ["serde"] }
mf2-syntax.workspace = true
serde_json.workspace = true

[[test]]
name = "vectors"
required-features = ["writer", "decode"]

[[test]]
name = "reader"
required-features = ["writer", "decode"]

[[test]]
name = "roundtrip"
required-features = ["writer", "decode"]

[[test]]
name = "manifest"
required-features = ["writer"]

[[test]]
name = "linear"
required-features = ["writer", "decode"]

[[test]]
name = "skew"
required-features = ["writer", "decode"]

[[test]]
name = "number"
required-features = ["writer"]

[[test]]
name = "measure"
required-features = ["writer"]

# docs.rs, as `cargo xtask docs-rs` builds it; also the feature set and
# target `cargo xtask api` lists the public API with (api.txt).
[package.metadata.docs.rs]
features = ["manifest", "writer", "decode", "static-bytes"]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
