[package]
name = "mf2-model"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The Unicode MessageFormat 2 interchange data model, MsgId, the shared error kinds and the Frontend trait (no_std)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/mf2-model"
keywords = ["messageformat", "mf2", "i18n", "data-model"]
categories = ["internationalization", "localization", "data-structures", "no-std"]
# The package\'s file list (`cargo xtask package`) is not part of it.
exclude = ["package.txt"]

[features]
# (De)serialization as JSON that validates against spec/data-model/message.json.
serde = ["dep:serde"]
# ErrorKind <-> the WG test suite's error names ("bad-option", …), for tests and tools.
suite-names = []

[dependencies]
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

# docs.rs, as `cargo xtask docs-rs` builds it; also the feature set and
# target `cargo xtask api` lists the public API with (api.txt).
[package.metadata.docs.rs]
features = ["serde"]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
