[package]
name = "mf2-locale-data"
description = "CLDR locale data for mf2-two catalogs (build side): the UTS #35 plural-rule parser, the plural.* LOCALE entry encoder and all-locale rule tables."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `extract`: regenerate `data/` from the vendored CLDR JSON (`cargo xtask
# locale-data`; the drift test).
extract = ["dep:serde_json"]

[dependencies]
mf2-catalog.workspace = true
mf2-model.workspace = true
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
# The client evaluator the CLDR samples test (plans/10 A6).
mf2-runtime.workspace = true
serde_json.workspace = true

[[test]]
name = "table"
required-features = ["extract"]

[lints]
workspace = true
