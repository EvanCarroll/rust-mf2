[package]
name = "mf2-ratatui"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "1.x's Ratatui support of Rust MF2, kept as a shim: it re-exports `mf2::ratatui`, where the code now lives, under 1.x's names, and turns on mf2's `ratatui` feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/mf2-ratatui"
keywords = ["messageformat", "mf2", "i18n", "ratatui", "tui"]
categories = ["internationalization", "localization", "command-line-utilities"]
exclude = ["package.txt"]

[dependencies]
mf2 = { workspace = true, features = ["ratatui"] }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
