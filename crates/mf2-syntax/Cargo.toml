[package]
name = "mf2-syntax"
description = "MessageFormat 2 syntax: a lossless-CST parser with recovery, lowering to the data model, validation, serializer and analysis (no_std)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/mf2-syntax"
keywords = ["messageformat", "mf2", "i18n", "parser"]
categories = ["internationalization", "localization", "parser-implementations", "no-std"]
# The package\'s file list (`cargo xtask package`) is not part of it.
exclude = ["package.txt"]

[dependencies]
mf2-model.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
mf2-model = { workspace = true, features = ["suite-names"] }

# docs.rs, as `cargo xtask docs-rs` builds it; also the feature set and
# target `cargo xtask api` lists the public API with (api.txt).
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
