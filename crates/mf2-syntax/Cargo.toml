[package]
name = "mf2-syntax"
description = "MessageFormat 2 syntax: a lossless-CST parser with recovery, lowering to the data model, validation, serializer and analysis (no_std)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/mf2-syntax"
keywords = ["messageformat", "mf2", "i18n", "parser"]
categories = ["internationalization", "localization", "parser-implementations", "no-std"]

[dependencies]
mf2-model.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
mf2-model = { workspace = true, features = ["suite-names"] }

[lints]
workspace = true
