[package]
name = "mf2-host-web"
description = "The browser Host of mf2-runtime: NFC through String.prototype.normalize and float text through String(x), via js-sys; with `datetime-intl`, dates through Intl.DateTimeFormat and time-zone offsets from the browser's zone data; with `intl`, numbers through Intl.NumberFormat and Intl.PluralRules."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Each adds a host (a static): a host method is linked whenever its host is
# (it is in the `Host` vtable), so the date methods are on their own hosts,
# and a client that names only `HOST` links none of their glue (B1′).
#
# `time-zones`: `ZONES_HOST` — `Host::zone_offset` from the browser's zone
# data (named zones for `datetime-icu`, whose ICU4X has no transition rules).
time-zones = ["dep:wasm-bindgen"]
# `datetime-intl`: `INTL_HOST` — that, and `Host::format_date_time` with
# `Intl.DateTimeFormat` (one formatter cached per locale and option set).
datetime-intl = ["time-zones"]
# `intl` (plans/03-runtime.md §2.7, §5.3): `NUMBERS_HOST` / `IntlNumbers` —
# another host plus `Host::numbers`: `Intl.NumberFormat` and
# `Intl.PluralRules` (cached per locale and option set) when the engine has
# `Intl.NumberFormat` v3 (detected once).
intl = ["dep:wasm-bindgen", "mf2-runtime/intl"]

[dependencies]
js-sys = { workspace = true }
mf2-runtime.workspace = true
wasm-bindgen = { workspace = true, optional = true }

[lints]
workspace = true
