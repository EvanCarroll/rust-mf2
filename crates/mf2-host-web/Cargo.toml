[package]
name = "mf2-host-web"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The browser Host of mf2-runtime: float text through String(x), via js-sys; with `datetime-intl`, dates through Intl.DateTimeFormat and time-zone offsets from the browser's zone data; with `intl`, numbers through Intl.NumberFormat and Intl.PluralRules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/mf2-host-web"
keywords = ["messageformat", "mf2", "i18n", "wasm", "intl"]
categories = ["internationalization", "localization", "wasm", "web-programming"]
# The package\'s file list (`cargo xtask package`) is not part of it.
exclude = ["package.txt"]

[features]
# Each adds a host (a static): a host method is linked whenever its host is
# (it is in the `Host` vtable), so the date methods are on their own hosts,
# and a client that names only `HOST` links none of their glue (B1′).
#
# `time-zones`: `ZONES_HOST` — `Host::zone_offset` from the browser's zone
# data (named zones for the `icu` date formatter, whose ICU4X has no transition rules).
time-zones = ["dep:wasm-bindgen"]
# `datetime-intl`: `INTL_HOST` — that, and `Host::format_date_time` with
# `Intl.DateTimeFormat` (one formatter cached per locale and option set).
datetime-intl = ["time-zones"]
# `intl` (plans/03-runtime.md §2.7, §5.3): `NUMBERS_HOST` / `IntlNumbers` —
# another host plus `Host::numbers`: `Intl.NumberFormat` and
# `Intl.PluralRules` (cached per locale and option set) when the engine has
# `Intl.NumberFormat` v3 (detected once). One such host over each of the
# others (`ZONES_NUMBERS_HOST`, `INTL_DATES_NUMBERS_HOST`), so that a build that
# formats dates and numbers reaches both.
intl = ["dep:wasm-bindgen", "mf2-runtime/intl"]

[dependencies]
js-sys = { workspace = true }
mf2-runtime.workspace = true
wasm-bindgen = { workspace = true, optional = true }

# docs.rs, as `cargo xtask docs-rs` builds it; also the feature set and
# target `cargo xtask api` lists the public API with (api.txt).
[package.metadata.docs.rs]
features = ["intl", "datetime-intl"]
# Its only target.
default-target = "wasm32-unknown-unknown"
targets = ["wasm32-unknown-unknown"]

[lints]
workspace = true
