[package]
name = "mf2-resource"
description = "The W3C Message Resource container for MessageFormat 2: parser, serializer and data model, generic over the message type (no_std)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/mf2-resource"
keywords = ["messageformat", "mf2", "i18n", "resource", "parser"]
categories = ["internationalization", "localization", "parser-implementations", "no-std"]
# The package\'s file list (`cargo xtask package`) is not part of it.
exclude = ["package.txt"]

[features]
# (De)serialization as JSON in the draft's data-model shape (src/json.rs).
serde = ["dep:serde"]

[dependencies]
mf2-model.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

# docs.rs, as `cargo xtask docs-rs` builds it; also the feature set and
# target `cargo xtask api` lists the public API with (api.txt).
[package.metadata.docs.rs]
features = ["serde"]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
