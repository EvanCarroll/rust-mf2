[package]
name = "mf2-fn-datetime"
description = "The MessageFormat 2 date/time functions of mf2-two — :datetime, :date, :time and unannotated date/time values: operand and option semantics, time zones, and a backend seam (no_std, fmt-free, panic-free)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The backends (plans/03-runtime.md §5.2; plans/11 A6) come as features here:
# `datetime-icu` (ICU4X) and `datetime-intl` (Host::format_date_time). With
# none on, the handlers format through the neutral stub backend.

[dependencies]
mf2-runtime.workspace = true

[dev-dependencies]
mf2 = { workspace = true, features = ["compile", "host-std"] }

[lints]
workspace = true
