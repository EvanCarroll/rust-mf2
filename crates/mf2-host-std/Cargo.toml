[package]
name = "mf2-host-std"
description = "The native Host of mf2-runtime (servers, tests, wasm32-wasip1): NFC through unicode-normalization, float text through ryu, time-zone offsets through jiff's bundled IANA database."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/mf2-host-std"
keywords = ["messageformat", "mf2", "i18n", "timezone"]
categories = ["internationalization", "localization"]
# The package\'s file list (`cargo xtask package`) is not part of it.
exclude = ["package.txt"]

[dependencies]
# Named zones (owner decision 1, plans/03 §5.2): the bundled IANA database,
# never the system's, so every build answers alike; `std` for its cache of
# parsed zones.
jiff = { workspace = true, features = ["std", "tzdb-bundle-always"] }
mf2-runtime.workspace = true
ryu.workspace = true
unicode-normalization.workspace = true

# docs.rs, as `cargo xtask docs-rs` builds it; also the feature set and
# target `cargo xtask api` lists the public API with (api.txt).
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
