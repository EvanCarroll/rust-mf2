[package]
name = "mf2-host-std"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The native Host of mf2-runtime (servers, tests, wasm32-wasip1): NFC through unicode-normalization, float text through `core`, and, with `time-zones`, time-zone offsets and the machine's own zone through jiff (the system's IANA database, or the bundled one with `tzdb-bundled`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/mf2-host-std"
keywords = ["messageformat", "mf2", "i18n", "timezone"]
categories = ["internationalization", "localization"]
# The package\'s file list (`cargo xtask package`) is not part of it.
exclude = ["package.txt"]

[features]
# `ZONES_HOST`: `Host::zone_offset` for a named zone, through jiff; also
# `system_time_zone()`, the zone the machine is set to (`tz-system`), and
# jiff itself, re-exported. Off, the crate has no jiff and a named zone is
# *Bad Option*, as in the browser.
# `std` for jiff's cache of parsed zones; the system's IANA database
# (`TZDIR`, else `/usr/share/zoneinfo`), and jiff's own copy of it only
# where the platform has none, so a native application follows the machine
# it runs on (owner decision 3, `plan/01` §4.1).
time-zones = ["dep:jiff", "jiff/std", "jiff/tz-system", "jiff/tzdb-zoneinfo", "jiff/tzdb-bundle-platform"]
# Lookups ask jiff's bundled IANA database instead, so that every build
# answers alike whatever the machine holds: what a server (`ssr`, `axum`) and
# the conformance suite want. Weak, so it adds nothing without `time-zones`.
tzdb-bundled = ["jiff?/tzdb-bundle-always"]

[dependencies]
jiff = { workspace = true, optional = true }
mf2-runtime.workspace = true
unicode-normalization.workspace = true

# `ryu` formatted the floats through 2.x; it is now only the oracle
# `tests/floats.rs` compares `core`'s own text against (`plan/01` §4.2).
[dev-dependencies]
ryu.workspace = true

# docs.rs, as `cargo xtask docs-rs` builds it; also the feature set and
# target `cargo xtask api` lists the public API with (api.txt).
[package.metadata.docs.rs]
features = ["time-zones", "tzdb-bundled"]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
