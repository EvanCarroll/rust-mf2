[package]
name = "mf2-host-std"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The native Host of mf2-runtime (servers, tests, wasm32-wasip1): NFC through unicode-normalization, float text through ryu, and, with `time-zones`, time-zone offsets through jiff's bundled IANA database."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/mf2-host-std"
keywords = ["messageformat", "mf2", "i18n", "timezone"]
categories = ["internationalization", "localization"]
# The package\'s file list (`cargo xtask package`) is not part of it.
exclude = ["package.txt"]

[features]
# `ZONES_HOST`: `Host::zone_offset` for a named zone, through jiff. Off, the
# crate has no jiff and a named zone is *Bad Option*, as in the browser.
# The bundled IANA database, never the system's, so every build answers
# alike (owner decision 1); `std` for jiff's cache of parsed zones.
time-zones = ["dep:jiff", "jiff/std", "jiff/tzdb-bundle-always"]

[dependencies]
jiff = { workspace = true, optional = true }
mf2-runtime.workspace = true
ryu.workspace = true
unicode-normalization.workspace = true

# docs.rs, as `cargo xtask docs-rs` builds it; also the feature set and
# target `cargo xtask api` lists the public API with (api.txt).
[package.metadata.docs.rs]
features = ["time-zones"]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
