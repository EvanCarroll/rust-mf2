[package]
name = "mf2-axum"
description = "Locale negotiation and catalog serving for an Axum + Leptos application: an ordered list of typed sources and sinks, Content-Language and Vary, and /i18n/* served immutable from the catalogs embedded in the server binary."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The Leptos line, as leptos-mf2's (`plans/04-leptos-integration.md` §10):
# 0.9 by default; for 0.8, `default-features = false` and `leptos-0-8`.
default = ["leptos-0-9"]
leptos-0-9 = ["dep:leptos", "dep:leptos_axum", "leptos-mf2/leptos-0-9"]
leptos-0-8 = ["dep:leptos_0_8", "dep:leptos_axum_0_8", "leptos-mf2/leptos-0-8"]

[dependencies]
axum.workspace = true
brotli.workspace = true
flate2.workspace = true
http.workspace = true
leptos = { workspace = true, optional = true }
leptos-mf2 = { workspace = true, features = ["ssr"] }
leptos_axum = { workspace = true, optional = true }
leptos_0_8 = { workspace = true, optional = true }
leptos_axum_0_8 = { workspace = true, optional = true }
mf2-catalog.workspace = true

[lints]
workspace = true
