[package]
name = "mf2-axum"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "1.x's Axum crate of Rust MF2, kept as a shim over mf2::axum (locale negotiation and catalog serving), with the Leptos server's request glue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/mf2-axum"
keywords = ["messageformat", "mf2", "i18n", "axum", "leptos"]
categories = ["internationalization", "localization", "web-programming::http-server"]
# The package\'s file list (`cargo xtask package`) is not part of it.
exclude = ["package.txt"]

[features]
# The Leptos line, as leptos-mf2's (`plans/04-leptos-integration.md` §10):
# 0.9 by default; for 0.8, `default-features = false` and `leptos-0-8`.
default = ["leptos-0-9"]
leptos-0-9 = ["dep:leptos", "dep:leptos_axum", "leptos-mf2/leptos-0-9"]
leptos-0-8 = ["dep:leptos_0_8", "dep:leptos_axum_0_8", "leptos-mf2/leptos-0-8"]

[dependencies]
http.workspace = true
leptos = { workspace = true, optional = true }
leptos-mf2 = { workspace = true, features = ["ssr"] }
leptos_axum = { workspace = true, optional = true }
leptos_0_8 = { workspace = true, optional = true }
leptos_axum_0_8 = { workspace = true, optional = true }
mf2 = { workspace = true, features = ["axum"] }

# `tests/time_zone.rs` compiles a date message and formats it through the
# native host, as a server does.
[dev-dependencies]
mf2 = { workspace = true, features = ["compile", "host-std", "fn-datetime"] }

# docs.rs, as `cargo xtask docs-rs` builds it; also the feature set and
# target `cargo xtask api` lists the public API with (api.txt).
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
