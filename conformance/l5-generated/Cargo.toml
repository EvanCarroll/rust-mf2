# Conformance layer L5 on **generated** input: `l4gen`'s messages as a corpus
# `mf2-build` compiles and `tr!` calls, compared against what L4's runner makes
# of the same message.
#
# How many, and from which seed, are the build script's environment —
# `MF2_L5_GENERATED` (default 200, so an ordinary `cargo test` pays little)
# and `MF2_L5_SEED`. The nightly run turns it up.
[package]
name = "mf2-l5-generated"
description = "Conformance layer L5 on generated messages: a corpus of them through tr!, against L4's runner."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["ssr", "fn-number", "host-std-datetime-icu", "host-web-datetime-icu"]
ssr = ["mf2/host-std"]
hydrate = ["mf2/host-web"]
fn-number = ["mf2/fn-number"]
# Dates over ICU4X, natively and in the browser (plan/08 §3.1).
host-std-datetime-icu = ["mf2/host-std-datetime-icu"]
host-web-datetime-icu = ["mf2/host-web-datetime-icu"]
# Declared for `shared.rs`'s `date_time` cfg (any date formatter); unused here.
host-std-datetime-iso = ["mf2/host-std-datetime-iso"]
host-web-datetime-intl = ["mf2/host-web-datetime-intl"]

[dependencies]
# `compile` so that the test can compile the same message the way L4 does.
mf2 = { workspace = true, features = ["compile"] }
mf2-l4-runner.workspace = true

[build-dependencies]
mf2-conformance.workspace = true
mf2-l4-runner.workspace = true
mf2-l5-gen.workspace = true
# The generated arguments' own types: the bidi strategy a seed chose, and a
# date/time's ISO text.
mf2-runtime.workspace = true

[lints]
workspace = true
