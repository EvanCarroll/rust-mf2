# The spec coverage matrix (plans/01-conformance.md §5; the rules are in
# conformance/src/coverage.rs). One [[statement]] per normative statement.

[[statement]]
id = "data-model/README.md#e8dece27"
says = "An input declaration's name is the name of the variable its expression reads."
tests = [
    "crates/mf2-model/tests/json.rs::malformed_input_is_rejected",
    "crates/mf2-model/tests/json.rs::every_node_kind_round_trips",
]

[[statement]]
id = "data-model/README.md#5372aa26"
says = "A pattern holds only non-empty strings, expressions and markup."
tests = [
    "crates/mf2-model/src/pattern.rs::empty_text_is_dropped",
    "crates/mf2-model/tests/json.rs::relaxations_and_unknown_fields_are_accepted",
    "crates/mf2-model/tests/json.rs::malformed_input_is_rejected",
]

[[statement]]
id = "data-model/README.md#f738771f"
says = "Code must not assume the expression and markup kinds are a closed set."
na = { kind = "by-construction", reason = "`Expression` and `PatternPart` are `#[non_exhaustive]` (crates/mf2-model/src/expression.rs, pattern.rs), so every match outside mf2-model needs a wildcard arm; the compiler enforces it." }

[[statement]]
id = "data-model/README.md#d2624963"
says = "An implementation may add interfaces or fields to the data model."
na = { kind = "permission", reason = "Not taken: the model's JSON is exactly the schema's shape." }

[[statement]]
id = "data-model/README.md#d0b39e70"
says = "Unknown fields in the data model are ignored."
tests = [
    "crates/mf2-model/tests/json.rs::relaxations_and_unknown_fields_are_accepted",
]

[[statement]]
id = "data-model/README.md#4997c907"
says = "A valid message's data model uses no values outside the defined sets."
note = "L2 validates every valid suite message's JSON against the vendored message.json, whose `type`/`kind` fields are `const`/`enum`."
tests = [
    "crates/mf2-model/tests/json.rs::every_node_kind_serializes_to_the_schema_shape",
    "conformance/tests/layers.rs::every_harnessed_layer_passes_but_the_ledgers_xfails",
]

[[statement]]
id = "data-model/README.md#08917eef"
says = "An invalid message's data model may use extended values."
na = { kind = "permission", reason = "Not taken: a message with a syntax error has no model, and a data-model-invalid one uses only the defined values." }

[[statement]]
id = "errors.md#2cef59b5"
says = "Syntax and Data Model Errors are reported as early as possible"
