# Conformance layer L7 in the browser (plans/01-conformance.md §3;
# plans/15-phase-7-work-order.md A4): L6's page and twin switch, delivered two
# other ways — as islands, and client-only — in both configurations, for
# every runtime-valid test of every locale the suite uses.
#
# A standalone workspace, like `conformance/l6-web`: a build turns on exactly
# one of `ssr`, `hydrate` and `csr`, and cargo unifies features across a
# workspace.
[workspace]
resolver = "3"
members = [".", "set-build", "sets/en-us", "sets/und", "sets/fr", "sets/ar"]

[package]
name = "mf2-l7-web"
description = "Conformance layer L7 in the browser: the suite's messages on an islands page and a client-only page, switched to a twin locale and back."
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Renders one set's pages and writes everything the browser needs into the
# directory it is given.
[[bin]]
name = "l7-page"
path = "src/main.rs"
required-features = ["ssr"]

[features]
default = []
# Every function feature: the full-MF2 configuration (L7, L7c). Without it
# the sets are the default configuration (L7d, L7cd).
all-functions = [
    "mf2-l7-set-en-us/fn-number",
    "mf2-l7-set-en-us/datetime-icu",
    "mf2-l7-set-und/fn-number",
    "mf2-l7-set-und/datetime-icu",
    "mf2-l7-set-fr/fn-number",
    "mf2-l7-set-fr/datetime-icu",
    "mf2-l7-set-ar/fn-number",
    "mf2-l7-set-ar/datetime-icu",
]
# `leptos/islands` in both halves of the islands page: the server writes
# the island wrappers the client's walk looks for.
ssr = [
    "leptos/ssr",
    "leptos/islands",
    "mf2/ssr",
    "tachys/ssr",
    "mf2-l7-set-en-us/ssr",
    "mf2-l7-set-und/ssr",
    "mf2-l7-set-fr/ssr",
    "mf2-l7-set-ar/ssr",
]
hydrate = [
    "leptos/hydrate",
    "leptos/islands",
    "mf2/hydrate",
    "tachys/hydrate",
    "client",
]
csr = ["leptos/csr", "mf2/csr", "client"]
# What both browser builds share.
client = [
    "mf2-l7-set-en-us/client",
    "mf2-l7-set-und/client",
    "mf2-l7-set-fr/client",
    "mf2-l7-set-ar/client",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen-futures",
]

[dependencies]
# `mf2::leptos` on the Leptos 0.9 line; `ssr`, `hydrate` and `csr` above
# pick the mode.
mf2 = { path = "../../crates/mf2", features = ["leptos"] }
# An island's props are serialized into the page; the derive names `serde`.
serde = { version = "1.0.229", features = ["derive"] }
mf2-l7-set-en-us = { path = "sets/en-us" }
mf2-l7-set-und = { path = "sets/und" }
mf2-l7-set-fr = { path = "sets/fr" }
mf2-l7-set-ar = { path = "sets/ar" }
leptos = { version = "0.9.0-beta", default-features = false }
tachys = { version = "0.3.0-beta", default-features = false }
console_error_panic_hook = { version = "0.1.7", optional = true }
# The exported `async fn`s lower to promises through this crate.
wasm-bindgen-futures = { version = "0.4.78", optional = true }
# Exact: the wasm-bindgen CLI that post-processes the module must match.
wasm-bindgen = "=0.2.128"

[lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
