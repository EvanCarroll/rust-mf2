# Conformance L7's `und` set: see conformance/l7-web/set-build.
[package]
name = "mf2-l7-set-und"
description = "Conformance L7: the suite's und tests as an i18n crate with the twin en-GB, for a page in that locale."
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = []
# Both on: the whole corpus. Both off: the default configuration.
fn-number = ["mf2/fn-number"]
fn-datetime = ["mf2/fn-datetime"]
datetime-icu = ["fn-datetime", "mf2/datetime-icu"]
datetime-intl = ["fn-datetime", "mf2/datetime-intl"]
ssr = ["mf2/host-std", "mf2/ssr"]
client = ["mf2/host-web"]

[dependencies]
mf2 = { path = "../../../../crates/mf2", features = ["leptos"] }
mf2-l4-runner = { path = "../../../l4-runner" }
leptos = { version = "0.9.0-beta", default-features = false }

[build-dependencies]
mf2-l7-set-build = { path = "../../set-build" }

[lints.rust]
unsafe_code = "forbid"
