# Conformance L7's `fr` set: see conformance/l7-web/set-build.
[package]
name = "mf2-l7-set-fr"
description = "Conformance L7: the suite's fr tests as an i18n crate with the twin en-GB, for a page in that locale."
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = []
# Both on: the whole corpus. Both off: the default configuration.
fn-number = ["mf2/fn-number"]
# Dates over ICU4X, natively and in the browser (plan/08 §3.1).
host-std-datetime-icu = ["mf2/host-std-datetime-icu"]
host-web-datetime-icu = ["mf2/host-web-datetime-icu"]
# The smallest server and the browser's own formatter (plan/08 §4.3), for
# `cargo xtask l7-web`'s date-formatter pages.
host-std-datetime-iso = ["mf2/host-std-datetime-iso"]
host-web-datetime-intl = ["mf2/host-web-datetime-intl"]
ssr = ["mf2/host-std", "mf2/ssr"]
client = ["mf2/host-web"]

[dependencies]
mf2 = { path = "../../../../crates/mf2", features = ["leptos"] }
mf2-l4-runner = { path = "../../../l4-runner" }
leptos = { version = "0.9.0-beta", default-features = false }

[build-dependencies]
mf2-l7-set-build = { path = "../../set-build" }

[lints.rust]
unsafe_code = "forbid"
