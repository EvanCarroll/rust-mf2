# The conformance ledger: one [[test]] per test of the vendored WG suite, one status per
# column (plans/01-conformance.md §3-§4). Checked by `cargo xtask conformance-report`,
# which writes conformance/REPORT.md; first generated by `--init`.
#
# Key = (file, hash, nth); the hash encoding is documented in conformance/src/key.rs.
# `index` is the test's 0-based position in its file: a hint, not part of the key.
# Columns: L1..L6 (all features on), L4d/L5d/L6d (default features).
# Statuses: "pass" | "n/a" | { status = "xfail", until = "<phase>", reason? }
#           | { status = "degraded", kind, detail? } (L4d/L5d/L6d) | { status = "skip", reason }
# L5/L5d cells may add via = "dyn". Tags are never a skip reason.
# [[note]]: a fact recorded once (id, status, reason); an "open" note is an obligation
# not yet met and names the phase whose exit closes it (until).

current_phase = "P3"

[[note]]
id     = "unpaired-surrogates"
status = "n/a"
reason = "test/README.md asks implementations whose strings can hold unpaired surrogate code points to add syntax-error tests for them (e.g. src \"{\\ud800}\"). Neither the JSON suite nor a Rust &str can represent an unpaired surrogate, so such input cannot reach any layer: N/A by construction."

[[note]]
id     = "stripped-formats-identically"
status = "pass"
reason = "Production catalogs are stripped of COLD and IDS (plans/02-catalog-format.md §2.3), which must not change formatting. L3 checks that the stripped catalog decodes to the formatting-relevant model of the unstripped one (conformance/src/l3.rs); since Phase 3, L4 formats every L4-applicable test from both catalogs and requires identical string output, parts and errors (conformance/src/l4.rs), so a difference fails that test's L4 cell."

