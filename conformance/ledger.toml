[[intl]]
cases   = "golden/currency/ar-EG"
engines = ["chromium", "firefox", "webkit"]
kind    = "symbols"
count   = 9
detail  = "`currencyDisplay=never`: Intl.NumberFormat has no such display, so the host formats with `code` and drops the code and the blank next to it, which leaves the U+200F that ar-EG's currency pattern puts before the number (U+200F ٠٫٠٠); the Rust path writes CLDR's no-currency pattern (٠٫٠٠)."

[[intl]]
cases   = "golden/currency/cy"
engines = ["chromium"]
kind    = "symbols"
count   = 36
detail  = "Chromium 143 has no Welsh currency data and writes the English: symbols `$`, `¥` for CLDR 48.2.1's `US$`, `JP¥` (and in accounting), the name `euros` for `ewro`. Firefox 155 and WebKit 26.6 agree with the Rust path (A0 saw the same)."

[[intl]]
cases   = "golden/units/cy"
engines = ["chromium"]
kind    = "symbols"
count   = 36
detail  = "Chromium 143 has no Welsh unit names and writes the English ones: `1 meter` for `1 metr`, `0 meters` for `0 m`, `2 kilometers per hour` for `2 gilometr yr awr`, `1 hour` for `1 awr`. Firefox 155 and WebKit 26.6 agree with the Rust path (A0 saw the same)."

