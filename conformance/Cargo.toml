[package]
name = "mf2-conformance"
description = "The WG MessageFormat 2 test suite, run at every layer of the stack; owns the ledger."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Validates model JSON against spec/data-model/message.json (layer L2).
jsonschema.workspace = true
# Layer L3: write each message as a catalog, decode it back (plans/09 A6).
mf2-catalog = { workspace = true, features = ["writer", "decode"] }
# Layer L4: the one-message compile (plans/10 A9) and the client side it runs,
# natively and on wasm32-wasip1.
# `datetime-icu`: the catalogs carry `icu.blob` for the runner's ICU4X backend.
mf2 = { workspace = true, features = ["compile", "datetime-icu"] }
mf2-l4-runner.workspace = true
# Generated L4 cases (plans/10 A10): the catalog's direction and plural rules,
# number data, and `icu.blob` (A6).
mf2-locale-data = { workspace = true, features = ["icu-blob"] }
mf2-runtime.workspace = true
mf2-model = { workspace = true, features = ["serde", "suite-names"] }
mf2-syntax.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
sha2.workspace = true
thiserror = { workspace = true, features = ["std"] }
toml.workspace = true
# The formatting-relevant model (L3): names, keys and identifiers in NFC.
unicode-normalization = { workspace = true, features = ["std"] }

[dev-dependencies]
# Phase 5a A4's differential: the catalogs `mf2-build` writes for a one-message
# corpus against `compile_str`'s, through L4's runner. A dev-dependency, so
# nothing in the conformance library depends on the build pipeline.
mf2-build = { workspace = true, features = ["icu-blob"] }
# The differential oracle (plans/05-tooling.md §1): expected ⊆ reported.
ox_mf2_parser.workspace = true

[lints]
workspace = true
