# Conformance layer L6 in the browser (plans/14-phase-6-work-order.md A6b):
# every runtime-valid suite message rendered on the server, hydrated in a real
# engine, switched to a twin locale and back.
#
# A standalone workspace, like `conformance/l4-web`: an application turns on
# exactly one of `ssr` and `hydrate`, and cargo unifies features across a
# workspace.
[workspace]
resolver = "3"

[package]
name = "mf2-l6-web"
description = "Conformance layer L6 in the browser: the suite's en-US messages server-rendered, hydrated, and switched to a twin locale and back."
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Renders the page and writes everything the browser needs into
# target/l6-web/.
[[bin]]
name = "l6-page"
path = "src/main.rs"
required-features = ["ssr"]

[features]
default = []
# Declared so that the generated module's `cfg`s are known ones; `ssr` and
# `hydrate` turn on what this corpus needs.
fn-number = ["mf2/fn-number"]
fn-datetime = ["mf2/fn-datetime"]
datetime-icu = ["fn-datetime", "mf2/datetime-icu"]
datetime-intl = ["fn-datetime", "mf2/datetime-intl"]
# Every function feature is on in both: the corpus is the suite's, and a
# message may not add formatting code to the wasm by itself — so a build
# without them would be *refused*, not merely different.
ssr = [
    "mf2/host-std",
    "fn-number",
    "datetime-icu",
    "leptos/ssr",
    "leptos-mf2/ssr",
    "tachys/ssr",
]
hydrate = [
    "mf2/host-web",
    "fn-number",
    "datetime-icu",
    "leptos/hydrate",
    "leptos-mf2/hydrate",
    "tachys/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen-futures",
]

[dependencies]
mf2 = { path = "../../crates/mf2" }
# The suite's own `:test:*` functions, as L4 and L5 use them.
mf2-l4-runner = { path = "../l4-runner" }
leptos = { version = "0.9.0-beta", default-features = false }
leptos-mf2 = { path = "../../crates/leptos-mf2" }
tachys = { version = "0.3.0-beta", default-features = false }
console_error_panic_hook = { version = "0.1.7", optional = true }
# `mf2_set_locale` is an exported `async fn`, which wasm-bindgen lowers to a
# promise through this crate.
wasm-bindgen-futures = { version = "0.4.78", optional = true }
# Exact: the wasm-bindgen CLI that post-processes the module must match.
wasm-bindgen = "=0.2.128"

[build-dependencies]
mf2-l5-gen = { path = "../l5/gen" }

[lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
