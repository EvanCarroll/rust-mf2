# Conformance layer L5 for the suite's `en-US` tests: an i18n crate exactly as
# an application writes one, whose corpus and call sites are the suite itself.
# Its build script derives everything from the vendored suite, so nothing is
# checked in to drift.
[package]
name = "mf2-l5-en-us"
description = "Conformance layer L5: the WG suite's en-US tests as an i18n crate, through tr!."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The features an application forwards, declared the way an application
# declares them — the generated module's host and registry name them, so a
# crate that includes it has to have them all. Every function feature is on:
# the catalogs must carry what layer L4 formats with.
default = ["ssr", "fn-number", "host-std-datetime-icu", "host-web-datetime-icu"]
ssr = ["mf2/host-std"]
hydrate = ["mf2/host-web"]
fn-number = ["mf2/fn-number"]
# Dates over ICU4X, natively and in the browser (plan/08 §3.1).
host-std-datetime-icu = ["mf2/host-std-datetime-icu"]
host-web-datetime-icu = ["mf2/host-web-datetime-icu"]

[dependencies]
mf2.workspace = true
# The suite's own `:test:*` functions, through the public custom-function API
# and nowhere else — the same handlers L4 uses.
mf2-l4-runner.workspace = true

[build-dependencies]
mf2-l5-gen.workspace = true

[lints]
workspace = true
