[package]
name = "mf2-l4-runner"
description = "Conformance layer L4, the client side: the suite's :test:* functions (written against the public Function trait only), and one test case formatted into a canonical record — the same code natively and on wasm32-wasip1."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# ICU4X for the date functions (on for every layer's own runs). Conformance
# L7's date-formatter sets turn it off: they take only `:test:*` from here,
# and their server's formatter (ISO or ICU4X) must be the one `mf2` picks.
default = ["std-icu"]
std-icu = ["mf2-fn-datetime/std-icu"]

[dependencies]
mf2-catalog.workspace = true
# :datetime, :date, :time and unannotated dates (Phase 4, A5), formatting with
# ICU4X from the catalogs' `icu.blob` (the all-features configuration, A6)
# under `std-icu` below.
mf2-fn-datetime.workspace = true
# The localized numeric functions and :percent (Phase 4, A3).
mf2-fn-number.workspace = true
# The suite's dates name IANA zones, so the host that resolves them.
mf2-host-std = { workspace = true, features = ["time-zones", "tzdb-bundled"] }
mf2-model = { workspace = true, features = ["suite-names"] }
mf2-runtime.workspace = true
# The names the suite passes in are compared under NFC, which the runner
# normalizes with the full tables: the runtime's own check is what this
# layer is testing, so it must not also be the oracle.
unicode-normalization = { workspace = true, features = ["std"] }

[[bin]]
name = "mf2-wasi-matches-native"
path = "src/bin/mf2-wasi-matches-native.rs"

[lints]
workspace = true
