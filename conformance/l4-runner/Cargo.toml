[package]
name = "mf2-l4-runner"
description = "Conformance layer L4, the client side: the suite's :test:* functions (written against the public Function trait only), and one test case formatted into a canonical record — the same code natively and on wasm32-wasip1."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mf2-catalog.workspace = true
# :datetime, :date, :time and unannotated dates (Phase 4, A5), formatting with
# ICU4X from the catalogs' `icu.blob` (the all-features configuration, A6).
mf2-fn-datetime = { workspace = true, features = ["datetime-icu"] }
# The localized numeric functions and :percent (Phase 4, A3).
mf2-fn-number.workspace = true
# The suite's dates name IANA zones, so the host that resolves them.
mf2-host-std = { workspace = true, features = ["time-zones", "tzdb-bundled"] }
mf2-model = { workspace = true, features = ["suite-names"] }
mf2-runtime.workspace = true

[[bin]]
name = "mf2-l4-wasi"
path = "src/bin/mf2-l4-wasi.rs"

[lints]
workspace = true
