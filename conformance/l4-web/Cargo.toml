# Conformance layer L4 in the browser, for the `intl` client option:
# mf2-l4-runner built for wasm32-unknown-unknown with the
# `intl` features and mf2-host-web's ZONES_NUMBERS_HOST, run by
# tools/e2e/checks/l4-intl.mjs in Chromium, Firefox and WebKit, driven and
# judged by `cargo xtask l4-web`.
#
# A standalone workspace (the root workspace excludes `conformance/l4-web`):
# its `intl` features must never unify into the root workspace's builds, which
# keep the Rust path.
[workspace]
resolver = "3"

[package]
name = "mf2-l4-web"
description = "Conformance layer L4 in the browser: the suite's cases formatted by the intl build (Intl.NumberFormat, Intl.PluralRules), one record per case, for cargo xtask l4-web."
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mf2-l4-runner = { path = "../l4-runner" }
# The date functions as on the Rust path: ICU4X over the catalog's `icu.blob`
# in the browser (`web-icu`; the runner's `std-icu` is the native side's and
# changes nothing here), with named zones' offsets from the browser's zone
# data (mf2-host-web's `time-zones`, through `ZONES_NUMBERS_HOST`).
mf2-fn-datetime = { path = "../../crates/mf2-fn-datetime", features = ["web-icu"] }
# The intl build: the runtime's numeric functions and mf2-fn-number's through
# the host's Intl (mf2-runtime's `web-number-intl` feature switches both).
mf2-fn-number = { path = "../../crates/mf2-fn-number" }
mf2-host-web = { path = "../../crates/mf2-host-web", features = ["number-intl", "time-zones"] }
mf2-runtime = { path = "../../crates/mf2-runtime", features = ["web-number-intl"] }
# Exact: the wasm-bindgen CLI that post-processes the module must be the same
# version (0.2.128, as bench/intl-probe).
wasm-bindgen = "=0.2.128"

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"

[profile.release]
# The suite runs once per engine: build time matters more than speed.
opt-level = 1
