[package]
name = "p08-bench"
description = "P0.8 native: criterion benches (load, simple, 1-arg pattern, select) and an allocation counter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
utf8-per-access = ["p03-rt/utf8-per-access"]

[dependencies]
p03-rt.workspace = true
p07-enc.workspace = true

[dev-dependencies]
criterion.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "p08-allocs"
path = "src/allocs.rs"

[[bench]]
name = "load_lookup"
harness = false
