# P0.8 load + lookup probe — standalone workspace (the root workspace excludes
# `probes`). Throwaway code; see RESULT.md.
[workspace]
resolver = "3"
members = ["bench", "web"]
default-members = ["bench"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# Every dependency declared once, at its latest version (crates.io, 2026-09-20).
[workspace.dependencies]
# P0.3's runtime and P0.7's writer, read-only, by path.
p03-rt = { path = "../p0-03-runtime-floor/rt" }
p07-enc = { path = "../p0-07-catalog-encoding/enc" }
criterion = "0.8.2"
wasm-bindgen = "0.2.128"

[profile.release]
lto = "fat"
codegen-units = 1
debug = false

[profile.bench]
inherits = "release"

# Browser timing build: the 06 §3 size profile (what ships), then wasm-opt -Oz.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
