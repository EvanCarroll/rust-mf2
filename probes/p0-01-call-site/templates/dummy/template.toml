# Template `dummy` (P0.1): the B5 baseline. Every call site is the SAME short
# string literal and arguments are dropped, so only the view structure
# remains. The built-in `literal` template holds each message's own source
# text, whose bytes would be subtracted from the delta and flatter the
# implementation under test; `literal` is reported as a second baseline.

name = "dummy"
description = "Every call site is the same literal \"t\" (B5 baseline: view structure only, no text bytes)."

[deferred]
type = "&'static str"
view = "{{label}}"
string = "{{label}}.to_owned()"

[site.string]
none = 'String::from("t")'

[site.child]
none = '"t"'

[site.attr]
none = '"t"'

[site.reactive_prop]
none = '"t"'

[site.string_prop]
none = '"t"'

[site.deferred]
none = '"t"'

[site.if_else]
none = '"t"'
