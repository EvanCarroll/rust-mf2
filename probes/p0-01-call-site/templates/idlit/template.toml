# Template `idlit` (P0.1): a second B5 baseline. Every call site is a string
# literal holding its MsgId in decimal ("0" … "1599"), arguments dropped.
# Like `dummy` it carries (almost) no text bytes (≈ 3.5 B per distinct
# message); unlike `dummy`, sites stay distinct, as in any real app, so the
# optimiser cannot merge per-site code that differs only by its message
# (LLVM/wasm-opt duplicate-function elimination; see RESULT.md "Baselines").

name = "idlit"
description = "Every call site is its MsgId as a short literal (B5 baseline: view structure + per-site distinctness, ~no text)."

[deferred]
type = "&'static str"
view = "{{label}}"
string = "{{label}}.to_owned()"

[site.string]
none = 'String::from("{{index}}")'

[site.child]
none = '"{{index}}"'

[site.attr]
none = '"{{index}}"'

[site.reactive_prop]
none = '"{{index}}"'

[site.string_prop]
none = '"{{index}}"'

[site.deferred]
none = '"{{index}}"'

[site.if_else]
none = '"{{index}}"'
