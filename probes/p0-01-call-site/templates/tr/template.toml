# Template `tr` (P0.1): the concrete-type design of plans/04 §2-3, through the
# probe crate `mf2-probe` (../../crate). A site without variables is
# `tr(MsgId)` (a `const fn` building a 4-byte `Copy` value); a site with
# variables is `tr_args(MsgId, [ArgValue::from(v), …])` (one concrete type,
# positional slots, no names). Rendering, attributes, `From` conversions and
# `to_string()` are implemented once in the crate.
#
# Argument modes: `plain` passes the value; `signal` passes the signal itself
# (`ArgValue::Reactive`, the node subscribes); `get` is the user writing an
# enclosing `move ||` that reads `.get()`.
# Format: bench/workload-gen/README.md ("Template format").

name = "tr"
description = "Concrete Tr / TrArgs (probe crate mf2-probe): tr(id) and tr_args(id, [ArgValue…]); rendering implemented once in the library."
dependencies = ['mf2-probe = { path = "{{template_dir}}/../../crate" }']
prelude = "use mf2_probe::{tr, tr_args, ArgValue};"
support = "support.rs"
boot = "crate::support::boot();"

[args]
sep = ", "
plain = "ArgValue::from({{value}})"
signal = "ArgValue::from({{signal}})"

[deferred]
type = "mf2_probe::Tr"
view = "{{label}}"
string = "{{label}}.to_string()"

[site.string]
none = "tr({{index}}).to_string()"
plain = "tr_args({{index}}, [{{args}}]).to_string()"

[site.child]
none = "tr({{index}})"
# Markup messages (TrRich) are not part of this probe: rendered as simple.
rich = "tr({{index}})"
plain = "tr_args({{index}}, [{{args}}])"
signal = "tr_args({{index}}, [{{args}}])"
get = "move || tr_args({{index}}, [{{args}}])"

[site.attr]
none = "tr({{index}})"
plain = "tr_args({{index}}, [{{args}}])"
signal = "tr_args({{index}}, [{{args}}])"
get = "move || tr_args({{index}}, [{{args}}])"

[site.text_prop]
none = "tr({{index}})"
plain = "tr_args({{index}}, [{{args}}])"
signal = "tr_args({{index}}, [{{args}}])"
get = "move || tr_args({{index}}, [{{args}}])"

[site.signal_prop]
none = "tr({{index}})"
plain = "tr_args({{index}}, [{{args}}])"
signal = "tr_args({{index}}, [{{args}}])"
# `Signal<String>` has no `From<closure>`; this is what a user writes.
get = "Signal::derive(move || tr_args({{index}}, [{{args}}]).to_string())"

[site.string_prop]
none = "tr({{index}})"
plain = "tr_args({{index}}, [{{args}}])"

[site.deferred]
none = "tr({{index}})"

[site.if_else]
none = "tr({{index}})"
plain = "tr_args({{index}}, [{{args}}])"
