# Phase 10 A4 probe: the native ambient store's cost
# (plans/18-phase-10-work-order.md, A4). A standalone workspace: the root
# workspace excludes probes/. Deleted at Phase 10's exit (G4); the result is
# in A4's task record.
[workspace]
resolver = "3"
members = ["i18n", "ambient", "bench", "cli-a", "cli-b"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
mf2 = { path = "../../crates/mf2" }
mf2-build = { path = "../../crates/mf2-build" }
mf2-catalog = { path = "../../crates/mf2-catalog" }
mf2-native = { path = "../../crates/mf2-native" }
mf2-ratatui = { path = "../../crates/mf2-ratatui" }
ratatui-core = { version = "0.1.2", default-features = false }
probe-i18n = { path = "i18n" }
ambient = { path = "ambient" }

# As the repository's native benches: opt-level 3 and fat LTO.
[profile.release]
lto = "fat"

# The stripped size: the release profile, symbols stripped.
[profile.stripped]
inherits = "release"
strip = true
