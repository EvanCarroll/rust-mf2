[package]
name = "ambient"
description = "A4 probe: the native ambient store (D17), variants (b) and (c)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Pattern text through the runtime's hidden parts seam
# (`PartSink::part_catalog_text`, on branch p10-a4-ambient only).
seam = []

[dependencies]
mf2 = { workspace = true, features = ["host-std"] }
mf2-catalog = { workspace = true, features = ["static-bytes"] }
ratatui-core.workspace = true
thiserror = "2.0.20"
# As mf2-native: the system's languages and time zone.
sys-locale = "0.3.2"
jiff = { version = "0.2.37", default-features = false, features = ["std", "tz-system"] }
