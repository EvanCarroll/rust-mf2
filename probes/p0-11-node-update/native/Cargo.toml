[package]
name = "p0-11-native"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "P0.11 native model: RenderEffect per node (A) vs library registry (B) over a fake DOM."

[dependencies]
reactive_graph = { version = "0.2.14", features = ["effects"] }
any_spawner = { version = "0.3.0", features = ["futures-executor"] }
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[workspace]
