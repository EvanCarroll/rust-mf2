[package]
name = "p0-11-wasm"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "P0.11 browser harness: real mf2-probe Tr nodes, strategy A (feature `a`) or B."

[lib]
crate-type = ["cdylib"]

[dependencies]
leptos = { version = "0.8.20", features = ["csr"] }
any_spawner = { version = "0.3.0", features = ["wasm-bindgen"] }
mf2-probe = { path = "../../p0-01-call-site/crate" }
wasm-bindgen = "0.2.128"

[features]
# Strategy A: RenderEffect per node. Default: B, the registry.
a = ["mf2-probe/effect"]

# Same size profile as the shipped client (plans/06 §3).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
