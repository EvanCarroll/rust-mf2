[package]
name = "tr"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
leptos.workspace = true
thiserror.workspace = true
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
  "Window", "Document", "Element", "HtmlDocument", "Text", "Node",
  "Request", "RequestInit", "RequestMode", "RequestCredentials", "Response",
  "console",
] }

[features]
ssr = ["leptos/ssr"]
# Reproduce the D9 failure: no capture for derived values under ssr.
d9-no-capture = []
hydrate = [
  "leptos/hydrate",
  "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys",
]
