# P0.2 + P0.10 — vertical slice and hydration tolerance (throwaway probe).
# Standalone: its own workspace, excluded from the root workspace (`exclude = ["probes"]`).
[workspace]
resolver = "3"
members = ["tr"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
leptos = "0.8.20"
leptos_router = "0.8.15"
leptos_meta = "0.8.6"
leptos_axum = "0.8.10"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal"] }
# The wasm-bindgen crate MUST equal the wasm-bindgen CLI on PATH (0.2.128), which
# cargo-leptos 0.3.7 picks up before trying to download one.
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.105"
web-sys = "0.3.105"
console_error_panic_hook = "0.1.7"
thiserror = "2.0.20"

[package]
name = "p002"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "p002"
path = "src/main.rs"

[dependencies]
tr = { path = "tr" }
leptos.workspace = true
leptos_router.workspace = true
leptos_meta.workspace = true
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
wasm-bindgen.workspace = true
console_error_panic_hook = { workspace = true, optional = true }
thiserror.workspace = true

[features]
hydrate = ["leptos/hydrate", "tr/hydrate", "dep:console_error_panic_hook"]
ssr = [
  "dep:axum",
  "dep:tokio",
  "dep:leptos_axum",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "tr/ssr",
]
# P0.2 D9 reproduction: pure render-time lookup for TextProp / Signal<String>.
d9-no-capture = ["tr/d9-no-capture"]

# Size-optimised client wasm, identical to the root workspace's `wasm-release`
# (plans/06-size-and-perf.md §3). cargo-leptos then runs `wasm-opt -Oz`.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.leptos]
output-name = "p002"
site-root = "target/site"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:3702"
reload-port = 3703
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
env = "DEV"
