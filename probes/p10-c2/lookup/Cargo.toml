# Phase 10 C2: the ambient lookup's first step, timed. A standalone
# workspace (the root one excludes probes/): the same bench built twice, with
# `native` alone and with `ssr` (and its Leptos line) unified beside it, as a
# workspace that holds a server and a native application builds `mf2`; then
# the two binaries run alternately (`run.sh`). Deleted at Phase 10's exit
# with the other probes/p10-*; the figures are in C2's record.
[workspace]

[package]
name = "lookup-bench"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[features]
# The lookup's first step compiled in: the request's catalog, looked for in
# the reactive owner's context before the native store is read.
ssr = ["mf2/leptos", "mf2/ssr"]

[dependencies]
mf2 = { path = "../../../crates/mf2", features = ["native"] }
mf2-catalog = { path = "../../../crates/mf2-catalog", features = ["writer"] }
mf2-syntax = { path = "../../../crates/mf2-syntax" }

[profile.release]
lto = "fat"
