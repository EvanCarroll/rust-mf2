[package]
name = "w-icu-blob-fixed-offz"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.128"
mf2dt = { path = "../../mf2dt" }
dt-icu = { path = "../../dt-icu", features = ["buffer", "offset-zones"] }
icu_provider_blob = { version = "2.3.0", default-features = false, features = ["alloc"] }
