[workspace]
resolver = "3"
members = ["mf2dt", "dt-icu", "dt-intl", "blobgen", "check", "wasm/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# 06 §3 size method: opt-level z, fat LTO, one CGU, abort, strip; then wasm-opt -Oz.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

# Same, keeping symbol names for twiggy / the B12 check.
[profile.wasm-syms]
inherits = "wasm-release"
strip = false
