[package]
name = "dt-icu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "P0.6 probe: MF2 date plan -> text through ICU4X icu_datetime (datetime-icu backend)."

[features]
default = []
# Data from a runtime blob (BufferProvider + postcard deserialisation).
buffer = ["icu_datetime/serde", "icu_provider/serde"]
# Data compiled into the binary (all locales).
compiled = ["icu_datetime/compiled_data"]
# timeZoneStyle → localized-offset formats instead of specific names.
offset-zones = []

[dependencies]
mf2dt = { path = "../mf2dt" }
icu_datetime = { version = "2.3.0", default-features = false }
icu_calendar = { version = "2.3.0", default-features = false }
icu_time = { version = "2.3.0", default-features = false }
icu_locale_core = { version = "2.3.0", default-features = false }
icu_provider = { version = "2.3.1", default-features = false }
writeable = { version = "0.6", default-features = false }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
