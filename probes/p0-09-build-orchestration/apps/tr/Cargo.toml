# P0.9 reference-workload app, template `tr` (sources in src/ and style/ are
# synced from workload-gen by scripts/regen.sh; this manifest is the probe's).
[package]
name = "workload-app-tr"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
p09-i18n.workspace = true
p09-second.workspace = true
leptos.workspace = true
leptos_router.workspace = true
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
wasm-bindgen.workspace = true

[features]
hydrate = ["leptos/hydrate", "p09-i18n/hydrate", "p09-second/hydrate"]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_router/ssr",
    "p09-i18n/ssr",
    "p09-second/ssr",
]

[[bin]]
name = "workload-app-tr"
path = "server/main.rs"

[package.metadata.leptos]
output-name = "workload-app-tr"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
site-addr = "127.0.0.1:3709"
reload-port = 3710
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
# cargo-leptos watches only the Rust sources of the lib/bin packages and their
# local dependencies: the i18n crate's locales/ must be added (P0.9 finding).
watch-additional-files = ["crates/i18n/locales"]
