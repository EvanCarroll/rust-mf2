# P0.9 template `trivial` (timing control): same sites, same wrapper path and
# call syntax, but `tr0!` forwards to a proc-macro that reads no manifest and
# checks nothing (it emits the same expression shape with MsgId(0)).
name = "trivial"
description = "P0.9 timing control: tr0!(\"id\", name = value) — same wrapper path and syntax, a proc-macro that reads no manifest."
prelude = "use p09_i18n::tr0;"
support = "support.rs"
boot = "crate::support::boot();"

[args]
sep = ", "
plain = "{{name}} = {{value}}"
signal = "{{name}} = {{signal}}"

[deferred]
type = "p09_i18n::__mf2::Tr"
view = "{{label}}"
string = "{{label}}.to_string()"

[site.string]
none = 'tr0!("{{id}}").to_string()'
plain = 'tr0!("{{id}}", {{args}}).to_string()'

[site.child]
none = 'tr0!("{{id}}")'
plain = 'tr0!("{{id}}", {{args}})'
get = 'move || tr0!("{{id}}", {{args}})'

[site.attr]
none = 'tr0!("{{id}}")'
plain = 'tr0!("{{id}}", {{args}})'
get = 'move || tr0!("{{id}}", {{args}})'

[site.text_prop]
none = 'tr0!("{{id}}")'
plain = 'tr0!("{{id}}", {{args}})'
get = 'move || tr0!("{{id}}", {{args}}).to_string()'

[site.signal_prop]
none = 'tr0!("{{id}}")'
plain = 'tr0!("{{id}}", {{args}})'
get = 'Signal::derive(move || tr0!("{{id}}", {{args}}).to_string())'

[site.string_prop]
none = 'tr0!("{{id}}")'
plain = 'tr0!("{{id}}", {{args}})'

[site.deferred]
none = 'tr0!("{{id}}")'

[site.if_else]
none = 'tr0!("{{id}}")'
plain = 'tr0!("{{id}}", {{args}})'
