# P0.9 — build orchestration (throwaway probe; plans/06-size-and-perf.md §5,
# plans/05-tooling.md §4). Standalone: its own workspace, excluded from the
# root workspace (`exclude = ["probes"]`).
#
#   crates/catalog  p09-catalog  stand-in for mf2-catalog[manifest, writer]: message model,
#                                manifest file (.mf2m) + manifest_hash, catalog file (.mf2b)
#   crates/build    p09-build    stand-in for mf2-build: resource loader (05 §2 working grammar),
#                                MF2 scanner, manifest, catalogs, codegen — used from build.rs
#   crates/macros   p09-macros   stand-in for mf2-macros: the tr! proc-macro (+ a trivial one)
#   crates/mf2      p09-mf2      stand-in for the `mf2` facade: MsgId, Tr, TrArgs, ArgValue, glue
#   crates/i18n     p09-i18n     the application's i18n crate: locales/ + build.rs
#   crates/second   p09-second   a second crate that depends on the i18n crate and calls tr!
#   apps/tr         workload-app-tr       cargo-leptos app, 2,000 tr! sites (template tr)
#   apps/trivial    workload-app-trivial  same app, trivial proc-macro (timing control)
#   apps/direct     workload-app-direct   same app, hand-expanded calls, no macro (timing control)
[workspace]
resolver = "3"
members = [
    "crates/catalog",
    "crates/build",
    "crates/macros",
    "crates/mf2",
    "crates/i18n",
    "crates/second",
    "apps/tr",
    "apps/trivial",
    "apps/direct",
]
# workload-gen output (each generated app there is its own standalone workspace).
exclude = ["gen"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# Latest versions on 2026-09-20 (cargo search). Leptos: latest stable 0.8.x (D10).
[workspace.dependencies]
p09-catalog = { path = "crates/catalog" }
p09-build = { path = "crates/build" }
p09-macros = { path = "crates/macros" }
p09-mf2 = { path = "crates/mf2" }
p09-i18n = { path = "crates/i18n" }
p09-second = { path = "crates/second" }
thiserror = "2.0.20"
syn = { version = "3.0.6", features = ["full"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
leptos = "0.8.20"
leptos_router = "0.8.15"
leptos_axum = "0.8.10"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
# Must equal the wasm-bindgen CLI on PATH (0.2.128), which cargo-leptos 0.3.7
# uses before trying to download one.
wasm-bindgen = "=0.2.128"

# Size-optimised client wasm (plans/06-size-and-perf.md §3).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
