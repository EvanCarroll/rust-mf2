[package]
name = "locdata"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "P0.5 probe (build side): slice third_party/cldr-json into compact per-locale LOCALE entries for fn-number (symbols, grouping, digits, percent/currency patterns, currency and unit tables)."

[dependencies]
serde_json = "1.0.151"
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2.0.20"
# Only for the digits of native numbering systems: cldr-core/supplemental/
# numberingSystems.json is not vendored (see RESULT.md), ICU4X's compiled
# CLDR 48.2.1 data stands in.
icu_decimal = "2.3.0"
icu_locale_core = "2.3.0"
fixed_decimal = "0.7.2"
writeable = "0.6"
