[package]
name = "w-icu-decimal-blob"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.128"
numcore = { path = "../../numcore" }
icu_decimal = { version = "2.3.0", default-features = false, features = ["serde"] }
icu_locale_core = { version = "2.3.0", default-features = false }
icu_provider_blob = { version = "2.3.0", default-features = false, features = ["alloc"] }
fixed_decimal = { version = "0.7.2", default-features = false }
writeable = "0.6"
