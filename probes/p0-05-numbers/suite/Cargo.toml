[package]
name = "suite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "P0.5 probe harness (native, dev-only): a minimal MF2 parser + evaluator, enough for test/tests/functions/{number,integer,offset,percent,currency}.json, driving numcore (and numloc)."

[dependencies]
numcore = { path = "../numcore", features = ["f64"] }
numloc = { path = "../numloc", features = ["currency", "unit"] }
serde_json = "1.0.151"
