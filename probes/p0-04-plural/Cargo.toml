# P0.4 plural probe — standalone workspace, excluded from the root workspace
# (the root excludes `probes`). Throwaway code; see RESULT.md.
[workspace]
resolver = "3"
members = ["eval", "rules", "icu-data", "wasm/*"]
# `cargo test` / `cargo build` without -p: the native crates only (the wasm
# harnesses are no_std cdylibs built by scripts/size.sh for wasm32).
default-members = ["eval", "rules"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# Every dependency declared once, at its latest version (crates.io, 2026-09-20).
[workspace.dependencies]
plural-eval = { path = "eval" }
plural-rules = { path = "rules" }
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2.0.20"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }
icu_plurals = { version = "2.3.0", default-features = false }
icu_locale_core = { version = "2.3.0", default-features = false }
icu_locale = { version = "2.3.1", default-features = false }
icu_provider = { version = "2.3.1", default-features = false }
icu_provider_blob = { version = "2.3.0", default-features = false }
icu_provider_export = { version = "2.3.0", default-features = false }
icu_provider_source = { version = "2.3.1", default-features = false }
fixed_decimal = { version = "0.7.2", default-features = false }

# 06 §3 size method: opt-level z, fat LTO, one CGU, abort, strip; then wasm-opt -Oz, gzip -9.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

# Same, keeping symbol names, for twiggy and the B12 check.
[profile.wasm-syms]
inherits = "wasm-release"
strip = false
