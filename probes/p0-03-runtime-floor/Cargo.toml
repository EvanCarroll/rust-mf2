# P0.3 runtime-floor probe — standalone workspace (the root workspace excludes
# `probes`). Throwaway code; see RESULT.md.
[workspace]
resolver = "3"
members = ["rt", "check", "wasm/*"]
# The wasm harnesses are cdylibs built by scripts/size.sh for wasm32.
default-members = ["rt", "check"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# Every dependency declared once, at its latest version (crates.io, 2026-09-20).
[workspace.dependencies]
p03-rt = { path = "rt" }
# P0.7's format constants and build side, P0.4's plural evaluator — read-only, by path.
mf2b-format = { path = "../p0-07-catalog-encoding/format" }
p07-enc = { path = "../p0-07-catalog-encoding/enc" }
plural-eval = { path = "../p0-04-plural/eval" }
plural-rules = { path = "../p0-04-plural/rules" }
thiserror = { version = "2.0.20", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }

# 06 §3 size method: opt-level z, fat LTO, one CGU, abort, strip; then wasm-opt -Oz, gzip -9.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

# Same, keeping symbol names, for twiggy and the B12 check.
[profile.wasm-syms]
inherits = "wasm-release"
strip = false
