# Variant 5: the generated `tr` (today's exported shape, or 3a's local
# shape) against a glob-imported prelude `tr`. One `gen-*` feature, and the
# call sites one at a time.
[package]
name = "v5-glob"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["gen-today"]
gen-today = []
gen-local = []
# The crate root glob-imports the prelude; the call at the root.
root-glob = []
# A module after the include glob-imports it and calls tr!.
after-glob = []
# A module before the include glob-imports it and calls tr!.
before-glob = []
# A module after the include glob-imports it and names `crate::tr` explicitly.
after-glob-explicit = []

[dependencies]
mf2.workspace = true
v5-prelude = { path = "../v5-prelude" }

[build-dependencies]
mf2-build.workspace = true
