# Variants 1 and 2: today's generated module (mf2-build, Emit::Native),
# included at the crate root, called in every spelling from modules declared
# before and after the include. One feature per spelling, each compiled alone.
[package]
name = "v1-today"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
before-unqualified = []
before-crate-path = []
before-use-crate = []
before-super-path = []
after-unqualified = []
after-crate-path = []
after-use-crate = []
after-super-path = []
root-unqualified = []
root-crate-path = []
root-self-path = []
dollar-crate = []
# `#[path = concat!(env!("OUT_DIR"), …)] mod generated;` instead of include!.
path-mod = []
# Variant 2: the future-incompatibility lint allowed crate-wide.
allow-52234 = []

[dependencies]
mf2.workspace = true

[build-dependencies]
mf2-build.workspace = true
