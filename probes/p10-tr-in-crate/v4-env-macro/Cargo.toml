# Variant 4: a stand-in for an `mf2::tr!` proc macro that finds its crate's
# manifest through the environment rustc was started with, instead of a
# path baked into a generated `macro_rules!`.
[package]
name = "v4-env-macro"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[dependencies]
mf2-catalog.workspace = true
proc-macro2.workspace = true
quote.workspace = true
