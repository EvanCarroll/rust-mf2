# Variant 3: the generated wrapper rewritten so that it is path-addressable
# inside its own crate. Everything else is mf2-build's module, byte for
# byte; the build script replaces only the `tr!` / `msg_id!` wrappers.
# Exactly one `shape-*` feature, and the call-site features compiled one at
# a time.
[package]
name = "v3-local"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["shape-local"]
# 3a: `macro_rules! tr` (not exported) + `pub(crate) use tr;`.
shape-local = []
# 3b: `#[macro_export] macro_rules! tr` + `pub(crate) use tr;` at the root.
shape-export-use = []
# 3c: `#[macro_export] macro_rules! __mf2_tr` + `pub use __mf2_tr as tr;`.
shape-hidden-export = []
# 3e: 3c, plus a textual (not exported) `macro_rules! tr` for the code after
# the include.
shape-hidden-export-textual = []
# 3d: 3a for the crate, plus `#[macro_export] macro_rules! __mf2_tr_export`
# for other crates, re-exported as `tr` by a `pub use` in a generated module
# `exports`.
shape-local-and-export = []

# Call sites, one at a time.
before-unqualified = []
before-crate-path = []
before-use-crate = []
before-prelude = []
after-unqualified = []
after-crate-path = []
after-use-crate = []
after-prelude = []
root-unqualified = []

[dependencies]
mf2.workspace = true

[build-dependencies]
mf2-build.workspace = true
