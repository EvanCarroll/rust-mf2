# What another crate writes against variant 3's shapes.
[package]
name = "v3-consumer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
shape-local = ["v3-local/shape-local"]
shape-export-use = ["v3-local/shape-export-use"]
shape-hidden-export = ["v3-local/shape-hidden-export"]
shape-local-and-export = ["v3-local/shape-local-and-export"]
shape-hidden-export-textual = ["v3-local/shape-hidden-export-textual"]
by-path = []
by-use = []
by-prelude = []
by-exports = []

[dependencies]
mf2.workspace = true
v3-local = { path = "../v3-local", default-features = false }
