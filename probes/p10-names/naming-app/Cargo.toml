[package]
name = "naming-app"
description = "An application that names the stand-in's `leptos` and `axum` modules beside its own `leptos` and `axum`."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# N5: `use naming::leptos;` (the bare module), then a bare `use leptos::…`.
# Expected: E0659, ambiguous.
n5-bare-module-import = []

[dependencies]
naming = { path = "../naming" }
leptos = { version = "0.9.0-beta", default-features = false, features = ["ssr"] }
axum = { version = "0.8.9", default-features = false }
