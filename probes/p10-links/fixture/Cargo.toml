# A translation crate that `mf2`'s own tests depend on: the dev-dependency
# cycle `mf2` → (dev) fixture → `mf2` that 2.0's tests of the generated
# module will have.
[package]
name = "p10-links-fixture"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
mf2 = { package = "p10-links-mf2", path = "../mf2" }

[build-dependencies]
mf2-build = { package = "p10-links-mf2-build", path = "../mf2-build" }
