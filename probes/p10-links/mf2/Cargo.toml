[package]
# A probe name: nothing here is ever published. `cargo publish --dry-run`
# needs `publish` left unset, so it is.
name = "p10-links-mf2"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Phase 10 A2 probe: a stand-in for `mf2` that carries its features to the build scripts of dependent crates through `links` metadata. Not for use."
repository = "https://github.com/EvanCarroll/rust-mf2"
# The whole point: cargo passes `cargo::metadata=KEY=VALUE` from this
# package's build script to the build scripts of the crates that depend on
# it directly, as `DEP_MF2_V2_KEY`. The major version is in the name.
links = "mf2-v2"

[features]
default = []
# The Leptos modes: exactly one per build.
ssr = []
hydrate = []
csr = []
leptos = []
axum = []
# Native applications; `ratatui` implies `native`.
native = []
ratatui = ["native"]
# The function families and the date backends, as the real crate's.
fn-number = []
fn-datetime = []
datetime-icu = ["fn-datetime"]
datetime-intl = ["fn-datetime"]
intl = []
static-locale = []
mark-fallback-lang = []
compile = []

# The dev-dependency cycle row: a translation crate in `mf2`'s own tests.
[dev-dependencies]
fixture = { package = "p10-links-fixture", path = "../fixture" }
