# A second dependent that uses the cfg-forwarding macros in its own code,
# with no build script and no features: it follows `mf2`'s unified set.
[package]
name = "p10-links-widgets"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
mf2 = { package = "p10-links-mf2", path = "../../mf2" }
