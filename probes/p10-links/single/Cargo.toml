# Scenario 1: a single-crate application — `build.rs`, `locales/` and the
# generated module in the application crate itself (the 2.0 native default).
[workspace]
resolver = "3"

[package]
name = "p10-links-single"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
mf2 = { package = "p10-links-mf2", path = "../mf2", features = ["fn-number"] }

[build-dependencies]
mf2-build = { package = "p10-links-mf2-build", path = "../mf2-build" }

# The application's own choices, forwarded to `mf2` — the only place a
# feature is written. The build script never reads these.
[features]
native = ["mf2/native"]
ssr = ["mf2/ssr"]
hydrate = ["mf2/hydrate"]
datetime-intl = ["mf2/datetime-intl"]
