# `mf2` as a normal dependency (no features) and as a build-dependency (`native`,
# `compile`): the script sees the normal instance's features.
[package]
name = "c6-host"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
mf2 = { path = "../../../../crates/mf2" }

[build-dependencies]
mf2 = { path = "../../../../crates/mf2", features = ["native", "compile"] }
mf2-build = { path = "../../../../crates/mf2-build" }
