# The application: it alone turns mf2's features on.
[package]
name = "c6-app"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
mf2 = { path = "../../../../../crates/mf2", features = ["fn-number"] }
i18n = { package = "c6-i18n", path = "../i18n" }

[features]
native = ["mf2/native"]
