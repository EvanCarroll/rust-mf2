# Scenario 4: cargo-leptos's two builds — the server binary with `ssr`
# (native) and the client library with `hydrate` (wasm32) — over a
# translation crate that declares no features. Leptos itself is left out:
# the probe is about how the features reach the build script, and
# cargo-leptos drives the two cargo builds the same way with or without it.
[workspace]
resolver = "3"
members = ["app", "i18n"]

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
