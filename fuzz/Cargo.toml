# cargo-fuzz targets (plans/01-conformance.md §5, "Fuzzing"). A standalone
# workspace: cargo-fuzz needs a nightly toolchain, and this is
# the one place that uses `+nightly` (see README.md). The root workspace
# excludes this directory.
[package]
name = "mf2-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
mf2-catalog = { path = "../crates/mf2-catalog", features = ["writer", "decode"] }
mf2-host-std = { path = "../crates/mf2-host-std" }
mf2-l4-runner = { path = "../conformance/l4-runner" }
mf2-locale-data = { path = "../crates/mf2-locale-data" }
mf2-model = { path = "../crates/mf2-model" }
mf2-runtime = { path = "../crates/mf2-runtime" }
mf2-syntax = { path = "../crates/mf2-syntax" }

[workspace]
members = ["."]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "catalog"
path = "fuzz_targets/catalog.rs"
test = false
doc = false
bench = false

[[bin]]
name = "format"
path = "fuzz_targets/format.rs"
test = false
doc = false
bench = false
