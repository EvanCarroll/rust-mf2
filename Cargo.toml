[workspace]
resolver = "3"
members = [
    "crates/mf2-model",
    "crates/mf2-syntax",
    "crates/mf2-catalog",
    "crates/mf2-runtime",
    "crates/mf2-fn-datetime",
    "crates/mf2-locale-data",
    "crates/mf2-host-std",
    "crates/mf2-host-web",
    "crates/mf2",
    "xtask",
    "conformance",
    "conformance/l4-runner",
    "bench/workload-gen",
    "bench/parser-gate",
    "bench/catalog-bench",
    "bench/runtime-bench",
]
# Standalone workspaces: the Phase 0 experiments, the cargo-fuzz targets
# (nightly only), and the B12 wasm harnesses (no_std cdylibs with their own
# panic handler and allocator; bench/b12/check.sh).
exclude = ["probes", "fuzz", "bench/b12"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# Every dependency is declared once, here, at its latest version.
[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
# `default-features = false` for the no_std crates; std crates add `features = ["std"]`.
thiserror = { version = "2.0.20", default-features = false }
mf2 = { path = "crates/mf2" }
mf2-catalog = { path = "crates/mf2-catalog" }
mf2-conformance = { path = "conformance" }
mf2-fn-datetime = { path = "crates/mf2-fn-datetime" }
mf2-l4-runner = { path = "conformance/l4-runner" }
mf2-host-std = { path = "crates/mf2-host-std" }
mf2-host-web = { path = "crates/mf2-host-web" }
mf2-locale-data = { path = "crates/mf2-locale-data" }
mf2-model = { path = "crates/mf2-model" }
mf2-runtime = { path = "crates/mf2-runtime" }
mf2-syntax = { path = "crates/mf2-syntax" }
# `default-features = false` so that no_std crates (mf2-model's `serde` feature)
# can use it; std crates add `features = ["std"]`.
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"
# no_std use in mf2-syntax (validation, analysis); std crates add `features = ["std"]`.
unicode-normalization = { version = "0.1.25", default-features = false }
# mf2-conformance: validates model JSON against spec/data-model/message.json.
jsonschema = { version = "0.56.0", default-features = false }
# The one exact pin (the audited alpha, plans/05-tooling.md §1): a dependency of
# bench/parser-gate and a dev-dependency (differential oracle) of mf2-conformance.
ox_mf2_parser = "=0.14.0-alpha.12"
# bench/catalog-bench (B7 sizes, plans/06 §3): brotli quality 11 / window 22 as
# P0.7 measured; two pure-Rust gzip implementations beside GNU `gzip -9 -n`
# (flate2 with its default backend, miniz_oxide; and zlib-rs, the zlib port).
brotli = "9.0.0"
flate2 = "1.1.10"
zlib-rs = "0.6.8"
workload-gen = { path = "bench/workload-gen" }
catalog-bench = { path = "bench/catalog-bench" }
# mf2-runtime's numeric semantics: `fixed_decimal` only as the A/B baseline of
# the own digit buffer (plans/10 A5b, owner decision 1); `ryu` for float text
# in mf2-host-std (plans/03 §2.5).
fixed_decimal = { version = "0.7.2", default-features = false }
ryu = "1.0.23"
# mf2-host-web: the browser's normalize() and String(x); no_std (no `std`,
# no `unsafe-eval`).
js-sys = { version = "0.3.105", default-features = false }

[workspace.lints.rust]
# Product crates add `#![forbid(unsafe_code)]` themselves. The bench crates need
# one `unsafe impl GlobalAlloc` (counting allocator) and `allow` it locally.
unsafe_code = "deny"
missing_debug_implementations = "allow"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Pedantic, minus the lints that are noise for this codebase.
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
# Client-path crates (mf2-catalog reader, mf2-runtime, mf2-fn-*, mf2-host-web,
# leptos-mf2) additionally deny, in their own lib.rs: clippy::unwrap_used,
# clippy::expect_used, clippy::indexing_slicing, clippy::panic, and forbid the
# fmt machinery on the client path (plans/06-size-and-perf.md, B12).

# Native benches (e.g. the parser gate) use `release`: cargo's opt-level 3 plus
# fat LTO.
[profile.release]
lto = "fat"

# Size-optimised client wasm (plans/06-size-and-perf.md §3). Always followed by
# `wasm-opt -Oz` before measuring.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
