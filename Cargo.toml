[workspace]
resolver = "3"
members = [
    "crates/mf2-model",
    "crates/mf2-syntax",
    "crates/mf2-catalog",
    "crates/mf2-resource",
    "crates/mf2-build",
    "crates/mf2-cli",
    "crates/mf2-runtime",
    "crates/mf2-fn-number",
    "crates/mf2-fn-datetime",
    "crates/mf2-locale-data",
    "crates/mf2-host-std",
    "crates/mf2-host-web",
    "crates/mf2-macros",
    "crates/leptos-mf2",
    "crates/mf2-axum",
    "crates/mf2",
    "xtask",
    "conformance",
    "conformance/l4-runner",
    "conformance/l5/gen",
    "conformance/l5/en-us",
    "conformance/l5/und",
    "conformance/l5/fr",
    "conformance/l5/ar",
    "conformance/l5-generated",
    "bench/build-cost",
    "bench/workload-gen",
    "bench/parser-gate",
    "bench/catalog-bench",
    "bench/runtime-bench",
    "tools/i18n-fixture",
]
# Standalone workspaces: the Phase 0 experiments, the cargo-fuzz targets
# (nightly only), the B12 wasm harnesses (no_std cdylibs with their own
# panic handler and allocator; bench/b12/check.sh), the `intl` probe, L4
# in the browser for the `intl` build (`cargo xtask l4-web`), whose `intl`
# features must not unify into this workspace's builds, and the
# `datetime-intl` browser check (tools/e2e/datetime), conformance L6 in the
# browser (`cargo xtask l6-web`, whose `ssr` and `hydrate` builds are
# exclusive), and the Phase 6 example, for the same reason.
exclude = [
    "probes",
    "fuzz",
    "bench/b12",
    "bench/intl-probe",
    # The churn harness (Phase 7 A5): a `csr` cdylib, which must not unify
    # with this workspace's `ssr`.
    "bench/churn",
    "conformance/l4-web",
    "conformance/l6-web",
    "tools/e2e/datetime",
    # An application turns on exactly one of `ssr` and `hydrate`, and cargo
    # unifies features across a workspace: each example is its own.
    "examples/demo-ssr",
    "examples/demo-islands",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# Every dependency is declared once, here, at its latest version.
[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
# `default-features = false` for the no_std crates; std crates add `features = ["std"]`.
thiserror = { version = "2.0.20", default-features = false }
mf2 = { path = "crates/mf2" }
mf2-build = { path = "crates/mf2-build" }
mf2-catalog = { path = "crates/mf2-catalog" }
mf2-cli = { path = "crates/mf2-cli" }
mf2-conformance = { path = "conformance" }
leptos-mf2 = { path = "crates/leptos-mf2" }
mf2-axum = { path = "crates/mf2-axum" }
mf2-fn-number = { path = "crates/mf2-fn-number" }
mf2-fn-datetime = { path = "crates/mf2-fn-datetime" }
mf2-l4-runner = { path = "conformance/l4-runner" }
mf2-l5-gen = { path = "conformance/l5/gen" }
mf2-l5-en-us = { path = "conformance/l5/en-us" }
mf2-l5-und = { path = "conformance/l5/und" }
mf2-l5-fr = { path = "conformance/l5/fr" }
mf2-l5-ar = { path = "conformance/l5/ar" }
mf2-host-std = { path = "crates/mf2-host-std" }
mf2-host-web = { path = "crates/mf2-host-web" }
mf2-locale-data = { path = "crates/mf2-locale-data" }
mf2-macros = { path = "crates/mf2-macros" }
mf2-model = { path = "crates/mf2-model" }
mf2-resource = { path = "crates/mf2-resource" }
mf2-runtime = { path = "crates/mf2-runtime" }
mf2-syntax = { path = "crates/mf2-syntax" }
# mf2-macros: the `tr!` proc-macro (plans/05-tooling.md §4). `full` for the
# argument expressions a call site writes.
proc-macro2 = "1.0.107"
# The `tr!` compile-fail set (plans/13, A5), a dev-dependency of the fixture.
trybuild = "1.0.121"
quote = "1.0.47"
syn = { version = "3.0.6", features = ["full"] }
# `default-features = false` so that no_std crates (mf2-model's `serde` feature)
# can use it; std crates add `features = ["std"]`.
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"
# no_std use in mf2-syntax (validation, analysis); std crates add `features = ["std"]`.
unicode-normalization = { version = "0.1.25", default-features = false }
# mf2-build's `nonstandard-name` lint (plans/05-tooling.md §5): UAX #31's
# XID_Start / XID_Continue, and UTS #39's Identifier_Status and script sets.
# Build-time only; never a dependency of a client-path crate.
unicode-ident = "1.0.26"
unicode-security = "0.1.2"
# mf2-locale-data (build side): General_Category for CLDR's currency-spacing
# test on currency symbols (plans/02-catalog-format.md §4.6).
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
# mf2-conformance: validates model JSON against spec/data-model/message.json.
jsonschema = { version = "0.56.0", default-features = false }
# The one exact pin (the audited alpha, plans/05-tooling.md §1): a dependency of
# bench/parser-gate and a dev-dependency (differential oracle) of mf2-conformance.
ox_mf2_parser = "=0.14.0-alpha.12"
# bench/catalog-bench (B7 sizes, plans/06 §3): brotli quality 11 / window 22 as
# P0.7 measured; two pure-Rust gzip implementations beside GNU `gzip -9 -n`
# (flate2 with its default backend, miniz_oxide; and zlib-rs, the zlib port).
brotli = "9.0.0"
flate2 = "1.1.10"
zlib-rs = "0.6.8"
workload-gen = { path = "bench/workload-gen" }
catalog-bench = { path = "bench/catalog-bench" }
# mf2-runtime's numeric semantics: `fixed_decimal` only as the A/B baseline of
# the own digit buffer (plans/10 A5b, owner decision 1); `ryu` for float text
# in mf2-host-std (plans/03 §2.5).
fixed_decimal = { version = "0.7.2", default-features = false }
ryu = "1.0.23"
# mf2-host-web: the browser's normalize() and String(x); no_std (no `std`,
# no `unsafe-eval`).
js-sys = { version = "0.3.105", default-features = false }
# leptos-mf2 (`plans/04-leptos-integration.md` §10): the latest stable Leptos
# line, the versions P0.2 verified end to end. `tachys` and `reactive_graph`
# are named directly — the glue module is written against tachys — and unify
# with the ones `leptos` pulls in. `cargo xtask leptos-beta` moves these three
# (and the three below) to the 0.9 pre-releases in a copy of the tree.
leptos = { version = "0.8.20", default-features = false }
tachys = { version = "0.2.18", default-features = false }
reactive_graph = { version = "0.2.14", default-features = false }
oco_ref = "0.2.1"
any_spawner = "0.3.0"
# mf2-axum: the server. `leptos_axum` provides the request's `Parts` and a
# `ResponseOptions` in context, so negotiation needs no tower layer of its own.
axum = { version = "0.8.9", default-features = false }
http = "1.5.0"
leptos_axum = "0.8.10"
leptos_meta = "0.8.6"
leptos_router = "0.8.15"
wasm-bindgen-futures = "0.4.78"
# The client half: the hydration cursor's nodes, the catalog fetch, one
# console diagnostic. No `#[wasm_bindgen]` item of ours, so
# `forbid(unsafe_code)` holds (04 §10).
web-sys = { version = "0.3.105", default-features = false, features = [
    "console",
    "Document",
    "Element",
    "Headers",
    "History",
    "HtmlElement",
    "HtmlLinkElement",
    "Navigator",
    "Node",
    "Request",
    "RequestInit",
    "Response",
    "Storage",
    "Text",
    "Window",
] }
# mf2-host-web's `intl`, `datetime-intl` and `time-zones`: inline-JS modules
# for `Intl.NumberFormat`, `Intl.PluralRules` and `Intl.DateTimeFormat` (the
# CLI that post-processes the wasm is 0.2.128).
wasm-bindgen = { version = "0.2.128", default-features = false }
# mf2-host-std: the server's time-zone database (owner decision 1, plans/03
# §5.2): jiff's bundled IANA data, the same native and on wasm32-wasip1.
jiff = { version = "0.2.37", default-features = false }
# mf2-fn-datetime's `datetime-icu` backend (plans/03 §5.2): ICU4X 2.x, no
# default features (no compiled data, no IXDTF parser) — data comes from the
# catalog's `icu.blob`; servers add compiled data per target.
icu_calendar = { version = "2.3.0", default-features = false }
icu_datetime = { version = "2.3.0", default-features = false }
icu_decimal = { version = "2.3.0", default-features = false }
icu_locale_core = { version = "2.3.0", default-features = false }
icu_provider = { version = "2.3.1", default-features = false }
icu_provider_blob = { version = "2.3.0", default-features = false }
icu_time = { version = "2.3.0", default-features = false }
writeable = { version = "0.6.4", default-features = false }
# mf2-locale-data's `icu-blob` (build side): the per-locale `icu.blob`,
# exported from ICU4X's own baked CLDR data — nothing downloaded (P0.6).
icu_calendar_data = "2.3.0"
icu_datetime_data = "2.3.0"
icu_decimal_data = "2.3.0"
icu_locale = { version = "2.3.1", default-features = false }
# The baked-data macros name these crates.
icu = { version = "2.3.1", default-features = false }
icu_pattern = { version = "0.5.0", default-features = false }
zerotrie = { version = "0.2.5", default-features = false }
zerovec = { version = "0.11.8", default-features = false }
icu_provider_export = { version = "2.3.0", default-features = false }
icu_time_data = "2.3.0"
postcard = { version = "1.1.3", default-features = false }

[workspace.lints.rust]
# Product crates add `#![forbid(unsafe_code)]` themselves. The bench crates need
# one `unsafe impl GlobalAlloc` (counting allocator) and `allow` it locally.
unsafe_code = "deny"
missing_debug_implementations = "allow"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Pedantic, minus the lints that are noise for this codebase.
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
# Client-path crates (mf2-catalog reader, mf2-runtime, mf2-fn-*, mf2-host-web,
# leptos-mf2) additionally deny, in their own lib.rs: clippy::unwrap_used,
# clippy::expect_used, clippy::indexing_slicing, clippy::panic, and forbid the
# fmt machinery on the client path (plans/06-size-and-perf.md, B12).

# Native benches (e.g. the parser gate) use `release`: cargo's opt-level 3 plus
# fat LTO.
[profile.release]
lto = "fat"

# Size-optimised client wasm (plans/06-size-and-perf.md §3). Always followed by
# `wasm-opt -Oz` before measuring.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
